# DeepSeek-V4-Pro (MoE) on one 8-GPU B300 node, TP4, nvfp4 weights and fp8 KV under vLLM, with
# MTP speculative decoding (K=2). A current frontier MoE model on a current chip. MTP K=2
# acceptance (AL 2.61) is pinned in the scenario so `blis run` needs no --speculative-* flag.
kind: Scenario
name: deepseek-v4-pro-b300-fp4-vllm-tp4-mtp2
engine_version: "0.29.0"

model: deepseek-v4-pro
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

acceptance:
  value:
    num_spec_tokens: 2
    acceptance_length: 2.61
    source: "SemiAnalysisAI/InferenceX golden_al_distribution (blis-registry acceptance/inferencex-golden-al.yaml): deepseek-v4-pro mtp K=2, thinking off, coding => AL 2.61"

cluster:
  hardware: b300
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: deepseek-v4-pro-b300-fp4-vllm-tp4-mtp2

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 4
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: nvfp4
      cache_dtype: fp8
      block_size: 256
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.92
      speculative:
        method: mtp
        num_spec_tokens: 2
