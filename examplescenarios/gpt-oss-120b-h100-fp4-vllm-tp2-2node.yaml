# gpt-oss-120b (MoE) on two 8-GPU H100 nodes, TP2 over 400G InfiniBand: 8 TP2 ranks, so up to
# --num-instances 8 replicas behind the router. The single-node gpt-oss-120b-h100-fp4-vllm-tp2
# deployment widened to a multi-node cluster (which must name its fabric), for the cluster,
# routing, admission and replay walkthroughs.
kind: Scenario
name: gpt-oss-120b-h100-fp4-vllm-tp2-2node
engine_version: "0.29.0"

model: gpt-oss-120b
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h100
  fabric: ib-400g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: gpt-oss-120b-h100-fp4-vllm-tp2-2node

pools:
  - role: colocated
    nodes: 2
    parallel:
      tp: 2
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: nvfp4
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.92
