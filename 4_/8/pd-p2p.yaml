# Prefill/decode over vLLM's peer-to-peer (p2p) KV tier instead of NIXL. The offload block gives every
# engine a CPU tier and, in connector_options, vLLM's kv_connector_extra_config.secondary_tiers with a
# p2p tier; pd_transfer names the OffloadingConnector. The decode engine loads each prompt from the
# prefill engine's CPU tier: the engines exchange control messages and the prefill node WRITEs the
# blocks across the fabric to the decode node. The tier has no device, so there is no tier: line for it.
# One TP8 engine per node, as in the reference run, so each prefill node and the decode node are
# distinct NIC endpoints.
#
#   blis run --scenarios examples/capabilities --scenario pd-p2p.yaml \
#     --num-instances 3 --prefill-instances 2 --decode-instances 1 --rate 2 --num-requests 6
kind: Scenario
name: pd-p2p
engine: {kind: vllm, version: "0.33.0"}

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric, cost-model-offload-tiers]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 3
  gpus_per_node: 8
---
kind: Deployment
name: pd-p2p

pools:
  - role: prefill
    nodes: 2
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
  - role: decode
    nodes: 1
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}

pd_transfer:
  connector: OffloadingConnector

offload:
  connector: OffloadingConnector
  spec: TieringOffloadingSpec
  tiers:
    - {tier: cpu_dram, bytes: 549755813888}
  connector_options:
    secondary_tiers: [{type: p2p, port: 5710}]

router:
  endpoint_picker_config: router/pd-always.yaml
