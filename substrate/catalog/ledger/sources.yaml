# licence (X12, D6). A source is redistributable, and its artefacts may be committed, only when
# its licence.spdx is on the allow-list (contracts/vocab/licence.go) and it lists no
# restriction. Nothing else grants it, so write an entry with care:
#
#   - Record the licence that governs the DATA, not the code that produces it or the
#     repository that hosts it. A repository's LICENSE file covers its code unless it says
#     otherwise; a dataset's README or card, or a separate data licence, is the evidence for
#     the data.
#   - Quote each file at a commit or dataset revision, never a branch: the URL, the file's
#     SHA-256, the lines and the quotation.
#   - Set spdx only to a licence that actually covers the data. When no file states terms for
#     the data, or the terms are unclear, set spdx to NOASSERTION, which is not on the
#     allow-list, say why in note, and quote any statement that narrows what may be done under
#     restrictions. The artefacts then stay out of the repository.
#   - When in doubt, commit only identifiers and hashes, as the unit lists do.
#   - Discuss anything unclear with the person you are working with, and record the conclusion
#     in the entry's note.
