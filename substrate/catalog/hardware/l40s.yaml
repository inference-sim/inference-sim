_comment: "TFlopsFP8=733 is DENSE FP8, consistent with TFlopsPeak=362.05 being DENSE BF16 (NVIDIA L40S datasheet: FP8 733 dense / 1466 sparse; BF16 362.05 dense / 733 sparse), giving a ~2.0x dense FP8:BF16 ratio (733/362.05=2.02, the datasheet dense pair; H100/H200 are exactly 2.0x). Corrected from the migrated 1466 (the WITH-SPARSITY figure, which mixed sparsity conventions for an architecturally-impossible 4.05x ratio) per https://github.com/inference-sim/blis-catalog/issues/2 / inference-sim#1738."
Provenance: vendor_spec
TFlopsPeak: 362.05
TFlopsFP8: 733.0
BwPeakTBs: 0.864
MemoryGiB: 48.0
_comment_tdp: "TDPWatts is the board power NVIDIA's L40S product page states in its specifications table, 'Max Power Consumption 350W' (https://www.nvidia.com/en-us/data-center/l40s/, read 2026-11-27; page sha256 3b9f7edbc37f2c6993cb2f93dbb39e5ad9fbfa1982ab01622640cbcad7704331). A configuration maximum, not a measurement: a deployment's draw depends on its workload, so an electricity-cost comparison must report it as the vendor maximum."
TDPWatts: 350
_comment_interconnect: "IntraNodeBwGBps is the on-package link as a per-GPU NOMINAL unidirectional bandwidth in GB/s: no NVLink, so peer-to-peer runs over PCIe Gen4 x16 (~32 GB/s per direction, vendor_spec). NOT measured effective throughput; any measured correction is a per-cluster blis-registry number. The inter-node fabric figure and the intra:inter ratio it feeds (#1530) live with the reusable Network fabric class (networks/ethernet-100gbe.yaml), paired with this chip per deployment (a cluster/pool concept, #1662)."
IntraNodeBwGBps: 32
_comment_sm: 'SMCount is the count of enabled Streaming Multiprocessors on the AD102 die as shipped in this part, from the NVIDIA datasheet (https://resources.nvidia.com/en-us-l40s/l40s-datasheet-28413). L40S enables 142 of the AD102 die''s 144 SMs. The cost model uses SMCount for two things: the per-SM share of peak FLOPs, and the 12-SM derate a Triton-path KV fetch withholds while it overlaps a forward pass (cost model §8.3), which is 8.45% at this part''s 142 SMs.'
SMCount: 142
_comment_cc: "ComputeCapability is the CUDA compute capability NVIDIA lists for this part (https://developer.nvidia.com/cuda-gpus). A model graph that differs by GPU generation resolves its architecture overlay by the major version, so a chip that states none cannot run such a graph."
ComputeCapability: "8.9"
_comment_host_cpu: "HostCPU is the architecture of the CPU that drives the GPUs, the packaging fact an engine-path coefficient (host, scheduler and launch cost) is scoped by (coefficient.Scope.HostCPU). CAVEAT: this is a PCIe card and NVIDIA's product pages state no host CPU for it (checked: the product page and the NVIDIA-Certified Systems page name none). x86 is this catalog's packaging convention for a PCIe server part, not a vendor statement; it is recorded so that the engine-path coefficients already carried for this chip keep applying to it, and is to be replaced by a cited figure when a measured host is available."
HostCPU: x86
