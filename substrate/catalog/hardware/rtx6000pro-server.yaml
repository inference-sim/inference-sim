_comment: "NVIDIA RTX PRO 6000 Blackwell Server Edition, the passively cooled PCIe data-center card on the GB202 die. The file is named rtx6000pro-server because InferenceX labels this part rtx6000pro and the Workstation Editions of the same die are different products (1792 GB/s, other clocks), each its own entry if one is added (SUB-3). NVIDIA's product page (https://www.nvidia.com/en-us/data-center/rtx-pro-6000-blackwell-server-edition/) states FP4 Tensor Core 4 PFLOPS, FP8 Tensor Core 2 PFLOPS and FP16/BF16 Tensor Core 1 PFLOP, 96 GB GDDR7, a 512-bit interface and 1597 GB/s; the NVIDIA datasheet (document 3850600, Apr25, partner copy at https://www.pny.com/en-eu/file%20library/professional/datasheet/data%20center%20cards/pny-nvidia-rtx-pro-6000-blackwell-server-edition-datasheet.pdf) states 'Peak FP4 AI PFLOPS 4 PFLOPS', '96 GB GDDR7 with ECC', 'Memory bandwidth 1597 GB/s' and 'Graphics bus PCI Express 5.0 x16'. Those Tensor Core figures are SPARSE, though neither page says so: NVIDIA's RTX Blackwell PRO GPU Architecture whitepaper v1.0, Appendix A (https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1.0.pdf), gives every GB202 Tensor Core rate as dense/sparse with footnote 2 'Effective TOPS / TFLOPS using the Sparsity Feature', and its 188-SM, 600 W GB202 column reads BF16 503.8/1007.6, FP8 1007.6/2015.2 and FP4 2015.2/4030.4 TFLOPS: the product page's 1, 2 and 4 PFLOPS are the sparse column. The dense peaks here are therefore one half of NVIDIA's stated figures: BF16 500, FP8 1000, FP4 2000 TFLOPS. They are rounded as NVIDIA rounds them; the whitepaper's 503.8 is the Workstation Edition at its 2617 MHz boost clock, which no Server Edition document states. AISimulate's descriptor for this part (systems/rtx_pro_6000_server.yaml at ai-dynamo/aisim 6fdf6fb6, pull manifest SHA-256 3978c68acbafb31346af3dc4bb51e9df34529d546a2cc03d6458f6c09dcaf8c0) records 467.8 dense BF16, 935.6 FP8 and 1871.2 FP4 TFLOPS, the whitepaper's figures scaled to the 2430 MHz maximum SM clock its collection host reported; that is a measured clock, not a datasheet peak, and the lower figure is not used here so that SUB-5's bound stays the datasheet's. BwPeakTBs is the datasheet's 1597 GB/s. AISimulate's descriptor carries 1.792 TB/s, which is the Workstation Edition's figure (whitepaper Appendix A), not this part's."
Provenance: vendor_spec
FieldProvenance:
  MemoryGiB: "measured:NVIDIA RTX PRO 6000 Blackwell Server Edition"
TFlopsPeak: 500.0
TFlopsFP8: 1000.0
TFlopsNVFP4: 2000.0
BwPeakTBs: 1.597
_comment_memory: "MemoryGiB is the device total nvidia-smi reports on this part, 97887 MiB = 95.5928 GiB, as AISimulate's descriptor records it from its collection host ('mem_capacity: 102641958912 # 97887 MiB reported by nvidia-smi', systems/rtx_pro_6000_server.yaml at ai-dynamo/aisim 6fdf6fb6). The datasheet's 96 GB is not used: read as decimal it is 89.4 GiB, below what the device has, and read as GiB it is above it. No public log found states the CUDA driver's total for this part, the figure vLLM multiplies by gpu_memory_utilization (see hardware/h200.yaml). On H200 and GB200 that total is 0.6 and 1.0 GiB below nvidia-smi's, so this figure may overstate usable memory by about 1%; a driver-total reading replaces it when one is found. Measured, not vendor_spec; the rest of this file is vendor_spec."
MemoryGiB: 95.5928
_comment_interconnect: "IntraNodeBwGBps is the per-GPU NOMINAL unidirectional link to the other GPUs of a node: this part has no NVLink (neither the product page nor the datasheet lists one), so peer-to-peer traffic runs over its PCI Express 5.0 x16 graphics bus (datasheet), 32 GT/s x 16 lanes = 64 GB/s per direction before encoding, vendor_spec, as hardware/l40s.yaml states PCIe Gen4 x16 as 32. AISimulate's descriptor states the same 64 GB/s for intra_node_bw and pcie_bw. NOT measured effective throughput; a measured correction is a per-cluster registry number. GPUsPerNode is not stated: the part is a PCIe card and its node size is a property of the server it is installed in, so a scenario states it (SUB-3). AISimulate's collection host and InferenceX's runner are both 8-GPU servers. The inter-node fabric is a networks/ class paired with this chip per deployment."
IntraNodeBwGBps: 64
_comment_sm: "SMCount is 188 enabled Streaming Multiprocessors. NVIDIA states 24,064 CUDA cores and 752 fifth-generation Tensor Cores for this part (product page and datasheet, above), and the architecture whitepaper (above, Appendix A) gives GB202 128 CUDA cores and 4 Tensor Cores per SM and lists 188 SMs for the 24,064-core GB202 parts: 24,064 / 128 = 752 / 4 = 188. The full GB202 die has 192. The datasheet's 188 fourth-generation RT Cores, one per SM, agree. This is a datasheet derivation, not a device report. The cost model reads SMCount for the derate a concurrent KV fetch causes: the 12 SMs a Triton-path fetch withholds while it overlaps a forward pass (cost model §8.3), 6.38% at 188 SMs."
SMCount: 188
_comment_cc: "ComputeCapability is the CUDA compute capability NVIDIA lists for this part (https://developer.nvidia.com/cuda-gpus: 'NVIDIA RTX PRO 6000 Blackwell Server Edition' under 12.0). It is SM120, not the SM100 of B200 and GB200, so a model graph or a kernel lane that differs by GPU generation does not take B200's."
ComputeCapability: "12.0"
