  not_measured:
    - >-
      The layout sweep (layouts.csv): 32 layout classes of the Dynamo vLLM prefill/decode runs whose pools carry no data-parallel attention, 52 of the 188 topologies and 167 of the 445 artifact points, at the pool shapes those points use. Pools with data-parallel attention have no bound, and neither does kimik2.5 on gb300 at 1P7D (its recipe states no chunked prefill with a connector, which the engine refuses, blis-vllm#214).
    - >-
      The layout sweep simulates each layout with the engine settings the frozen recipes state (flags the engine does not model are listed per shape in layouts.json), on the catalog fabric of the chip: ib-400g for b200 and gb200-nvl72, ib-800g for b300 and gb300 (b300 is documented as RoCE 800G, so its fabric is an estimated substitution), and 8 GPUs per node (4 on gb200-nvl72 and gb300). The build's kernel encodes vLLM v0.31.0 behaviour though the scenario declares 0.33.0 (inference-sim#150); the bound names the release difference.
    - >-
      In runs.csv (the first evidence file): one model (minimax-m2.5) on one part (gb200-nvl72) over NIXL on ib-400g, served by vLLM 0.32.0. Another model or part moves where the pools saturate, and with it where the large ratios sit.
    - Closed-loop clients with fixed prompt and output lengths. No run had a prefix shared between requests, a session of several turns, a spread of lengths, or an open-loop arrival rate.
    - >-
      In runs.csv: concurrency 16, 64, 256 and 1024 only, and the pool shapes 1P3D, 2P3D, 3P2D and 4P1D only, with one-GPU prefill instances and four-GPU decode instances (tensor parallel 4 with expert parallelism). Counts between the swept points, and larger pools, were not run.
    - The ratios are policy sensitivity, not substitution error. They say how far BLIS's own figures move when the policy changes, between policies inside BLIS. No run behind Dynamo was compared with a run of BLIS, so how far Dynamo's real behaviour is from either policy is not measured.
    - The regime is exact. A point whose client count is not one of those listed, or whose model, part, engine release, fabric, instance layout or pool shape is not the one named, has no bound for this regime and stays router_unsupported; nothing is interpolated between the sampled counts, and time to first token has a sharp knee between them.
    - Time to first token, at 64 to 256 clients, is where the ratios against the policies that read load are large. The bound does not hold tightly there, and a ranking by TTFT p50 or p99 in that regime should not rest on this substitution. Time per output token and throughput move far less, except at the extremes of concurrency.
