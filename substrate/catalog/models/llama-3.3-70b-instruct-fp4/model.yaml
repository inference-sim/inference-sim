name: llama-3.3-70b-instruct-fp4
# config.json states no quantization: ModelOpt states it in hf_quant_config.json, which vLLM
# reads and the deriver does not. The layout is in each shard's safetensors header, which the
# deriver reads (SUB-15): every linear in the decoder layers is
# NVFP4 (U8 weights with an F8_E4M3 scale per 16 values), and the embedding, norms and lm_head
# are BF16. The headers are fetched by range request and not
# committed; each is pinned here by the SHA-256 of its header bytes. The card's licences are the
# NVIDIA Open Model License and the Llama 3.3 Community License, neither on the allow-list, so
# only the config's hash and the derived graph are committed (X12).
