name: nemotron-3-super-120b-a12b-nvfp4
# config.json states a ModelOpt MIXED_PRECISION checkpoint: a quantized_layers map names each quantized module by layer. The routed experts are NVFP4 (group 16) and nearly every Mamba projection, latent projection and shared expert is FP8, but the map is ragged: the first MoE layer stores its shared down projection NVFP4 beside an FP8 up projection, and three layers leave one shared projection out of the map, which vLLM stores unquantized. The deriver gives each outcome its own layer kind. The card licence is the NVIDIA Nemotron Open Model License, which is not on the allow-list, so only the config hash and the derived graph are committed (X12).
