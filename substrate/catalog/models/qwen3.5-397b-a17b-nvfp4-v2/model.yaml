# A different checkpoint from nvidia/Qwen3.5-397B-A17B-NVFP4 (qwen3.5-397b-a17b-nvfp4): its
# config.json states quant_method modelopt_mixed, quant_algo MIXED_PRECISION, and a
# quantized_layers map that stores attention q/k/v/o, the Gated DeltaNet in_proj_qkv, in_proj_z
# and out_proj and the shared experts at FP8 and the routed experts at NVFP4 (group 16). The
# DeltaNet in_proj_a/in_proj_b, conv1d and the MTP module are left unquantized. The shards'
# safetensors headers, read by range request and not committed, state the same layout.
