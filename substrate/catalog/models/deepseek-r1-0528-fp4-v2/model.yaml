name: deepseek-r1-0528-fp4-v2
# config.json states no quantization: ModelOpt states it in hf_quant_config.json, which vLLM
# reads and the deriver does not. The layout is in each shard's safetensors header, which the
# deriver reads (SUB-15): the routed and shared experts, the dense MLPs and o_proj are NVFP4;
# the latent projections, the router, the head and the whole MTP layer 61 are BF16. The headers
# are fetched by range request and not committed; each is pinned here by the SHA-256 of its
# header bytes (X12). nvidia/DeepSeek-R1-0528-NVFP4-v2 resolves to this repository at the same
# revision.
