# RoCE (RDMA over Converged Ethernet, 400 Gb/s) — reusable inter-node fabric CLASS.
# Per inference-sim#1662 a fabric is a property of the cluster/pool, not of the
# GPU die, so it is defined once here and paired with a chip per deployment.
Provenance: vendor_spec
InterNodeBwGBps: 50
_comment_interconnect: "RoCE (GPUDirect RDMA over Converged Ethernet): one 400 Gb/s ConnectX-7 Ethernet port per GPU (1:1 GPU:NIC rail). InterNodeBwGBps is the NOMINAL line rate — 400 Gb/s / 8 = 50 GB/s per GPU, per direction — NOT a measurement; real RDMA payload throughput runs below nominal. Line-rate evidence: NVIDIA's ConnectX-7 datasheet (https://www.nvidia.com/content/dam/en-zz/Solutions/networking/ethernet-adapters/connectx-7-datasheet-Final.pdf; file sha256 114c55f948c1242677c965c279537d0341f8ac0245e7e442798bb4dbb56b17ec) lists '1 x 10/25/40/50/100/200/400GbE', 'Up to 400Gb/s total bandwidth' and 'RoCE, Zero Touch RoCE'. It is the same NIC and the same 50 GB/s as networks/ib-400g.yaml, carried over Ethernet instead of InfiniBand NDR. Parts that use this class: h100, h200, b200 and gb200-nvl72 (its inter-rack fabric) on a RoCE deployment; b300 and gb300 are 800 Gb/s (roce-800g). The effective / nominal correction is not stated here; it is registry/coefficients/cost-model-fabric.yaml's fabric_bandwidth_efficiency, which for this class is an assumption (equal to ib-400g's), not a measurement. Paired with a chip's on-node IntraNodeBwGBps, only the RATIO prices cross-node collective traffic (#1530); that ratio is a per-deployment (chip + fabric) quantity, resolved wherever a chip and fabric are paired."
_comment_pd_transfer: "PD KV-transfer over this fabric uses this same InterNodeBwGBps (50 GB/s nominal) as its nominal bandwidth, as on networks/ib-400g.yaml — there is no separate PD bandwidth figure and no PD base-latency field."
