# RoCE (RDMA over Converged Ethernet, 800 Gb/s per GPU) — reusable inter-node fabric CLASS.
# Per inference-sim#1662 a fabric is a property of the cluster/pool, not of the
# GPU die, so it is defined once here and paired with a chip per deployment.
Provenance: vendor_spec
InterNodeBwGBps: 100
_comment_interconnect: "RoCE over NVIDIA Spectrum-X Ethernet: 800 Gb/s of ConnectX-8 connectivity per GPU. InterNodeBwGBps is the NOMINAL line rate — 800 Gb/s / 8 = 100 GB/s per GPU, per direction — NOT a measurement; real RDMA payload throughput runs below nominal. Line-rate evidence: NVIDIA's Blackwell Ultra Datasheet (document 4169750, Oct 2025; PDF https://dam-cdn.nvd.orangelogic.com/AssetLink/1k0p832eq8r5ca0u5383ie5o4tp3bst1.pdf; file sha256 ccdffc064731cc160016f4c7a77ecfa37983038bcaf60e39190ba4175b39c7c8) states, for the GB300 NVL72, that the ConnectX-8 SuperNIC IO module 'hosts two ConnectX-8 devices, providing 800 gigabits per second (Gb/s) of network connectivity for each GPU', delivering RDMA 'with either NVIDIA Quantum-X800 InfiniBand or Spectrum-X Ethernet networking platforms'. The 800 Gb/s per GPU is therefore two Ethernet ports: the ConnectX-8 SuperNIC User Manual (https://networking-docs.nvidia.com/connectx8hw/specifications, C8180) lists Ethernet at 400/200/100 Gb/s per port (InfiniBand XDR is 800 Gb/s per port), so this class is two 400 Gb/s ports per GPU aggregated, not one 800 GbE port. How a deployment aggregates them (rails, bonding, or striping a single transfer over both) is not stated by either source, and the class assumes the full 100 GB/s is available to one transfer, as ib-800g does. Parts that use this class: b300 (HGX B300) and gb300 (its inter-rack fabric) on a RoCE deployment; b200, h100, h200 and gb200-nvl72 are 400 Gb/s (roce-400g). The effective / nominal correction is not stated here; it is registry/coefficients/cost-model-fabric.yaml's fabric_bandwidth_efficiency, which for this class is an assumption (equal to ib-400g's), not a measurement. Paired with a chip's on-node IntraNodeBwGBps, only the RATIO prices cross-node collective traffic (#1530); that ratio is a per-deployment (chip + fabric) quantity, resolved wherever a chip and fabric are paired."
_comment_pd_transfer: "PD KV-transfer over this fabric uses this same InterNodeBwGBps (100 GB/s nominal) as its nominal bandwidth, as on networks/ib-800g.yaml — there is no separate PD bandwidth figure and no PD base-latency field."
