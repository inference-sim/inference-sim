      rationale: >
        The floor of DeepSeek-V4.1-Flash's FULL_AND_PIECEWISE capture estimate, 0.791 GiB per rank: the intercept of M against the capture ceiling. THE FORM the kernel reads all or none: floor + per_mixed_token x C_mixed + per_decode_token x C_decode, C_mixed the capture ceiling and C_decode the largest uniform-decode FULL graph (each capture size rounded up to 1 + K, kept within max_num_seqs requests and the ceiling). It is what vLLM v0.31.0 takes from the KV budget for graphs: the profile_cudagraph_memory estimate, subtracted by determine_available_memory. FIT on five InferenceX H200 TP8 start-ups of this model (vLLM 0.29.1rc1.dev128+gcd10ed6f9; K 5, max_num_seqs 1024, mnbt 8192; per rank, GiB, E the logged estimate, M the profiling pass's capture): C 64: decode 60, E 1.69, M 1.34, fit +1.76; C 128: decode 120, E 2.71, M 1.93, fit +2.74; C 256: decode 252, E 4.90, M 3.32, fit +4.76; C 512: decode 498, E 8.61, M 5.49, fit +8.69; C 1024: decode 1008, E 16.67, M 10.30, fit +16.66. THE SPLIT is the source's, not fitted: the estimate is M - samples + first + (n_full - 1) x second, so E - M is the uniform-decode FULL family alone and gives the decode slope (through the origin); M gives the floor and the mixed slope. The fit arm holds max_num_seqs at 1024, so it cannot separate the slopes, and M also holds the drafter and two sampled FULL graphs, which follow the decode ceiling: the max_num_seqs sensitivity is UNDERSTATED. VERSION: the logs are a nightly; the estimate's code path (profile_cudagraph_memory, _extrapolate_full_graph_memory, CudaGraphManager._init_candidates, capture_model, the subtraction) is unchanged between cd10ed6f9 and v0.31.0 except prepare_inputs_to_capture's max_query_len, which for a uniform-decode graph is 1 + K either way; the model's own forward did change (vllm/models/deepseek_v41), which this cannot rule out moving the magnitude. SCOPE h100 and h200: one per-rank figure, since both run the same SM90 kernels (FLASHMLA_SPARSE_DSV41, Marlin MXFP4 experts, Marlin MXFP8 linears in the logs); TP-invariant per rank (TP4 and TP8 log 8.59 / 8.61 GiB at C 512). HELD OUT, not used: InferenceX H100 TP8 and H200 TP4, and the H200 calibration runs' boot-time pools. UNITS: the floor is bytes_per_rank and the two per-token entries are bytes_per_token, which the closed units vocabulary now has. Reproduce with scripts/fit_deepseek_v41_capture.py.
