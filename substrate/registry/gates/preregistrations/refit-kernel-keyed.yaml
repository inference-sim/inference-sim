# Pre-registration of a refit family (M3.2 plan Table W row 18). Fixed before any fit reads the
# sources below; thresholds are the section 1.5 defaults of ../defaults.yaml and roles are drawn
# per role key (requirements 1.4). Nothing in this file is a result. A change that touches a
# coefficient set of this family states its own lanes and one idea in the dashboard's gate
# pre-registration (state/gate/preregistrations/); this record fixes what the family may read
# and the bar it is held to.
kind: CalibrationPreRegistration
id: refit-kernel-keyed
partition_version: 1
hypothesis: "Refitting the kernel-keyed coefficients, which both engines read, on the fit share of the sources below lowers the error on the lanes that run the refit kernels and raises it on no lane of either engine."
layer: "coefficient: kernel-keyed attention, collective, primitive and recurrent sets (design section 3.2, shared across engines)"
predicted_change: "Relative error on tpot_us and ttft_us does not rise on any lane of either engine (margin 0), and falls on the target lanes the change names."
coefficient_class: kernel-keyed
coefficient_sets: [cost-model-attention, cost-model-collectives, cost-model-collectives-inferencex, cost-model-primitives, cost-model-recurrent]
target_engines: [vllm, sglang]
sources: [aisimulate, aisimulate-fpm, inferencex, sglang-nightly, sglang-traces, vllm-ci-perf]
target_lanes:
  - {engine: vllm}
  - {engine: sglang}
criteria:
  - {criterion: error, margin: 0}
  - {criterion: distance, margin: 0}
metrics: [tpot_us, ttft_us]
min_points: 10
substream: gate/refit-kernel-keyed
