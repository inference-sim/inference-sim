# Pre-registration of a refit family (M3.2 plan Table W row 18). Fixed before any fit reads the
# sources below; thresholds are the section 1.5 defaults of ../defaults.yaml and roles are drawn
# per role key (requirements 1.4). Nothing in this file is a result. A change that touches a
# coefficient set of this family states its own lanes and one idea in the dashboard's gate
# pre-registration (state/gate/preregistrations/); this record fixes what the family may read
# and the bar it is held to.
kind: CalibrationPreRegistration
id: refit-engine-path-vllm
partition_version: 1
hypothesis: "Refitting the vllm engine-path host-overhead coefficients, keyed by that engine's CodeIDs, on the fit share of the sources below lowers the error on the vllm lanes and leaves the other engine's lanes as they were."
