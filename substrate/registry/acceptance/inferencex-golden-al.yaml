  The source names the drafter but not the revision it was measured at, so the profile may
  describe a revision other than the catalog entry''s.'
- Collection settings are transcribed from identities.yaml at e63beeeee981, SHA-256 447547adf1b3f73a3d03482dea2d031fc4755cc4f0f91eba4a308ca2fd5ef039
