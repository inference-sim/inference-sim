name: nightly config fetch

# X12: a model whose config.json licence is not on the allow-list commits only the file's
# hash (model.yaml config.sha256) and its source revision. This job, which alone holds the
# Hugging Face access token, fetches each such file at its pinned revision, checks its hash,
# and re-derives the graph with derive_graph.py --check --fetched. It also fetches the shard
# index and safetensors headers an entry pins (model.yaml shard_index and headers, SUB-15),
# which need no token. Pull-request jobs need no
# secret for a public repository: the catalog job fetches those without a token and re-derives
# them, and checks only the hash, the revision and the graph's derived_from hash for a gated one.
#
# The token is the HF_TOKEN secret of the protected environment "config-fetch", whose branch
# policy allows only main. A person creates the environment and the secret.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    name: fetch and re-derive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: config-fetch
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r catalog/scripts/requirements-dev.txt
      # The script fetches each pinned config.json with the token, and each pinned shard index and
      # safetensors header without one (SUB-15). --require-all fails on anything left unfetched,
      # since this job must re-derive every graph.
      - name: Fetch every pinned config.json, shard index and header at its revision
        working-directory: catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/fetch_pinned_configs.py "$RUNNER_TEMP/fetched" --token-env HF_TOKEN --require-all
      - name: Re-derive every graph, the pinned ones from the fetched files
        working-directory: catalog
        run: python3 scripts/derive_graph.py --check --fetched "$RUNNER_TEMP/fetched"
