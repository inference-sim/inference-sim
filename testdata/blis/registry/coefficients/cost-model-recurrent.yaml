# Recurrent (linear-attention) primitive — every entry from NVIDIA AISimulate.
#
# The cost model priced a recurrent state update at zero. On the two hybrid models in the
# catalog that kernel fires on 44 percent of layers (Nemotron-3-Ultra: 48 mamba of 108) and
# 100 percent (Kimi-K3: 69 KDA layers), so pricing it at nothing omitted a real term.
#
# The form matches the attention and collective primitives — a launch-and-setup floor that a
# large batch amortizes, plus a token rate:
#
#     latency = recurrent_decode_floor + tokens / recurrent_decode_rate
#
# fitted by minimising the mean absolute log ratio. Reproduce with scripts/fit_recurrent.py.
#
# COVERAGE, which differs sharply between the two families and is the most important thing
# on this page:
#
#   KDA is COMPLETE. The sweep carries the convolution and the recurrent scan as separate
#   kernels and a fused decode variant covering both. The fused figure is used, because it
#   is both the better fit (1.16x against 1.33x and 1.55x) and the path a real decode takes.
#
#   MAMBA2 is INCOMPLETE and its entry is a LOWER BOUND. Its sweep carries only the
#   convolution — `causal_conv1d_fn` and `causal_conv1d_update`. The selective-scan kernel
#   that is the rest of a Mamba2 layer appears in no collection in the tree. So the mamba
#   entry prices the convolution and nothing else, and a Mamba2 layer costs more than it
#   says. The method is `measured` because the convolution measurement is real; the
#   rationale is where the incompleteness lives, and a reader pricing a Mamba2 model should
#   treat the recurrent term as a floor rather than an estimate.
#
# KDA is fitted for h100, h200 and gb300; mamba2 for h100. The tree carries KDA sweeps for
# eight parts (b200, b300, gb200, gb300, h100, h200, l40s, rtx_pro_6000_server) and
# linear_attention sweeps for nine, so the remaining parts are UNFITTED rather than
# unavailable. A part with no entry resolves none and falls through to a cheaper path
# silently, so each is a gap to close when a deployment needs it -- not a statement that
# the data is missing.
#
# The unfitted parts are fittable today: scripts/relane_recurrent_kda.py prints b200 at
# 5.7us/0.452, b300 at 4.6us/0.455 and gb200 at 7.3us/0.455 from the same collection, each
# with per-kernel geometric error at or below 1.11x. They are not committed because
# methodology.md requires an end-to-end check per part and none of those three carries a
# KDA model in any evaluation corpus. L40S fits far worse (1.549x and 2.636x) and would
# need its own justification rather than this one.
kind: CoefficientSet
name: cost-model-recurrent

coefficients:
  - recurrent_decode_floor_kda:
      value: 3.8
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        The minimum cost of one KDA layer's decode-phase state update. vLLM's NVIDIA path runs causal_conv1d_update and then fused_recurrent_kda_packed_decode for the same step (vllm/models/kimi_k3/nvidia/kda.py:980-993), so a layer costs the SUM: 2.8000000000000003us + 1.0us. Fitted at num_k_heads=96, which is what Kimi-K3's graph declares; the kernel's coefficient carries no head term, so the fitted geometry must be the model's. Per-kernel geometric error 1.054x and 1.179x. The fused kernel this entry previously used is AMD-only (amd/ops/kda_decode.py gates on gfx942/gfx950) and runs on no CUDA deployment.
  - recurrent_decode_rate_kda:
      value: 0.235
      units: tokens
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        Tokens per microsecond past the floor. The two kernels run in series, so their times add and the reciprocal rates add: 1/4.0 + 1/0.25 tok/us. The recurrent scan dominates, being sequential in the state dimension -- it cannot spread one sequence's work across the machine the way a matmul spreads a batch's. Fitted on the vLLM lane at num_k_heads=96.
  - recurrent_decode_floor_kda:
      value: 4.3
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        The h200 counterpart of the h100 entry above, fitted by the same command on the same vLLM collection version for the h200_sxm part: 3.3us + 1.0us. Added because a KDA model priced on h200 previously resolved no recurrent entry at all and fell through to a cheaper path, which on GLM-5.3-Flash -- 34 of its 45 layers are KDA -- made an h200 prefill read 9.4x FASTER than the same step on h100 despite the two parts sharing the GH100 die. That gap was an artifact of the missing coefficient, not a measurement. Per-kernel geometric error 1.069x and 1.321x. The floor is 1.13x the h100 figure and the rate within 1.01x, which is the expected result for a shared die: this entry exists so the part resolves its own measurement rather than to express a difference.
  - recurrent_decode_rate_kda:
      value: 0.237
      units: tokens
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        Tokens per microsecond past the h200 floor. Same series composition as the h100 entry: 1/4.5 + 1/0.25 tok/us, the recurrent scan dominating because it is sequential in the state dimension. Fitted on the vLLM lane at num_k_heads=96, the geometry Kimi-K3's graph declares, since the coefficient carries no head term.
  - recurrent_decode_floor_kda:
      value: 7.4
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [gb300]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/gb300/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        The minimum cost of one KDA layer's decode-phase state update on gb300. vLLM's NVIDIA path runs causal_conv1d_update and then fused_recurrent_kda_packed_decode for the same step (vllm/models/kimi_k3/nvidia/kda.py:980-993), so a layer costs the SUM: 4.6000000000000005us + 2.8000000000000003us. Fitted at num_k_heads=96, which is what Kimi-K3's graph declares; the kernel's coefficient carries no head term, so the fitted geometry must be the model's. Per-kernel geometric error 1.045x and 1.051x. The fused kernel an earlier revision used is AMD-only (amd/ops/kda_decode.py gates on gfx942/gfx950) and runs on no CUDA deployment.
  - recurrent_decode_rate_kda:
      value: 0.457
      units: tokens
      method: measured
      fitted: true
      scope: {hardware: [gb300]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/gb300/kda/vllm/0.1.dev19262/kda_perf.parquet, kernels causal_conv1d_update + fused_recurrent_kda_packed_decode summed, generation phase, num_k_heads=96, model moonshotai/Kimi-K3, 11 and 10 points", role: primary}
      rationale: >
        Tokens per microsecond past the gb300 floor. The two kernels run in series, so their times add and the reciprocal rates add: 1/5.25 + 1/0.5 tok/us. The recurrent scan dominates, being sequential in the state dimension -- it cannot spread one sequence's work across the machine the way a matmul spreads a batch's. Fitted on the vLLM lane at num_k_heads=96.
  - recurrent_decode_floor_mamba2:
      value: 3.5
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/linear_attention/trtllm/1.3.0rc20/mamba2_perf.parquet, kernel causal_conv1d_update, generation phase, model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4, 11 points", role: primary}
      rationale: >
        A LOWER BOUND on one Mamba2 layer's decode-phase cost, not the cost.

        This is the convolution alone. The sweep carries `causal_conv1d_fn` and
        `causal_conv1d_update` and nothing else; the selective-scan kernel that does the
        rest of a Mamba2 layer is in no collection in this tree. Geometric error 1.120x
        against the convolution's own measurements, which says the fit is good and says
        nothing about the missing kernel.

        Fitted on the rows naming Nemotron-3-Ultra specifically rather than pooling all six
        mamba2 models in the sweep, because pooling gives floor 4.2 and rate 23.25 — a much
        higher rate driven by the smaller models — and a per-model figure is the right one
        when the model is the one being priced.

        To complete this: measure a selective-scan kernel, or take the difference between a
        full Mamba2 layer's latency and this convolution figure if a layer-level measurement
        becomes available.
  - recurrent_decode_rate_mamba2:
      value: 8.5
      units: tokens
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/linear_attention/trtllm/1.3.0rc20/mamba2_perf.parquet, kernel causal_conv1d_update, generation phase, model nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4, 11 points", role: primary}
      rationale: >
        Tokens per microsecond past the floor, for the convolution alone. Higher than KDA's
        1.5 because a depthwise convolution over four taps is far less work than a gated
        delta-rule update — and because this figure is missing the scan that would lower it.

# 8 entries: a floor and a rate for KDA on h100, h200 and gb300, and the mamba2 pair on
# h100. Regenerate or extend with scripts/relane_recurrent_kda.py (--insert CHIP for a
# part the set does not carry yet).
