      rationale: >
        The minimum cost of a prefill attention kernel, independent of prompt length. A context kernel sets up a causal mask and tiles over a two-dimensional problem where a generation kernel walks one row, so this sits above the decode floor on every part. Fitted jointly with attention_prefill_work_scale over 27693 points on the vLLM lane (vllm/0.25.0); the pair takes the geometric error from 25.3x under a FLOPs-only model to 1.511x.
  - attention_prefill_work_scale:
      value: 0.4
      units: dimensionless
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/attention/vllm/0.25.0/context_attention_perf.parquet (NVIDIA H200), 27693 full-attention points", role: primary}
      rationale: >
        The fraction of the dense-GEMM efficiency ramp a prefill attention kernel reaches: 0.40, so it achieves well under what a well-shaped matmul does at the same token count, which is why reusing the ramp unmodified under-predicts. This is a fraction OF THE bf16 ramp this registry carries, so it is only valid against that ramp -- a relane of gemm_eps_max_bf16 changes the denominator and this value must be refitted with it. Fitted jointly with attention_prefill_floor over 27693 points (vllm/0.25.0); geometric error 1.511x.
