      rationale: >
        ASSUMED, not measured: NCCL sweeps this part at 2 and 4 ranks only, because a Grace-Blackwell tray is four GPUs, while tp=8 is an ordinary deployment on it. DIMENSION (derived). floor(n) = a + b*(n-1), fitted on this part's OWN measured widths: 8.09us at 2 ranks and 11.04us at 4 give 16.94us at 8. Validated as a holdout on the NVLink parts that DO carry 8-rank data -- predicted/measured median 1.021x over 8 cells, range 0.976-1.086x. The textbook ring hop-count model was REFUTED first: it predicts a 4->8 ratio of 1.167 against a measured median of 1.703, so a collective floor is dominated by per-rank synchronisation rather than hop count. MAGNITUDE (the caveat). Extrapolated, never borrowed from another part. PCIe parts are excluded from the reference class: their 8/4 ratios reach 2.7x-4.2x because an 8-rank group crosses a different fabric, where this part's descriptor states inter_node_bw == intra_node_bw == 900 GB/s so a tray boundary inside the rack is no bandwidth change. TO REPLACE THIS WITH A MEASUREMENT: an 8-rank NCCL sweep for this part. One sweep retires every assumed entry here at once.
