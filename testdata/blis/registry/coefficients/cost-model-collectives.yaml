  - collective_floor_all_reduce_fp16_2rank_h200:
      value: 4.38
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/comm/vllm/0.24.0/custom_allreduce_perf.parquet (vLLM 0.24.0 custom all-reduce, CUDA-graph lane, NVIDIA H200), 23 messages at 2 ranks", role: primary}
