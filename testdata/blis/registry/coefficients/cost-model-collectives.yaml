      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/comm/vllm/0.24.0/custom_allreduce_perf.parquet (vLLM 0.24.0 custom all-reduce, CUDA-graph lane, NVIDIA H100 80GB HBM3), 23 messages at 2 ranks", role: primary}
