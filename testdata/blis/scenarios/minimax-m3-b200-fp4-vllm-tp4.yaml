# minimax-m3 on b200, fp4 under vllm,
# as NVIDIA's AISimulate end-to-end accuracy artifact records this deployment.
#
# GENERATED by scripts/gen_aisimulate_scenarios.py from the corpus's own topology
# record. Re-run after a corpus update rather than editing here.
#
# Topology states: tp_size 4, pp_size 1, attention_dp_size 1,
# moe_ep_size 1, moe_tp_size 4. Workloads scored at this
# deployment: 1k1k, 8k1k.
#
# max_num_seqs, block_size, gpu_memory_utilization and cudagraph_mode are engine
# defaults: the comparison scores a ratio across concurrency at a fixed deployment,
# so a constant cancels. max_model_len is derived from the workload instead, since a
# window shorter than isl+osl would describe a deployment that cannot serve its
# own points.
kind: Scenario
name: minimax-m3-b200-fp4-vllm-tp4
engine_version: "0.29.0"

model: minimax-m3
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent]

cluster:
  hardware: b200
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: minimax-m3-b200-fp4-vllm-tp4

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 4
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: nvfp4
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
