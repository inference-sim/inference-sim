# A nine-node deployment: expert parallelism wide enough that a rank holds a small
# fraction of the experts, which is what distinguishes it from the ep16 fixture.
#
# Replaces an earlier fixture whose model is not in blis-catalog; MiniMax-M2.5 is used for
# the reasons given in minimax-m25-h200-ep16.yaml. One deliberate difference from the file
# it replaces: that one enabled MTP speculation and MiniMax-M2.5's graph declares no
# speculator, so this carries none. No test using this fixture asserts anything about
# speculation -- they assert that a wider expert-parallel group holds fewer expert weights
# per rank, and that the routed term divides by the local expert share.
kind: Scenario
name: minimax-m25-h200-ep72
engine_version: "0.29.0"

model: minimax-m2.5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 9
  gpus_per_node: 8
---
kind: Deployment
name: minimax-m25-h200-ep72

pools:
  - role: colocated
    nodes: 9
    parallel:
      tp: 8
      pp: 1
      dp: 9
      enable_expert_parallel: true
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
