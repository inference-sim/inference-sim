# GLM-5 on one 8-GPU H200 node, as the AISimulate end-to-end accuracy snapshot records it.
#
# Every field below is stated by that snapshot's own topology record rather than inferred:
# framework sglang, precision fp8, serving aggregated, and the parallelism block
# {tp_size: 8, pp_size: 1, moe_tp_size: 8, moe_ep_size: 1, attention_dp_size: 1}. The
# moe_ep_size of 1 is why expert parallelism is off here — each rank holds every expert at a
# tensor-parallel slice, which is the case the kernel's expertTensorShards term covers.
#
# The snapshot does NOT state max_num_seqs, max_model_len, gpu_memory_utilization or the
# cudagraph mode, so they are set here, and they are NOT vLLM's defaults: v0.31.0 would run
# 1,024 sequences on an H200, 0.92 utilization and FULL_AND_PIECEWISE, against the 256, 0.9
# and PIECEWISE below. They are held fixed so committed scores stay comparable. The
# comparison scores the RATIO of step times across concurrency at a fixed deployment, which
# is what a setting held constant affects least.
#
# block_size is 64, the size vLLM v0.31.0 picks for a DSA sparse-MLA model: its indexer runs
# on 64-token kernel blocks, and a stated size that is not a multiple of 64 is refused
# (vllm/v1/attention/backends/mla/indexer.py:203-204). An earlier form stated 16, a
# deployment the engine does not start.
#
# The fp8 cache is served by FlashMLA-sparse on this part, which allocates it as fp8_ds_mla:
# 656 bytes a token per layer, not 576 (see sparseMLABackend).
kind: Scenario
name: glm5-h200-tp8
engine_version: "0.29.0"

model: glm-5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: glm5-h200-tp8

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      cache_dtype: fp8
      block_size: 64
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 131072
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
