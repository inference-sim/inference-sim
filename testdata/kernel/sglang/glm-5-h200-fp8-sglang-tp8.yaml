# GLM-5 (fp8) on an h200 under SGLang v0.5.23, tp 8, the InferenceX recipe's stated settings (mem_fraction_static 0.85).
kind: Scenario
name: glm-5-h200-fp8-sglang-tp8
engine:
  kind: sglang

model: glm-5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  nodes: 1
  # gpus_per_node: 8 assumed: the corpus states none; every chip in it is an 8-GPU HGX board.
  gpus_per_node: 8
---
kind: Deployment
name: glm-5-h200-fp8-sglang-tp8

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      mem_fraction_static: 0.85
      context_length: 202752
