# Single-node tensor parallel with expert parallelism OFF, so the expert weights are
# tensor-sliced rather than distributed across ranks. The contrast against the ep16 and
# ep72 fixtures is the point: the same model under three sharding regimes.
#
# Replaces an earlier fixture whose model is not in blis-catalog. The "-measured" suffix
# that fixture carried is dropped: it meant the engine settings came from a published run's
# own command line, and these settings do not, so carrying it would claim provenance this
# file does not have.
# --8<-- [start:scenario]
kind: Scenario
name: minimax-m25-h200-tp8
engine_version: "0.29.0"

model: minimax-m2.5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: minimax-m25-h200-tp8

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
# --8<-- [end:scenario]
