kind: Scenario
name: kimi-k2.5-b300-fp4-vllm-tp4-cfg7
engine:
  kind: vllm
  version: "0.32.0"

model: kimi-k2.5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: b300
  nodes: 1
  # gpus_per_node: 8 assumed: the corpus states none; every chip in it is an 8-GPU HGX board.
  gpus_per_node: 8
---
kind: Deployment
name: kimi-k2.5-b300-fp4-vllm-tp4-cfg7

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 4
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: nvfp4
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      enable_prefix_caching: false
