kind: Scenario
name: deepseek-v4-pro-b300-fp4-vllm-tp4-ep4-dp2-mtp-cfg3
engine:
  kind: vllm
  version: "0.32.0"

model: deepseek-v4-pro
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: b300
  nodes: 1
  # gpus_per_node: 8 assumed: the corpus states none; every chip in it is an 8-GPU HGX board.
  gpus_per_node: 8
---
kind: Deployment
name: deepseek-v4-pro-b300-fp4-vllm-tp4-ep4-dp2-mtp-cfg3

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 4
      pp: 1
      dp: 2
      enable_expert_parallel: true
    engine:
      quantization: nvfp4
      block_size: 256
      max_model_len: 32768
      enable_prefix_caching: false
      speculative_config: {method: mtp, num_speculative_tokens: 2}
