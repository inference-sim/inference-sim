# minimax-m2.5 on b200, fp4 under vllm,
# as NVIDIA's AISimulate end-to-end accuracy artifact records this deployment.
#
# GENERATED by scripts/kernel/gen_aisimulate_scenarios.py from the corpus's own
# record. Re-run after a corpus update rather than editing here.
#
# Topology states: tp_size 2, pp_size 1, attention_dp_size 2,
# moe_ep_size 2, moe_tp_size 1. Workloads scored at this
# deployment: 1k1k.
#
# Only stated values are written (design X19); the engine resolves every other
# setting as vLLM 0.32.0 does. Stated by the run: enable_prefix_caching.
# max_model_len 32768 is derived from the workload: the engine requires it stated
# and the corpus does not state it.
kind: Scenario
name: minimax-m2.5-b200-fp4-vllm-tp2-ep2-dp2-cfg1
engine:
  kind: vllm
  version: "0.32.0"

model: minimax-m2.5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: b200
  nodes: 1
  # gpus_per_node: 8 assumed: the corpus states none; every chip in it is an 8-GPU HGX board.
  gpus_per_node: 8
---
kind: Deployment
name: minimax-m2.5-b200-fp4-vllm-tp2-ep2-dp2-cfg1

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 2
      pp: 1
      dp: 2
      enable_expert_parallel: true
    engine:
      quantization: nvfp4
      max_model_len: 32768
      enable_prefix_caching: false
