# RoCE (RDMA over Converged Ethernet, 200 Gb/s) — reusable inter-node fabric CLASS.
# Per inference-sim#1662 a fabric is a property of the cluster/pool, not of the
# GPU die, so it is defined once here and paired with a chip per deployment.
Provenance: vendor_spec
InterNodeBwGBps: 25
_comment_interconnect: "RoCE (GPUDirect RDMA over Converged Ethernet): one 200 Gb/s ConnectX RoCE port per GPU. InterNodeBwGBps is the NOMINAL datasheet figure — 200 Gb/s / 8 = 25 GB/s per GPU, per direction — NOT a measurement; real RDMA payload throughput runs below nominal (inference-sim#1632). The measured overhead/correction factor (effective / nominal) is a per-deployment number and lives in blis-registry, not in the catalog. Paired with a chip's on-node IntraNodeBwGBps, only the RATIO prices cross-node collective traffic (#1530); that ratio is a per-deployment (chip + fabric) quantity, resolved wherever a chip and fabric are paired."
_comment_pd_transfer: "PD KV-transfer over this fabric uses this same InterNodeBwGBps (25 GB/s nominal) as its bandwidth — no separate PD figure. The old 25 GB/s --pd-transfer-bandwidth default was exactly this: a rough guess for a RoCE-200G fabric (≈ half a 400 Gb/s line rate), now made explicit and per-fabric. The fabric carries no PD base-latency field: the catalog states no inherent fabric base latency, so there is nothing to record here (the nominal figure would only ever be 0). The 0.05 ms --pd-transfer-base-latency default is a modeling placeholder, not a fabric fact, and lives in blis-registry (blis-registry#10). The CLI flags remain the defaults/overrides, so a run that resolves no fabric is byte-identical."
