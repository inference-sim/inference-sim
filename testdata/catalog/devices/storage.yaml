# Storage-device physics for KV-cache offload (H5, #1587), read by BLIS from
# <catalog>/devices/storage.yaml — a SIBLING of this catalog's model entries (#1774).
#
# INERT: these classes only seed bandwidth/latency for --kv-offload-config's per-tier
# `device_class` field. With no --kv-offload-config the offload subsystem is a no-op and
# output is byte-identical to a pre-feature build (INV-6/BC-G5). Shipped constants
# (operator input), never fitted (BC-G4). A per-tier explicit
# read_bandwidth/write_bandwidth/base_latency triple overrides the class entirely — a tier
# that supplies one does not need this file to exist at all. Numbers are representative
# device classes seeded for the multi-tier offload holes (#1588/#1589); operators override
# per run for their hardware.
#
# UNITS: read_bandwidth/write_bandwidth are bytes per microsecond; base_latency is
# microseconds. Bytes/µs and MB/s (MB = 10^6 bytes, NOT MiB) are the same number —
# 1 MB/s = 10^6 bytes / 10^6 µs = 1 byte/µs — so the two spellings used across BLIS and
# blis-catalog describe identical values, with no conversion between them.
#
# Shape: a TOP-LEVEL map of device_class name -> physics. No wrapping key. Strict-parsed
# (R10): a misspelled physics key is refused, never decoded to zero bandwidth.
#
# OPTIONAL non-linear device model per class (#1581). All fields absent below => behavior
# byte-identical to pre-#1581; tuned curves are calibration's job (#1583):
#   saturation_queue_depth: <int>        # Qsat: in-service depth where bandwidth saturates
#   single_transfer_fraction: <0..1]     # f1: fraction of peak bw at queue depth 1
#                                        #     (ramp is active only when Qsat>=2 AND f1<1)
#   latency_jitter_stddev: <float>=0     # sigma: relative stddev of seeded latency jitter
#   buffered_read_bandwidth / buffered_write_bandwidth / buffered_base_latency /
#   buffered_saturation_queue_depth / buffered_single_transfer_fraction /
#   buffered_latency_jitter_stddev       # buffered-I/O regime, selected per tier by
#                                        # direct_io: false; each absent field falls back
#                                        # to the O_DIRECT value above.
nvme_gen4: {read_bandwidth: 7.0e3, write_bandwidth: 5.0e3, base_latency: 80.0}
nvme_gen3: {read_bandwidth: 3.5e3, write_bandwidth: 3.0e3, base_latency: 100.0}
sata_ssd:  {read_bandwidth: 5.5e2, write_bandwidth: 5.0e2, base_latency: 150.0}
cpu_dram:  {read_bandwidth: 2.0e4, write_bandwidth: 2.0e4, base_latency: 1.0}
s3:        {read_bandwidth: 1.0e3, write_bandwidth: 1.0e3, base_latency: 30000.0}
