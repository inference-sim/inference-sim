_comment: "GB300 (Grace-Blackwell Ultra) in its rack-scale configuration. Peak FLOPs and HBM bandwidth are NVIDIA's per-GPU figures for GB300 NVL72 in the NVIDIA Blackwell Ultra Datasheet (document 4169750, Oct 2025; https://resources.nvidia.com/en-us-blackwell-architecture/blackwell-ultra-datasheet, PDF https://dam-cdn.nvd.orangelogic.com/AssetLink/1k0p832eq8r5ca0u5383ie5o4tp3bst1.pdf), table 'Individual Blackwell Ultra GPU Specifications': FP4 '20 PFLOPS | 15 PFLOPS' (sparse | dense), FP8/FP6 10 PFLOPS and FP16/BF16 5 PFLOPS (sparse; 'Dense is ½ sparse spec shown'), giving dense FP4 15000, FP8 5000 and BF16 2500 TFLOPS; and '279 GB HBM3E | 8 TB/s'. AISimulate's descriptor (https://github.com/ai-dynamo/aisimulate/blob/2f0f4cd8606d580567b253d02f3d699fe36db865/python/aisimulate/src/aisimulate_core/systems/gb300.yaml), which cites that datasheet, carries the same figures. Two things place this part between B300 and GB200. It carries the Blackwell Ultra die (dense FP4 15000 TFLOPS, a 1.5x step over GB200's 10000 and above B300's 14000) at the higher 2500 TFLOPS BF16 rate of the Grace-Blackwell bin rather than B300 SXM's 2250. And it keeps GB200's rack-scale NVLink domain. As on B300, INT8 drops sharply: the datasheet states 330 TOPS sparse (165 dense), and the descriptor's int8_tc_flops of 165 TFLOPS matches it. The catalog has no INT8 field, so none is recorded. MemoryGiB is NOT a datasheet figure: 277.5 GiB is the capacity nvidia-smi reports, as the AISimulate descriptor records it (mem_capacity 298013687808 bytes, '284208MiB reported by nvidia-smi', exactly 284208 MiB). The datasheet states 279 GB. The descriptor's GiB reading is kept rather than converted to decimal GB, the same choice b200 and b300 make, and the opposite of gb200-nvl72, which reads its source's advertised decimal GB."
Provenance: vendor_spec
TFlopsPeak: 2500.0
TFlopsFP8: 5000.0
TFlopsNVFP4: 15000.0
BwPeakTBs: 8.0
MemoryGiB: 277.5
_comment_interconnect: "Like gb200-nvl72 and unlike B200/B300, this part needs three topology tiers rather than two, and for the same reason. IntraNodeBwGBps is the NVLink 5 per-GPU unidirectional figure, 900 GB/s: the datasheet's 'Fifth-Generation NVLink: 1.8 TB/s', bidirectional, halved. A node here is one Grace-Blackwell tray, two Grace CPUs with two GPUs each, so GPUsPerNode is 4, not 8. IntraRackBwGBps is ALSO 900: the descriptor's inter_node_bw (NVLink via NVSwitch within the rack) equals its intra_node_bw, so the NVSwitch fabric spans all 72 GPUs in the rack at full per-GPU bandwidth, and crossing a tray boundary inside the rack is not a bandwidth change at all. Only the rack boundary is, and it is a step down to InfiniBand: the descriptor's inter_rack_bw is 100 GB/s per GPU (CX8 XDR 800 Gb/s; the datasheet states 800 Gb/s of ConnectX-8 networking per GPU), double the gb200-nvl72 rack-boundary reference. That inter-rack fabric is a property of the cluster, not the die, so it lives with the reusable fabric classes rather than here. No catalog fabric matches 100 GB/s per GPU yet, so a GB300 inter-rack scenario has no fabric to name, the same gap B300 notes for its 100 GB/s inter-node fabric. A model keyed on tp > GPUsPerNode alone would wrongly derate this part: the condition is the link, not the chassis count, and the step is at the rack boundary. The descriptor also states inter_rack_latency: 5 µs, annotated '5us typical for InfiniBand between racks'. That is a typical value rather than a vendor specification, and the catalog has no field for it, so this entry does not record it. No BLIS repository records it today: blis-registry's coefficients/ has no inter-rack latency coefficient, and inference-sim has no flag for one."
IntraNodeBwGBps: 900
IntraRackBwGBps: 900
GPUsPerNode: 4
GPUsPerRack: 72
_comment_sm: 'SMCount is the count of ENABLED Streaming Multiprocessors per GPU, 152, as the device reports it on GB300 systems. This is NOT a datasheet figure and NOT an NVIDIA publication. The source is FlashInfer''s SM103 dispatch-plan tests, which record "Measured SM counts of the dispatch tables ... B200 148, GB300 152 (JHB nodes)" and key the sm_103a plan on 152 (https://github.com/flashinfer-ai/flashinfer/blob/26fe42d91acc1d56bd27560f64e9bf727d623cca/tests/experimental/test_cake_kimi_k3_fp8_projection.py#L65-L66). sm_103a is this part''s architecture, matching the AISimulate descriptor''s sm_version: 103. The count is what the driver reports for the SKU (cudaDeviceProp.multiProcessorCount); it is not fitted and no workload changes it. No NVIDIA source states it: the AISimulate descriptor states no SM count, NVIDIA''s Blackwell Ultra architecture blog states 160 SMs for the FULL two-die implementation and footnotes that available SM count varies by SKU (https://developer.nvidia.com/blog/inside-nvidia-blackwell-ultra-the-chip-powering-the-ai-factory-era), and no NVIDIA datasheet gives an enabled count. 152 lies between B300 SXM''s 148 (also compute capability 10.3; see hardware/b300.yaml) and the full-die 160. This is a PER-GPU figure, not a per-rack one: the cost model reads it per device. The cost model uses SMCount for two things: the per-SM share of peak FLOPs, and the 12-SM derate a Triton-path KV fetch withholds while it overlaps a forward pass (cost model §8.3), which is 7.89% at 152 SMs.'
SMCount: 152
_comment_cc: "ComputeCapability is the CUDA compute capability NVIDIA lists for this part (https://developer.nvidia.com/cuda-gpus). A model graph that differs by GPU generation resolves its architecture overlay by the major version, so a chip that states none cannot run such a graph."
ComputeCapability: "10.3"
