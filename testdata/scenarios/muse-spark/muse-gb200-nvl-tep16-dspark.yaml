kind: Scenario
name: muse-gb200-nvl-tep16-dspark
engine: {kind: vllm}
model: muse-spark-open-816b-a42b-nvfp4
# Acceptance is the registry's profile for this model and drafter at K=7, thinking on, category
# coding (internal deployment measurements, AL 2.72 on GB200 with vLLM). `blis run` reads only
# category and thinking from this binding; concurrency is the schema's required lane count.
workload:
  replay:
    scenario: inferencex-agentx-mvp
    harness_version: 0.12.0
    corpus:
      loader: semianalysis_cc_traces_weka_062126_256k
      format: weka-trace-v7
      encoding: jsonl
      source:
        huggingface: semianalysisai/cc-traces-weka-062126-256k
        revision: 8fecd2fc56694469f758f0afbbb6335ad3043740
        file: traces.jsonl
        split: train
      sha256: e39cd2ff3eba21d4a3664be51da743ac3d2149a1933898cafc7bfeac8147eeef
    concurrency: 16
    category: coding
    thinking: "on"
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]
cluster:
  hardware: gb200-nvl72
  fabric: ib-400g
  nodes: 4
  gpus_per_node: 4
  gpus_per_rack: 72
---
kind: Deployment
name: muse-gb200-nvl-tep16-dspark
pools:
  - role: colocated
    nodes: 4
    parallel: {tp: 16, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
      speculative_config: {method: dspark, num_speculative_tokens: 7, model: muse-spark-open-dspark}
