kind: Scenario
name: muse-gb200-nvl-dep8
engine_version: "0.32.0"
model: muse-spark-open-816b-a42b-nvfp4
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]
cluster:
  hardware: gb200-nvl72
  fabric: ib-400g
  nodes: 2
  gpus_per_node: 4
  gpus_per_rack: 72
---
kind: Deployment
name: muse-gb200-nvl-dep8
pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 1, pp: 1, dp: 8, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
