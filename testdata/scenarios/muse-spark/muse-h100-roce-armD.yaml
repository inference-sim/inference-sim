kind: Scenario
name: muse-h100-roce-armD
engine_version: "0.32.0"
model: muse-spark-open-816b-a42b-nvfp4
acceptance:
  value:
    num_spec_tokens: 7
    acceptance_length: 2.84
    source: "internal deployment measurements: 1.84 accepted tokens per DSpark draft at c16 on H100 PP2xTP8, fixed 7-token verify (AL = 1 + accepted)"
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]
cluster:
  hardware: h100
  fabric: roce-200g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: muse-h100-roce-armD
pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 8, pp: 2, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
      moe_backend: marlin
      cache_dtype: fp8
      speculative:
        method: dspark
        num_spec_tokens: 7
        draft_model: muse-spark-open-dspark
# Arm D's CPU tier: vLLM's OffloadingConnector, LRU, 512 GiB of host DRAM on each of the engine's
# two nodes. A tier's bytes are the engine's cpu_bytes_to_use, which vLLM divides among the workers'
# copies (vllm/v1/kv_offload/cpu/spec.py:103-121), so the PP2 x TP8 engine states both nodes': 1 TiB.
offload:
  connector: OffloadingConnector
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 1099511627776}
