# glm-5 on one H200 node with MTP speculative decoding (3 draft tokens), for the speculation tests.
# The kernel's glm-5-h200-fp8-sglang-tp8 scenario with an engine.speculative block added.
kind: Scenario
name: glm-5-h200-tp8-mtp3
engine_version: "0.29.0"

model: glm-5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: glm-5-h200-tp8-mtp3

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 64
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9
      speculative:
        method: mtp
        num_spec_tokens: 3
