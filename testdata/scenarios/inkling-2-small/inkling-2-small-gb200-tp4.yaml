kind: Scenario
name: inkling-2-small-gb200-tp4
engine: {kind: vllm}
model: inkling-2-small
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]
cluster:
  hardware: gb200-nvl72
  fabric: ib-400g
  nodes: 1
  gpus_per_node: 4
  gpus_per_rack: 72
---
kind: Deployment
name: inkling-2-small-gb200-tp4
pools:
  - role: colocated
    nodes: 1
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 256
      max_num_batched_tokens: 8192
      max_model_len: 262144
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      async_scheduling: true
