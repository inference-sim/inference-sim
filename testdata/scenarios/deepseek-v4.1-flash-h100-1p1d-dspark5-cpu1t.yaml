# DeepSeek-V4.1-Flash disaggregated 1P1D on two 8-GPU H100 nodes over RoCE 200G: one prefill
# and one decode pool, each one node at TP8 with expert parallelism, drafting five tokens with
# DSpark, handing KV off through NIXL (#1922, #1934, #1940), each engine with a 1 TiB CPU
# tier (the deployment-level offload block applies to every engine, #1910). Engine settings are the colocated
# deepseek-v4.1-flash-h100-tp8-dspark5 scenario's, per pool. The NIC rate is the catalog's
# nominal roce-200g; no H100 deployment records its NIC speed.
kind: Scenario
name: deepseek-v4.1-flash-h100-1p1d-dspark5-cpu1t
engine_version: "0.31.0"

model: deepseek-v4.1-flash
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h100
  fabric: roce-200g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: deepseek-v4.1-flash-h100-1p1d-dspark5-cpu1t

pools:
  - role: prefill
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 64
      cache_dtype: fp8
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
      max_model_len: auto
      gpu_memory_utilization: 0.8
      engram_config:
        cpu_offload: true
      speculative:
        method: dspark
        num_spec_tokens: 5
  - role: decode
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 64
      cache_dtype: fp8
      max_num_seqs: 1024
      max_num_batched_tokens: 8192
      max_model_len: auto
      gpu_memory_utilization: 0.8
      engram_config:
        cpu_offload: true
      speculative:
        method: dspark
        num_spec_tokens: 5

offload:
  connector: OffloadingConnector
  spec: TieringOffloadingSpec
  eviction_policy: lru
  tiers:
    - tier: cpu_dram
      bytes: 1099511627776

pd_transfer:
  connector: MultiConnector

# The router disaggregates every request (router/pd-always.yaml, beside this file).
router:
  endpoint_picker_config: router/pd-always.yaml
