        ASSUMED: this part's measured cuBLAS BF16 knee (gemm_m_half_bf16), paired with gemm_eps_max_w8a16_mxfp8 so the two describe one ramp rather than an asymptote from one kernel and a knee from another. The knee is where a GEMM stops being operand-starved; Marlin's grouped form measures 26 tokens on this part (gemm_m_half_w4a16_mxfp4_grouped), against 110 here, so the dense Marlin knee is unmeasured within that range. DIRECTION: NOT a bound. A knee above Marlin's own lowers the ramp at mid M, so this half is likely pessimistic there while the asymptote is optimistic at large M; the two partly offset and neither direction is established. At decode M the kernel's HBM term -- the FP8 weight read -- dominates either way. TO REPLACE IT: the same MarlinMxfp8LinearKernel sweep as the asymptote; both come from one fit.
