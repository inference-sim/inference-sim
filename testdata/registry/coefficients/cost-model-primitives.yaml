# Cost-model primitives — every entry from NVIDIA AISimulate.
#
# GENERATED by scripts/emit_primitives.py. Re-run after an AISimulate data update
# and commit the diff rather than editing values here.
#
# Two kinds of number, both NVIDIA-sourced:
#
#   FITTED, from the measurement sweeps. The GEMM efficiency envelope
#   eff(M) = eps_max * M / (M + M_half), fitted per dtype against the per-M
#   envelope of achieved fraction of that dtype's dense peak; and the MoE
#   routing-imbalance multiplier, as order statistics of paired measurements that
#   differ in nothing but the routing distribution.
#
#   DECLARED, from AISimulate's own system descriptors (systems/<sku>.yaml). These
#   are numbers NVIDIA ships with its simulator, annotated there as corrections
#   based on observation. They are recorded as `vendor_spec` rather than
#   `measured`: NVIDIA observed them, this project did not, and the sweep behind
#   them is not published.
#
# The envelope is per SKU as well as per dtype, and the H100/H200 pair shows why
# it has to be. Those two share the GH100 die and therefore an identical compute
# peak, and their asymptotes agree to within 0.013 as that predicts. Their knees
# do not: M_half is 160 on H100 and 102 on H200, a factor of 1.57. The knee is set
# by how fast operands reach the tensor cores, so it tracks memory bandwidth
# (3.35 against 4.8 TB/s) rather than compute. A model that carries one part's
# ramp to another on shared-die reasoning gets the asymptote right and the knee
# wrong, and the knee is what governs every decode-sized batch.
kind: CoefficientSet
name: cost-model-primitives

coefficients:

  # --- a100-80 (a100_pcie) ---
  - hbm_derate:
      value: 0.8
      units: dimensionless
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        The fraction of datasheet HBM bandwidth a real access stream achieves. NVIDIA ships this in its own system descriptor, annotated there as a correction based on observation. Applied to the catalog's BwPeakTBs. vendor_spec rather than measured: NVIDIA observed it, this project did not, and the sweep behind it is not published.
  - hbm_constant_latency:
      value: 3.0
      units: us_per_transfer
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        A fixed floor on any memory access, below which a transfer's size stops mattering. At batch 32 the HBM term is milliseconds and this is noise, but for a small elementwise kernel it dominates.
  - host_link_bandwidth:
      value: 32000.0
      units: bytes_per_us
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        32 GB/s single-direction over the CPU-to-GPU link, which is what an offload tier's transfer crosses in addition to host memory. NVIDIA's descriptor states this per part, and the value differs by platform: a Grace-Blackwell part connects over NVLink-C2C rather than PCIe, so a tier that is a liability on one host can be affordable on another. Nominal link rate, not a measured payload throughput; a real transfer reaches a fraction of it.
  - p2p_latency:
      value: 10.0
      units: us_per_hop
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Point-to-point latency between two GPUs, which NVIDIA's descriptor carries as a single per-part figure. The measured per-operation collective floors in cost-model-collectives supersede this for pricing a collective; it is recorded because it is the figure NVIDIA's own model uses, so a comparison against that model needs it.
  - nccl_communicator_bytes_2rank:
      value: 358612992
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 2 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried. It is the WHOLE of a rank's collective-buffer reservation in NVIDIA's composition: engine_workspace_bytes is a separate allowance that adds to it, not part of it (AISimulate sdk/backends/base_backend.py sums nccl_mem and other_mem; cost-model-memory.yaml states the full sum). The descriptor declares 0 at one rank, which is why no 1-rank entry exists, and AISimulate takes the 8-rank figure for any wider group, clamping at min(tp, 8).
  - nccl_communicator_bytes_4rank:
      value: 411041792
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 4 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried. It is the WHOLE of a rank's collective-buffer reservation in NVIDIA's composition: engine_workspace_bytes is a separate allowance that adds to it, not part of it (AISimulate sdk/backends/base_backend.py sums nccl_mem and other_mem; cost-model-memory.yaml states the full sum). The descriptor declares 0 at one rank, which is why no 1-rank entry exists, and AISimulate takes the 8-rank figure for any wider group, clamping at min(tp, 8).
  - nccl_communicator_bytes_8rank:
      value: 411041792
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        Bytes a rank reserves for NCCL communicator buffers at 8 ranks, from NVIDIA's descriptor. It enters the memory breakdown's CommBuffers term, and it is a real per-rank-count figure rather than the order-of-magnitude constant this model previously carried. It is the WHOLE of a rank's collective-buffer reservation in NVIDIA's composition: engine_workspace_bytes is a separate allowance that adds to it, not part of it (AISimulate sdk/backends/base_backend.py sums nccl_mem and other_mem; cost-model-memory.yaml states the full sum). The descriptor declares 0 at one rank, which is why no 1-rank entry exists, and AISimulate takes the 8-rank figure for any wider group, clamping at min(tp, 8).
  - engine_workspace_bytes:
      value: 3758096384
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/a100_pcie.yaml", role: primary}
      rationale: >
        3.8 GB of non-weight, non-KV occupancy NVIDIA's descriptor reserves, which AISimulate's memory model labels as CUDA context, cuBLAS and the like ("cuda, cublas, etc.", sdk/backends/base_backend.py) and the descriptor annotates as a safety reserve that also covers part of the inaccuracy of the rest of its memory calculation. It does NOT include CUDA-graph capture: AISimulate annotates other_mem as excluding the graph reservation (support/config_profile.py) and takes that reservation as a separate argument (capacity.py, cuda_graph_reserved_bytes), so cudagraph_capture_bytes_<mode> in cost-model-memory.yaml adds to this rather than sitting inside it. Nor is it part of the collective reservation: NVIDIA's composition sums it with nccl_communicator_bytes_<N>rank. It is a lumped allowance rather than a decomposition, so a memory breakdown reports it as one term and does not claim to split it.

