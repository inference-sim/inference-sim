  - host_link_bandwidth:
      value: 64000.0
      units: bytes_per_us
      method: vendor_spec
      fitted: false
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/h200_sxm.yaml", role: primary}
      rationale: >
        64 GB/s single-direction over the CPU-to-GPU link, which is what an offload tier's transfer crosses in addition to host memory. NVIDIA's descriptor states this per part, and the value differs by platform: a Grace-Blackwell part connects over NVLink-C2C rather than PCIe, so a tier that is a liability on one host can be affordable on another. Nominal link rate, not a measured payload throughput; a real transfer reaches a fraction of it.
  - host_gather_rate_uva:
      value: 57764.0
      units: bytes_per_us
      method: assumed
      fitted: false
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/h200_sxm.yaml pcie_bw (host_link_bandwidth)", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/common/engram.py _engram_lookup_kernel, ParallelEngramEmbedding", role: supporting}
      rationale: >
        ASSUMED: an UPPER BOUND on the useful-byte rate of DeepSeek-V4.1's engram lookup when the tables are in pinned host memory (EngramConfig.cpu_offload, the v0.31.0 default) and read through UVA. Derived as host_link_bandwidth (64 GB/s, AISimulate's 'pcie 5.0' figure: the raw rate per direction) x 128/130 (PCIe 5.0's 128b/130b line code, leaving 63.0 GB/s) x 264/288: a row is 264 useful bytes -- 256 FP8 values in one table at a 256 B stride (two whole 128 B lines) and 8 UE8M0 scales in a separate table, which cost at least one 32 B sector -- so at least 288 B cross the link per row. Per token and engram layer a rank reads cdiv(24, shards) rows. WHAT THE BOUND IGNORES, each making the real rate LOWER: PCIe transaction-layer overhead; GPU address translation for random rows over a table of 384 million rows, ~101 GB per layer before TP sharding (vLLM's own comment: 'The table dwarfs TLB reach'); the latency-bound regime at decode batch sizes, where 24 rows are a few kilobytes and a per-launch round trip dominates -- no floor is stated because none is measured; and host-side contention when every GPU of a node gathers from one host's memory. The lookup runs on a side stream at half the SMs, so how much of it a step exposes is a composition question, not this rate's. TO REPLACE IT: time ParallelEngramEmbedding.lookup(background=True) with cpu_offload on an H200 host over 1-8,192 tokens at TP 1 and 8, and fit floor + bytes / rate. Read by no consumer until the schema can state a host-resident gather (blis-schemas#48, blis-latency-kernel#38).
