      value: 0.992
      units: dimensionless
      method: assumed
      fitted: false
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/gemm/vllm/0.25.0/gemm_perf.parquet via gemm_eps_max_bf16 (cuBLAS BF16 envelope)", role: upper_bound}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/kernels/linear/mxfp8/marlin.py MarlinMxfp8LinearKernel", role: supporting}
      rationale: >
        ASSUMED: this part's measured BF16 GEMM asymptote, as an UPPER BOUND. On SM90 vLLM v0.31.0 runs every MXFP8 dense linear through MarlinMxfp8LinearKernel (W8A16; the FlashInfer MXFP8 kernels ahead of it require SM100): FP8 weights dequantized in registers, BF16 activations, mma.sync. Its compute rate is therefore a fraction of the BF16 peak, and the measured cuBLAS BF16 envelope (0.992 of peak) bounds it above. No sweep measures dense Marlin on any part, so the fraction it reaches is unknown; the same Marlin MMA core in its grouped (MoE) form reaches 0.245 (gemm_eps_max_w4a16_mxfp4_grouped); if dense Marlin reaches what the grouped form does, the bound is loose by about 4.0x at prefill-sized M. At decode-sized M the kernel's HBM term -- the FP8 weight read -- dominates, and this term barely enters. DIRECTION: optimistic for compute-bound GEMMs. TO REPLACE IT: an h200 GEMM sweep with MarlinMxfp8LinearKernel forced (AISimulate's vLLM GEMM collector has no Marlin path). Read by no consumer until blis-latency-kernel selects a ramp by weight format and chip (blis-latency-kernel#34).
