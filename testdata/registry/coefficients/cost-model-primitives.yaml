  - host_link_bandwidth:
      value: 64000.0
      units: bytes_per_us
      method: vendor_spec
      fitted: false
      scope: {hardware: [gb200-nvl72]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/gb200.yaml", role: primary}
      rationale: >
        64 GB/s single-direction over the CPU-to-GPU link, which is what an offload tier's transfer crosses in addition to host memory. NVIDIA's descriptor states this per part, and the value differs by platform: a Grace-Blackwell part connects over NVLink-C2C rather than PCIe, so a tier that is a liability on one host can be affordable on another. Nominal link rate, not a measured payload throughput; a real transfer reaches a fraction of it.
