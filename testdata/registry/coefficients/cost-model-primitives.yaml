  - nccl_communicator_bytes_2rank:
      value: 358612992
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [gb200-nvl72]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/gb200.yaml", role: primary}
