      rationale: >
        4.7 us per index-source layer per rank in a step with prefill. ASSUMED -- A PROXY KERNEL, fitted on measured rows: vLLM v0.31.0's prefill indexer runs DeepGEMM fp8_fp4_mqa_logits (the ragged kernel, sparse_attn_indexer.py prefill chunks, after cp_gather_indexer_k_quant_cache), and this is fitted on the PAGED kernel fp8_fp4_paged_mqa_logits that decode runs, at prefill shapes (dsv4_paged_mqa_logits_module_perf.parquet, isl > 1: b x isl query rows packed into one causal sequence, every row on one block table, 64 index heads). THE RAGGED KERNEL IS MEASURED, on another lane: AISimulate's sglang/0.5.14 glm5_mqa_logits_module_perf.parquet times deep_gemm.fp8_mqa_logits at GLM-5's indexer geometry, 32 index heads x 128, FP8 keys, ratio 1 -- V4.1's head count. Against those 2882 rows this proxy is 1.504x, signed 0.903; on the 518 rows of at least 4,096 query rows at a prefix of at least 8,192, signed 0.822 (1.245x); at V4.1's 8,192-token chunk (274 rows) signed 1.094, evaluated as the kernel will charge it, W scaled to 32 of 64 heads (an earlier review that read the table's num_heads, GLM-5's 64 ATTENTION heads, as index heads found the proxy over-pricing by 1.4-1.7x; at the config's 32 index heads it is not). So on the real kernel the proxy is within about 20% either way, under-pricing long chunks over long prefixes and over-pricing V4.1's chunk size; on its own paged rows it is signed 0.86 at 8,192 rows. NOT FITTED on the ragged rows because the lane decision (methodology section 2) is open: SGLang 0.5.14 calls upstream DeepGEMM's fp8_mqa_logits, vLLM v0.31.0 its fork's fp8_fp4_mqa_logits on the FP8 path, and the device code of the two pins has not been compared; the SGLang collector also splits large batches along the query axis. THE FORM per index-source layer, per rank, per step with prefill: t = attention_prefill_floor_block_index_scores + attention_prefill_per_token_block_index_scores x prefill query tokens + W / attention_prefill_rate_block_index_scores, W = sum over prefill query tokens of ceil(p / ratio) x 132 B x n_q / 64 -- every compressed key the query can see, at the 132 B FP8 key; n_q is the node's index heads (32 for V4.1 against the measured 64), a LINEAR head scaling that is itself assumed (the rows are compute-bound: the fitted rate is 914 TFLOPS at 64 heads x 128 x 2 FLOP a row-key, against 1979 FP8 dense peak). The three replace the generic prefill pair for this role. Fitted over 3504 rows (V4-Flash-FP8 and V4-Pro-FP8, both 64 index heads, head_dim 128, FP8 keys): 1.073x, signed 0.969; floor + rate alone 1.173x. Signed by query rows: 4: 0.94, 8: 0.92, 16: 0.95, 32: 0.96, 64: 1.00, 128: 1.03, 256: 1.01, 512: 1.02, 1024: 1.05, 1536: 1.01, 2048: 1.01, 3072: 0.98, 4096: 0.90, 6144: 0.89, 8192: 0.86. Per checkpoint: DeepSeek-V4-Flash-FP8 1.073x, DeepSeek-V4-Pro-FP8 1.072x. HELD OUT: trained on step <= 8,192, predicting >= 16,384 1.036x (signed 1.015, n=498); trained on <= 2,048 rows, predicting >= 4,096 1.161x (signed 0.864, n=968). NOT CONTAINED: the K gather (catalog index_prefill_k_gather), top_k_per_row_prefill and V4.1's candidate select/mask (catalog index_logits_topk), the indexer projections (catalog GEMMs). VERSIONS: the paged kernel and scheduler differ between the DeepGEMM pins of vLLM 0.25.0 and 0.31.0 only by renames and zero-length bounds handling (see the decode floor's rationale). TO REPLACE IT: a sweep of fp8_fp4_mqa_logits over (query rows, keys) at 32 and 64 index heads on H100, or a recorded lane decision for the ragged rows above. Scoped to this model. Reproduce with scripts/fit_deepseek_v41_prefill.py.
