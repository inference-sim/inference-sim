  - attention_decode_launch_floor_sparse_mla:
      value: 10.0
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_hca_attn_module_perf.parquet (NVIDIA H200), FLASHMLA_SPARSE_DSV4, sgl-project/DeepSeek-V4-Flash-FP8 (64 query heads, the h64 kernel), 200 decode points at <= 10 blocks", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/nvidia/flashmla.py DeepseekV4FlashMLAAttention._forward_decode", role: supporting}
      rationale: >
        The launch floor of V4.1's FlashMLA sparse DECODE on SM90: 10.0 us, what a one-block read costs at small batch (batch-1 rows: 1 block 10.2 us, 2 blocks 13.4 us, 10 blocks 15.4 us). Fitted jointly with the four other attention_decode_*_sparse_mla terms of this form. NOT named attention_decode_floor_sparse_mla on purpose: the kernel reads that name today as the floor of the committed single-rate pair, which was fitted over the 13.5 us part-wide floor, and would silently re-price it. THE FORM, per layer, per rank, per decode step (one flash_mla_with_kvcache call): t = max(attention_decode_launch_floor_sparse_mla + attention_decode_split_floor_sparse_mla x [B > 1] + B x 37,376 B / attention_decode_serial_rate_sparse_mla, sum over decode query rows q of (attention_decode_per_token_sparse_mla + blocks_q x 37,376 B / attention_decode_throughput_rate_sparse_mla)), blocks_q = ceil(min(ctx, window) / 64) + ceil(min(ctx // ratio, index_topk) / 64) -- 10 for V4.1 past about 1k tokens -- and B the largest blocks_q in the call. A query row is a query token: under speculative decoding a request contributes 1 + num_spec rows, each with its own top-k (the sweep is isl 1; that each row costs one row is the consumer's assumption, as for the committed rate). ALL-OR-NONE: the kernel uses this form only when all five entries resolve, otherwise the committed attention_decode_rate_sparse_mla over the part-wide floor. FIT: 1.061x (signed 0.965, n=200, rows of at most 10 blocks) against 1.176x (signed 1.069) for the committed rate over the 13.5 us floor on the same rows. Signed by batch: 1: 1.02, 2: 1.02, 4: 1.01, 8: 1.00, 16: 0.93, 32: 0.83, 64: 0.86, 128: 0.94, 256: 1.04, 512: 1.00, 1024: 1.02 (committed: 1: 1.06, 2: 1.07, 4: 1.08, 8: 1.09, 16: 1.08, 32: 1.05, 64: 1.25, 128: 1.45, 256: 1.10, 512: 0.80, 1024: 0.65). HELD OUT, refitted on the training side only: rows <= 256 -> >= 512 1.038x (signed 0.978, n=22; committed 1.375x); blocks <= 4 -> >= 6 1.059x (signed 1.005, n=9; committed 1.063x). NOT IDENTIFIED WITHOUT SATURATED ROWS: rows <= 64 -> >= 128 gives 1.941x (signed 1.941, n=52; committed 1.316x), because no training row reaches the throughput branch; the two throughput terms rest on the batch >= 256 rows, which are at 1/2/3 blocks. AT V4.1'S READ: the 4 rows at 10 blocks (batch <= 8) fit 1.044x (signed 1.017). At 10 blocks the throughput branch binds above about 48 query rows per rank (a latency branch of 16.3 us); that region, 10 blocks at many rows, is not in the table -- its batch x context <= 1M grid pairs 10 blocks only with batch <= 8 -- so there the form extrapolates the per-block throughput cost from 1-3 blocks to 10, linearly, as the committed rate does. Covers the FlashMLA call alone: compute_global_topk_indices_and_lens (one Triton launch per compressed layer) is not in the timed op. NO END-TO-END CHECK EXISTS FOR vLLM: AISimulate FPM (revision 03e006de) carries DeepSeek-V4.1-Flash on h200 under SGLang only -- another engine, MoE kernel and checkpoint revision -- so it cannot arbitrate vLLM v0.31.0 pricing; blis-registry#42 has no arbiter until a vLLM V4.1 forward-pass measurement exists, see methodology section 10.5. Reproduce with scripts/fit_deepseek_v41_decode.py.
