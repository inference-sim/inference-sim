  - attention_decode_floor_swa:
      value: 15
      units: us_per_transfer
      method: assumed
      fitted: false
      scope: {hardware: [a100-80, a100-sxm]}
      rationale: >
        ASSUMED, not measured: no sweep in the AISimulate tree carries this measurement for a100-sxm -- its attention collections report window_size 0 on every row in all three lanes, so there is nothing to fit rather than nothing fitted yet. DIMENSION (derived). This part's OWN measured attention_decode_floor times the windowed/full ratio of its KERNEL siblings (l40s 0.7727). Ampere carries no windowed fit at all, so no same-generation median exists -- but the ratio clusters by the kernel vLLM dispatches rather than by the die, and that is readable from the sweeps' own kernel_source column: Hopper runs vllm_flash_attn_fa3 at ratio 0.333-0.361, Blackwell runs vllm_flashinfer_flashinfertrtllmapidecode at 0.500-0.595, and L40S falls back to vllm_flash_attn_fa2 at 0.310. a100-sxm runs vllm_flash_attn, the FA2-class path, because Ampere lacks the hardware FA3 requires -- so L40S is its kernel sibling even across generations. Anchoring on a measurement OF THIS PART makes this stronger than any cross-part median. THE WEAKNESS, STATED: there is exactly ONE fa2-class sibling, so the holdout below validates the fa3 and flashinfer groups and cannot test this one -- l40s is necessarily excluded from its own prediction. The ratio across all seven fitted parts spans 0.310 to 0.595, a 1.92x range, and the fa2 figure sits at the BOTTOM of it. That is the conservative end: a lower windowed rate means a longer windowed layer, so this entry over-states windowed latency rather than under-stating it, which is the safe direction for a term whose absence would under-state it by 2x-5.5x. The predictor was chosen by leave-one-part-out holdout over every part this family IS fitted on -- hold a part out, predict it, compare against its measured value -- giving median 1.008x and worst 1.114x over 6 held-out parts. Alternatives were scored and rejected: the global median across all generations reaches 16x on windowed rates, and scaling by the part's datasheet HBM figure is worse than the generation median on every family tested. That is itself the finding -- these coefficients are set by the kernel and the memory architecture rather than by the headline bandwidth number. MAGNITUDE (the caveat). This is an inference, not a measurement of a100-sxm. It is committed because the alternative is worse rather than neutral: an absent coefficient resolves to nothing and the kernel prices a windowed layer with the FULL-attention rate, which on the parts where both are measured is wrong by 2x to 5.5x -- larger than this estimate's holdout error. TO REPLACE THIS WITH A MEASUREMENT: a a100-sxm attention sweep carrying non-zero window_size rows; the fitter already handles the part and needs only the data.
