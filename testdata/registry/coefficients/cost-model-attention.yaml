      rationale: >
        1.11 TB/s, 0.330 of this part's 3.35 TB/s datasheet bandwidth, for vLLM v0.31.0's FlashMLA sparse decode on SM90 -- one flash_mla_with_kvcache call per layer over the sliding window plus the indexer's top-k, query heads padded to 64 at every TP width, the 584 B V4 KV record. BYTES ARE COUNTED IN FLASHMLA'S 64-TOKEN BLOCKS: per request, 584 x 64 x (ceil(window tokens / 64) + ceil(selected tokens / 64)), which once the context fills the window and the top-512 is 10 blocks, 373,760 B, at ONE query token per request (the sweep's decode rows are isl 1; a multi-token decode, as under DSpark speculation, is outside what was measured). THE FLOOR is this part's part-wide attention_decode_floor (14.5 us), which blis-latency-kernel inherits for a kind with a rate and no floor. It over-prices the table's shortest reads: batch-1 rows of at most one block measure 10.1-10.6 us, so pinning costs 37%-44% there; a free floor lands at 13.8 us (1.187x against 1.198x) only because a linear form cannot follow the step between one and two blocks. THE ERROR DEPENDS ON BATCH, which the overall 1.198x (signed 1.057, 207 points, 1-130 blocks per request) hides. Signed by batch: 1: 1.02, 2: 1.06, 4: 1.09, 8: 1.12, 16: 1.10, 32: 1.06, 64: 1.28, 128: 1.44, 256: 1.02, 512: 0.73, 1024: 0.59. Neither a per-request term (floor + c x batch + bytes / rate: 1.186x) nor an occupancy form (floor + a x ceil(batch x blocks / P), P fitted at 64: 1.179x) removes it, so it is batch-dependent scheduling inside the call, not a missing term this form can carry. Trained on requests of <= 3 blocks and held out on >= 5 the rate predicts 1.175x (signed 0.853, n=16, all at batch <= 16); at exactly V4.1's 10 blocks 1.069x (signed 0.936, n=4, batch <= 8). AT VOLUME THE READ IS STILL FAR FROM HBM-BOUND: the marginal bandwidth (the least-squares slope of latency on bytes) is 0.76 TB/s, 23% of peak, over the 118 rows of at least 1 MB; 0.78 TB/s, 23% of peak, over the 39 rows of at least 10 MB; the 3 largest calls, 115 MB at batch 1024, read at 24.8%-25.2% of peak net of the floor. THE SAME KERNEL AS ON H200, NOT A SCALED HBM RATE: on the 207 rows both parts measure, this part's latency is a median 1.05x h200's (1.13x over the slowest tenth), where a read bound on HBM would be 1.43x (4.8 against 3.35 TB/s); so this rate is close to h200's (1.12 TB/s) and a larger fraction of this part's peak -- the cost per byte of reads this short, not a bandwidth -- and must not be rescaled between parts by BwPeak. This part's fitted rate is 0.984x h200's, a ratio that depends on row weighting: the fit is geometric over all 207 rows, 89 of them under 1 MB; on rows of at least 1 MB (10 MB) this part's marginal bandwidth is 0.90x (0.92x) h200's (0.85 and 0.85 TB/s there, 18% of its peak at 1 MB). SO V4.1'S OPERATING POINT IS INSIDE THE MEASURED RANGE ON THE BLOCK AXIS ONLY: it reads 10 blocks per query at any context past about 1k tokens, at batches the sweep's batch x context <= 1M grid never pairs with 10 blocks; across the measured batches the signed error spans the range above. Nor on call volume: at the sweep's largest batch, 1024, V4.1's 10 blocks per request read 383 MB per call, 3.3x the largest measured call. WHY THIS SHIPS WHEN DEEPSEEK-V4-PRO'S WAS WITHDRAWN (methodology section 10.3): that rate was fitted on Pro's 128-head rows (the h128 instance, which Pro runs only below TP 2) and was to be charged against the kernel's selection rule for Pro's csa4 layers -- up to 262,912 tokens at a 1M context, far outside any measured row on the block axis. Every V4.1 sparse layer reads at most 640 tokens per query (128 window + top-512) on the h64 instance at every TP width. SCOPED TO THIS MODEL so no other sparse_mla deployment changes. WHAT THE TIMED OP DOES NOT CONTAIN: the 0.25.0 ratio-128 rows take their indices from metadata, while v0.31.0's V4.1 decode also launches compute_global_topk_indices_and_lens (a Triton kernel translating the indexer's top-k to cache slots) on every compressed (compress_ratio 1 or 2) layer -- a known gap, one small launch per layer not priced here. The FlashMLA SM90 sparse decode device code is unchanged between the pins vLLM 0.25.0 and 0.31.0 build (a6ec2ba, 0eee43b: renames only, the 584 B assert identical); its split-KV combine kernel's grid moves from (b, s_q, h) to (b*s_q, 1, h), inert at one query token, and gains 192/224/256-split cases that only requests needing more than 160 splits reach; the host API was rewritten, including skipping the split workspace for unsplit requests. NO END-TO-END CHECK ON THIS PART: no forward-pass dataset carries DeepSeek-V4.1-Flash on h100 under any engine, and FPM's h200 V4.1 rows are SGLang (revision 03e006de), so nothing arbitrates this entry (methodology section 10.5). Reproduce with scripts/fit_deepseek_v41_h200.py.
  - attention_decode_floor_block_index_scores:
      value: 4.9
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h100], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H100), vllm.utils.deep_gemm.fp8_fp4_paged_mqa_logits, DeepSeek-V4-Flash-FP8 and V4-Pro-FP8 (64 index heads, head_dim 128, FP8 keys), 414 decode points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/layers/sparse_attn_indexer.py, fp8_fp4_paged_mqa_logits decode call", role: supporting}
      rationale: >
        The launch-and-schedule floor of DeepGEMM's fp8_fp4_paged_mqa_logits, the lightning indexer's scoring scan that vLLM v0.31.0 runs on SM90 for every index-source layer of DeepSeek-V4.1 (FP8 keys and dense logits: MXFP4 keys and the sparse-logits path need SM100). Timed under CUDA graphs on the kernel itself, not a module. Fitted jointly with a per-row-key work rate over 414 points (geometric error 1.086x); the floor is identified by the 246 points whose work term is under 5% of it (1.067x, signed 0.960). The work rate is NOT committed -- see attention_decode_rate_block_index_scores. The measured checkpoints carry 64 index heads where V4.1 carries 32; a floor is a launch cost, and fitted on each checkpoint alone it is 4.95 us, 4.90 us. The kernel and scheduler are unchanged across the DeepGEMM pins of vLLM 0.25.0 and 0.31.0 except for zero-length bounds handling. Covers the logits kernel only: the top-k and V4.1's candidate select/mask kernels are separate launches this does not include. Consumed by no reader yet: the kernel prices a role: block_index_scores node with its layer kind's pair and needs to look this name up (attention_decode_<floor|rate>_<role>). Reproduce with scripts/fit_deepseek_v41_h200.py.
  - attention_decode_rate_block_index_scores:
      value: 2680000.0
      units: bytes_per_us
      method: assumed
      fitted: false
      scope: {hardware: [h100], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h100_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H100): fitted throughput 6.44 TB/s-equivalent at 132 B/key, above the 3.35 TB/s HBM peak", role: upper_bound}
        - {kind: model, cite: "NVIDIA AISimulate systems/h100_sxm.yaml mem_bw_empirical_scaling_factor (hbm_derate)", role: primary}
      rationale: >
        ASSUMED: NVIDIA's empirical HBM rate, BwPeak x hbm_derate = 3.35 TB/s x 0.8 -- the descriptor's observed correction, not a bound; the bound is BwPeak itself. Bytes are 132 per compressed index key per request (128 FP8 + one FP32 scale, _indexer_k_cache_head_dim), over ceil(context / compress_ratio) keys -- V4.1's compress ratios are 1 and 2, so the scan grows with context while the attention it feeds does not. WHY NOT THE MEASURED SLOPE: the only kernel-level sweep gives every query row the same block table, so its unique key footprint is at most 34.6 MB, and its fitted throughput, 6.44 TB/s-equivalent, exceeds the HBM datasheet peak, which an HBM read cannot -- consistent with the shared keys being served from cache. In serving each request's keys are its own and HBM-resident. Compute does not bind at one query token per request: 32 heads x 128 x 2 = 8,192 FLOP per 132 B key is 62 FLOP/B against an FP8 ridge of 591. DIRECTION: unknown at this fraction -- optimistic if this kernel streams index pages below NVIDIA's empirical HBM fraction, pessimistic if above. The real rate cannot exceed BwPeak, so this rate can be pessimistic by at most 1.25x (scan time over-priced); how optimistic it can be is not bounded. Under speculative decoding each request scores k+1 query rows against each key, so k = 5 brings it to 372 FLOP/B -- still under the ridge at datasheet peak, but at the 799 TFLOPS this kernel was measured sustaining (a lower bound on what it can) the scan could become compute-bound at as little as 0.80 of this rate. TO REPLACE IT: the same sweep with a distinct block table per query row, so the keys are read from HBM. Scoped to this model; consumed by no reader yet (see the floor).
  - attention_prefill_floor_sparse_mla:
      value: 14.8
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_hca_attn_module_perf.parquet (NVIDIA H200), FLASHMLA_SPARSE_DSV4, sgl-project/DeepSeek-V4-Flash-FP8, 1642 prefill points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/nvidia/flashmla.py DeepseekV4FlashMLAAttention._forward_prefill", role: supporting}
      rationale: >
        The per-call floor of V4.1's FlashMLA sparse PREFILL on SM90: 14.8 us, charged once per layer per rank in a step with prefill (a mixed step also pays the decode floor: FlashMLA launches the two regimes separately). Against the generic attention_prefill_floor of 18.5 us that priced this kernel before. THE FORM the kernel evaluates per layer, per rank, per step holding prefill: t = attention_prefill_floor_sparse_mla + attention_prefill_per_request_sparse_mla x prefill requests + attention_prefill_per_token_sparse_mla x prefill query tokens + W / attention_prefill_rate_sparse_mla, W = sum over prefill query tokens of 64 x (ceil(min(p, window) / 64) + ceil(min(p / ratio, index_topk) / 64)) x 584 B x padded_heads / 64, p the query's position + 1 -- the decode rate's block-and-record count, per query. For V4.1 (window 128, top-512) every query past about 1k tokens reads 10 blocks, 373,760 B. The four replace the generic attention_prefill_floor / attention_prefill_work_scale pair for this kind; all four or none are used. Fitted jointly over the 1642 prefill rows (isl > 1) of sgl-project/DeepSeek-V4-Flash-FP8 in dsv4_hca_attn_module_perf.parquet (H200) that read at most V4.1's 10 blocks a query (batch 1-1024, chunks 4-8192 tokens): geometric error 1.067x, signed 1.003. The two-parameter form, floor + W / rate, gives 1.390x and biases with batch; the per-request and per-token terms are what remove it. Signed by batch: 1: 0.96, 2: 1.00, 4: 1.02, 8: 1.04, 16: 1.05, 32: 1.03, 64: 0.98, 128: 0.96, 256: 0.96, 512: 0.97, 1024: 0.98. Signed by blocks a query: 1: 1.04, 2: 1.07, 3: 0.98, 4: 1.06, 5: 1.02, 6: 0.95, 7: 1.00, 10: 0.81. HELD OUT: trained on <= 6 blocks, predicting 7-10 blocks 1.137x (signed 0.910, n=51); trained on chunks <= 2,048 tokens, predicting >= 3,072 1.036x (signed 1.001, n=126). AT V4.1'S READ: the 20 rows at exactly 10 blocks are all short chunks (<= 64 tokens, at step 65,536) and the fit under-prices them 1.311x (signed 0.806); long chunks at V4.1's read are not in the table (an 8,192-token chunk at step 65,536 crosses 11 blocks), and the 50 long-chunk (>= 1,024 tokens) rows beyond it, 11-67 blocks, extrapolate at 1.049x (signed 0.953) while the 60 short-chunk rows there do not (1.51x, signed 0.67: few queries over many blocks under-fill the part). One 8,192-token chunk at V4.1's full read prices at 1.39 ms a layer. WHAT THE TIMED OP CONTAINS: vLLM 0.25.0 DeepseekV4FlashMLAAttention.forward_mqa on the prefill branch under a CUDA graph -- the dequantize-and-gather of the SWA window and of the (ratio-128, at most 512-entry) compressed stream into a BF16 workspace, combine_topk_swa_indices, and flash_mla_sparse_fwd (SM90 sparse prefill, D_QK 512). NOT CONTAINED: projections, q/kv norms and rope (catalog GEMM and Elementwise nodes). V4.1's ratio-1/2 layers gather their FULL-length compressed stream before the kernel (v0.31.0 flashmla.py _forward_prefill, 'every cr>0 layer gathers a full-length compressed region'), which the measured ratio-128 rows hold only at 1/128 of the context; that gather stays priced by the catalog's prefill_dequant_gather node. VERSIONS: the SM90 sparse prefill device code is unchanged between the FlashMLA pins vLLM 0.25.0 and 0.31.0 build (a6ec2ba -> 0eee43b: csrc/sm90/prefill/sparse moved under csrc/kernels with include-path and namespace renames only); v0.31.0's _forward_prefill adds preallocated index workspaces and the full-length gather above, and keeps combined_topk = round_up(top_k + window, 128) = 640. SCOPED TO THIS MODEL: fitted on the h64 instance V4.1 runs at every TP width. NO END-TO-END CHECK EXISTS FOR vLLM: AISimulate FPM (revision 03e006de) carries DeepSeek-V4.1-Flash on h200 under SGLang only -- another engine, MoE kernel and checkpoint revision -- so it cannot arbitrate vLLM v0.31.0 pricing; blis-registry#42 has no arbiter until a vLLM V4.1 forward-pass measurement exists, see methodology section 10.5. Reproduce with scripts/fit_deepseek_v41_prefill.py.
