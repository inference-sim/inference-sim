      rationale: >
        4.1 us per index-source layer per rank in a step with prefill. ASSUMED -- A PROXY KERNEL, fitted on measured rows: vLLM v0.31.0's prefill indexer runs DeepGEMM fp8_fp4_mqa_logits (the ragged kernel, sparse_attn_indexer.py prefill chunks, after cp_gather_indexer_k_quant_cache), and this is fitted on the PAGED kernel fp8_fp4_paged_mqa_logits that decode runs, at prefill shapes (dsv4_paged_mqa_logits_module_perf.parquet, isl > 1: b x isl query rows packed into one causal sequence, every row on one block table, 64 index heads). THE RAGGED KERNEL IS MEASURED, on another lane: AISimulate's sglang/0.5.14 glm5_mqa_logits_module_perf.parquet times deep_gemm.fp8_mqa_logits at GLM-5's indexer geometry, 32 index heads x 128, FP8 keys, ratio 1 -- V4.1's head count. Against those 2882 rows this proxy is 1.497x, signed 0.933; on the 518 rows of at least 4,096 query rows at a prefix of at least 8,192, signed 0.885 (1.164x); at V4.1's 8,192-token chunk (274 rows) signed 1.176, evaluated as the kernel will charge it, W scaled to 32 of 64 heads (an earlier review that read the table's num_heads, GLM-5's 64 ATTENTION heads, as index heads found the proxy over-pricing by 1.4-1.7x; at the config's 32 index heads it is not). So on the real kernel the proxy is within about 20% either way, under-pricing long chunks over long prefixes and over-pricing V4.1's chunk size; on its own paged rows it is signed 0.88 at 8,192 rows. NOT FITTED on the ragged rows because the lane decision (methodology section 2) is open: SGLang 0.5.14 calls upstream DeepGEMM's fp8_mqa_logits, vLLM v0.31.0 its fork's fp8_fp4_mqa_logits on the FP8 path, and the device code of the two pins has not been compared; the SGLang collector also splits large batches along the query axis. THE FORM per index-source layer, per rank, per step with prefill: t = attention_prefill_floor_block_index_scores + attention_prefill_per_token_block_index_scores x prefill query tokens + W / attention_prefill_rate_block_index_scores, W =