        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/nvidia/flashmla.py DeepseekV4FlashMLAAttention._forward_prefill", role: supporting}
      rationale: >
        The per-call floor of V4.1's FlashMLA sparse PREFILL on SM90: 15.5 us, charged once per layer per rank in a step with prefill (a mixed step also pays the decode floor: FlashMLA launches the two regimes separately). Against the generic attention_prefill_floor of 19.5 us that priced this kernel before. THE FORM the kernel evaluates per layer, per rank, per step holding prefill: t = attention_prefill_floor_sparse_mla + attention_prefill_per_request_sparse_mla x prefill requests + attention_prefill_per_token_sparse_mla x prefill query tokens + W / attention_prefill_rate_sparse_mla, W = sum over prefill query tokens of 64 x (ceil(min(p, window) / 64) + ceil(min(p / ratio, index_topk) / 64)) x 584 B x padded_heads / 64, p the query's position + 1 -- the decode rate's block-and-record count, per query. For V4.1 (window 128, top-512) every query past about 1k tokens reads 10 blocks, 373,760 B. The four replace the generic attention_prefill_floor / attention_prefill_work_scale pair for this kind; all four or none are used. Fitted jointly over the 1642 prefill rows (isl > 1) of sgl-project/DeepSeek-V4-Flash-FP8 in dsv4_hca_attn_module_perf.parquet (H100) that read at most V4.1's 10 blocks a query (batch 1-1024, chunks 4-8192 tokens): geometric error 1.067x, signed 1.001. The two-parameter form, floor + W / rate, gives 1.389x and biases with batch; the per-request and per-token terms are what remove it. Signed by batch: 1: 0.96, 2: 1.00, 4: 1.02, 8: 1.04, 16: 1.04, 32: 1.03, 64: 0.97, 128: 0.96, 256: 0.96, 512: 0.96, 1024: 0.98. Signed by blocks a query: 1: 1.04, 2: 1.06, 3: 0.98, 4: 1.05, 5: 1.02, 6: 0.94, 7: 0.99, 10: 0.80. HELD OUT: trained on <= 6 blocks, predicting 7-10 blocks 1.136x (signed 0.906, n=51); trained on chunks <= 2,048 tokens, predicting >= 3,072 1.032x (signed 1.010, n=126). AT V4.1'S READ: the 20 rows at exactly 10 blocks are all short chunks (<= 64 tokens, at step 65,536) and the fit under-prices them 1.302x (signed 0.801); long chunks at V4.1's read are not in the table (an 8,192-token chunk at step 65,536 crosses 11 blocks), and the 50 long-chunk (>= 1,024 tokens) rows beyond it, 11-67 blocks, extrapolate at 1.099x (signed 0.910) while the 60 short-chunk rows there do not (1.54x, signed 0.65: few queries over many blocks under-fill the part). One 8,192-token chunk at V4.1's full read prices at 1.36 ms a layer. WHAT THE TIMED OP CONTAINS: vLLM 0.25.0 DeepseekV4FlashMLAAttention.forward_mqa on the prefill branch under a CUDA graph -- the dequantize-and-gather of the SWA window and of the (ratio-128, at most 512-entry) compressed stream into a BF16 workspace, combine_topk_swa_indices, and flash_mla_sparse_fwd (SM90 sparse prefill, D_QK 512). NOT CONTAINED: projections, q/kv norms and rope (catalog GEMM and Elementwise nodes). V4.1's ratio-1/2 layers gather their FULL-length compressed stream before the kernel (v0.31.0 flashmla.py _forward_prefill, 'every cr>0 layer gathers a full-length compressed region'), which the measured ratio-128 rows hold only at 1/128 of the context; that gather stays priced by the catalog's prefill_dequant_gather node. VERSIONS: the SM90 sparse prefill device code is unchanged between the FlashMLA pins vLLM 0.25.0 and 0.31.0 build (a6ec2ba -> 0eee43b: csrc/sm90/prefill/sparse moved under csrc/kernels with include-path and namespace renames only); v0.31.0's _forward_prefill adds preallocated index workspaces and the full-length gather above, and keeps combined_topk = round_up(top_k + window, 128) = 640. SCOPED TO THIS MODEL: fitted on the h64 instance V4.1 runs at every TP width. NO END-TO-END CHECK ON THIS PART: no forward-pass dataset carries DeepSeek-V4.1-Flash on h100 under any engine, and FPM's h200 V4.1 rows are SGLang (revision 03e006de), so nothing arbitrates this entry (methodology section 10.5). Reproduce with scripts/fit_deepseek_v41_prefill.py.
