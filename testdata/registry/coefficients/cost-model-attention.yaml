  - attention_decode_rate_sparse_mla:
      value: 1123200.0
      units: bytes_per_us
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_hca_attn_module_perf.parquet (NVIDIA H200), FLASHMLA_SPARSE_DSV4, sgl-project/DeepSeek-V4-Flash-FP8 (64 query heads, the h64 kernel), 207 decode points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/nvidia/flashmla.py DeepseekV4FlashMLAAttention._forward_decode", role: supporting}
      rationale: >
        1.12 TB/s, 0.234 of this part's 4.8 TB/s datasheet bandwidth, for vLLM v0.31.0's FlashMLA sparse decode on SM90 -- one flash_mla_with_kvcache call per layer over the sliding window plus the indexer's top-k, query heads padded to 64 at every TP width, the 584 B V4 KV record. BYTES ARE COUNTED IN FLASHMLA'S 64-TOKEN BLOCKS: per request, 584 x 64 x (ceil(window tokens / 64) + ceil(selected tokens / 64)), which once the context fills the window and the top-512 is 10 blocks, 373,760 B, at ONE query token per request (the sweep's decode rows are isl 1; a multi-token decode, as under DSpark speculation, is outside what was measured). THE FLOOR is this part's part-wide attention_decode_floor (13.5 us), which blis-latency-kernel inherits for a kind with a rate and no floor. It over-prices the table's shortest reads: batch-1 rows of at most one block measure 9.8-11.8 us, so pinning costs 14%-38% there; a free floor lands at 13.3 us (1.181x against 1.182x) only because a linear form cannot follow the step between one and two blocks. THE ERROR DEPENDS ON BATCH, which the overall 1.182x (signed 1.055, 207 points, 1-130 blocks per request) hides. Signed by batch: 1: 0.99, 2: 1.04, 4: 1.07, 8: 1.09, 16: 1.08, 32: 1.05, 64: 1.25, 128: 1.45, 256: 1.10, 512: 0.80, 1024: 0.65. Neither a per-request term (floor + c x batch + bytes / rate: 1.179x) nor an occupancy form (floor + a x ceil(batch x blocks / P), P fitted at 64: 1.173x) removes it, so it is batch-dependent scheduling inside the call, not a missing term this form can carry. Trained on requests of <= 3 blocks and held out on >= 5 the rate predicts 1.210x (signed 0.827, n=16, all at batch <= 16); at exactly V4.1's 10 blocks 1.089x (signed 0.918, n=4, batch <= 8). SO V4.1'S OPERATING POINT IS INSIDE THE MEASURED RANGE ON THE BLOCK AXIS ONLY: it reads 10 blocks per query at any context past about 1k tokens, at batches the sweep's batch x context <= 1M grid never pairs with 10 blocks; across the measured batches the signed error spans the range above. WHY THIS SHIPS WHEN DEEPSEEK-V4-PRO'S WAS WITHDRAWN (methodology section 10.3): that rate was fitted on Pro's 128-head rows (the h128 instance, which Pro runs only below TP 2) and was to be charged against the kernel's selection rule for Pro's csa4 layers -- up to 262,912 tokens at a 1M context, far outside any measured row on the block axis. Every V4.1 sparse layer reads at most 640 tokens per query (128 window + top-512) on the h64 instance at every TP width. SCOPED TO THIS MODEL so no other sparse_mla deployment changes. WHAT THE TIMED OP DOES NOT CONTAIN: the 0.25.0 ratio-128 rows take their indices from metadata, while v0.31.0's V4.1 decode also launches compute_global_topk_indices_and_lens (a Triton kernel translating the indexer's top-k to cache slots) on every compressed (compress_ratio 1 or 2) layer -- a known gap, one small launch per layer not priced here. The FlashMLA SM90 sparse decode device code is unchanged between the pins vLLM 0.25.0 and 0.31.0 build (a6ec2ba, 0eee43b: renames only, the 584 B assert identical); its split-KV combine kernel's grid moves from (b, s_q, h) to (b*s_q, 1, h), inert at one query token, and gains 192/224/256-split cases that only requests needing more than 160 splits reach; the host API was rewritten, including skipping the split workspace for unsplit requests. END-TO-END CHECK PENDING: FPM carries DeepSeek-V4.1-Flash on h200; the kernel prices this model once blis-latency-kernel#44 lands (it closes #30, #32, #36 and #39); tracked in blis-registry#42, see methodology section 10.5. Reproduce with scripts/fit_deepseek_v41_h200.py.
  - attention_decode_floor_block_index_scores:
      value: 4.3
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H200), vllm.utils.deep_gemm.fp8_fp4_paged_mqa_logits, DeepSeek-V4-Flash-FP8 and V4-Pro-FP8 (64 index heads, head_dim 128, FP8 keys), 414 decode points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/layers/sparse_attn_indexer.py, fp8_fp4_paged_mqa_logits decode call", role: supporting}
      rationale: >
        The launch-and-schedule floor of DeepGEMM's fp8_fp4_paged_mqa_logits, the lightning indexer's scoring scan that vLLM v0.31.0 runs on SM90 for every index-source layer of DeepSeek-V4.1 (FP8 keys and dense logits: MXFP4 keys and the sparse-logits path need SM100). Timed under CUDA graphs on the kernel itself, not a module. Fitted jointly with a per-row-key work rate over 414 points (geometric error 1.079x); the floor is identified by the 238 points whose work term is under 5% of it (1.050x, signed 0.984). The work rate is NOT committed -- see attention_decode_rate_block_index_scores. The measured checkpoints carry 64 index heads where V4.1 carries 32; a floor is a launch cost, and fitted on each checkpoint alone it is 4.29 us, 4.28 us. The kernel and scheduler are unchanged across the DeepGEMM pins of vLLM 0.25.0 and 0.31.0 except for zero-length bounds handling. Covers the logits kernel only: the top-k and V4.1's candidate select/mask kernels are separate launches this does not include. Consumed by no reader yet: the kernel prices a role: block_index_scores node with its layer kind's pair and needs to look this name up (attention_decode_<floor|rate>_<role>). Reproduce with scripts/fit_deepseek_v41_h200.py.
  - attention_decode_rate_block_index_scores:
      value: 3840000.0
      units: bytes_per_us
      method: assumed
      fitted: false
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H200): fitted throughput 5.35 TB/s-equivalent at 132 B/key, above the 4.8 TB/s HBM peak", role: upper_bound}
        - {kind: model, cite: "NVIDIA AISimulate systems/h200_sxm.yaml mem_bw_empirical_scaling_factor (hbm_derate)", role: primary}
      rationale: >
        ASSUMED: NVIDIA's empirical HBM rate, BwPeak x hbm_derate = 4.8 TB/s x 0.8 -- the descriptor's observed correction, not a bound; the bound is BwPeak itself. Bytes are 132 per compressed index key per request (128 FP8 + one FP32 scale, _indexer_k_cache_head_dim), over ceil(context / compress_ratio) keys -- V4.1's compress ratios are 1 and 2, so the scan grows with context while the attention it feeds does not. WHY NOT THE MEASURED SLOPE: the only kernel-level sweep gives every query row the same block table, so its unique key footprint is at most 34.6 MB, and its fitted throughput, 5.35 TB/s-equivalent, exceeds the HBM datasheet peak, which an HBM read cannot -- consistent with the shared keys being served from cache. In serving each request's keys are its own and HBM-resident. Compute does not bind at one query token per request: 32 heads x 128 x 2 = 8,192 FLOP per 132 B key is 62 FLOP/B against an FP8 ridge of 412. DIRECTION: unknown at this fraction -- optimistic if this kernel streams index pages below NVIDIA's empirical HBM fraction, pessimistic if above. The real rate cannot exceed BwPeak, so this rate can be pessimistic by at most 1.25x (scan time over-priced); how optimistic it can be is not bounded. Under speculative decoding each request scores k+1 query rows against each key, so k = 5 brings it to 372 FLOP/B -- still under the ridge at datasheet peak, but at the 664 TFLOPS this kernel was measured sustaining (a lower bound on what it can) the scan could become compute-bound at as little as 0.46 of this rate. TO REPLACE IT: the same sweep with a distinct block table per query row, so the keys are read from HBM. Scoped to this model; consumed by no reader yet (see the floor).