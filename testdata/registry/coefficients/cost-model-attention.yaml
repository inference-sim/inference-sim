  - attention_decode_floor_mla:
      value: 13.5
      units: us_per_transfer
      method: assumed
      fitted: false
      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "blis-registry coefficients/cost-model-attention.yaml attention_decode_floor scoped to h200 (13.5 us), the measured attention-kernel decode floor for this part", role: primary}
      rationale: >
        ASSUMED, not measured: this is this part's own measured attention-kernel decode floor, reused for the MLA kind. It is NOT a measurement of an MLA kernel, and the entry it replaces was. AISimulate's only MLA tables (mla_context_module_perf, mla_generation_module_perf) are MODULE measurements covering the whole MLA block including its down-projections, whereas this coefficient feeds the attention KERNEL alone -- blis-catalog prices qkv_proj and o_proj as separate GEMM nodes in the same layer, so a module-derived floor charges the projection weight read twice. The arithmetic confirms the identification rather than the naming: DeepSeek-V3's projections are 293.6 MB at fp8, 61.2 us to read at H200's 4.80 TB/s, against a measured module floor of 44.0 us minimum and 63.8 us median at 64 or fewer total tokens -- so the module floor IS the projection read. DIMENSION (derived). This part's OWN measured attention_decode_floor, which is a measurement of an attention kernel's launch-and-setup cost on this exact silicon. The MLA rate is fitted and kept: a latent-cache read plausibly shifts a RATE by 20% (the fitted MLA rates are 0.80x-1.13x of part-wide) but does not multiply a setup floor by six (the rejected module floors were 4.7x-6.2x). MAGNITUDE (the caveat). An MLA kernel's true setup may differ from a GQA kernel's; this entry asserts only that it is closer to this part's attention floor than to a module floor containing a projection read the model charges elsewhere. VALIDATED END-TO-END, which is what settles it: on the InferenceX corpus (573 points, vLLM lane) a 2x2 over the two terms gives overall TPOT mean|e| of 14.98% here against 17.43% for the module-derived floor, and kimi-k2.5 TPOT of 6.38% against 14.57% -- the module floor alone flips the kernel from beating AISimulate's 15.39% to losing to it. No chip family regresses and b200 improves (13.14% -> 13.03%). Per docs/methodology.md, no per-primitive fit ships without an end-to-end check; this is that check rejecting the measured-looking value. TO REPLACE THIS WITH A MEASUREMENT: an attention-only MLA sweep, measuring the kernel without its projections. Subtracting a modelled projection cost from the module figure would make this contingent on the GEMM envelope it must be independent of.
  - attention_decode_rate_mla:
      value: 2928000
      units: bytes_per_us
      method: measured
