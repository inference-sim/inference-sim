      value: 4.3
      units: us_per_transfer
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H200), vllm.utils.deep_gemm.fp8_fp4_paged_mqa_logits, DeepSeek-V4-Flash-FP8 and V4-Pro-FP8 (64 index heads, head_dim 128, FP8 keys), 414 decode points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 model_executor/layers/sparse_attn_indexer.py, fp8_fp4_paged_mqa_logits decode call", role: supporting}
      rationale: >
        The launch-and-schedule floor of DeepGEMM's fp8_fp4_paged_mqa_logits, the lightning indexer's scoring scan that vLLM v0.31.0 runs on SM90 for every index-source layer of DeepSeek-V4.1 (FP8 keys and dense logits: MXFP4 keys and the sparse-logits path need SM100). Timed under CUDA graphs on the kernel itself, not a module. Fitted jointly with a per-row-key work rate over 414 points (geometric error 1.079x); the floor is identified by the 238 points whose work term is under 5% of it (1.050x, signed 0.984). The work rate is NOT committed -- see attention_decode_rate_block_index_scores. The measured checkpoints carry 64 index heads where V4.1 carries 32; a floor is a launch cost, and fitted on each checkpoint alone it is 4.29 us, 4.28 us. The kernel and scheduler are unchanged across the DeepGEMM pins of vLLM 0.25.0 and 0.31.0 except for zero-length bounds handling. Covers the logits kernel only: the top-k and V4.1's candidate select/mask kernels are separate launches this does not include. Consumed by no reader yet: the kernel prices a role: block_index_scores node with its layer kind's pair and needs to look this name up (attention_decode_<floor|rate>_<role>). Reproduce with scripts/fit_deepseek_v41_h200.py.
  - attention_decode_rate_block_index_scores:
      value: 3840000.0
      units: bytes_per_us
      method: assumed
      fitted: false
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_paged_mqa_logits_module_perf.parquet (NVIDIA H200): fitted throughput 5.35 TB/s-equivalent at 132 B/key, above the 4.8 TB/s HBM peak", role: upper_bound}
        - {kind: model, cite: "NVIDIA AISimulate systems/h200_sxm.yaml mem_bw_empirical_scaling_factor (hbm_derate)", role: primary}
      rationale: >
        ASSUMED: NVIDIA's empirical HBM rate, BwPeak x hbm_derate = 4.8 TB/s x 0.8 -- the descriptor's observed correction, not a bound; the bound is BwPeak itself. Bytes are 132 per compressed index key per request (128 FP8 + one FP32 scale, _indexer_k_cache_head_dim), over ceil(context / compress_ratio) keys -- V4.1's compress ratios are 1 and 2, so the scan grows with context while the attention it feeds does not. WHY NOT THE MEASURED SLOPE: the only kernel-level sweep gives every query row the same block table, so its unique key footprint is at most 34.6 MB, and its fitted throughput, 5.35 TB/s-equivalent, exceeds the HBM datasheet peak, which an HBM read cannot -- consistent with the shared keys being served from cache. In serving each request's keys are its own and HBM-resident. Compute does not bind at one query token per request: 32 heads x 128 x 2 = 8,192 FLOP per 132 B key is 62 FLOP/B against an FP8 ridge of 412. DIRECTION: unknown at this fraction -- optimistic if this kernel streams index pages below NVIDIA's empirical HBM fraction, pessimistic if above. The real rate cannot exceed BwPeak, so this rate can be pessimistic by at most 1.25x (scan time over-priced); how optimistic it can be is not bounded. Under speculative decoding each request scores k+1 query rows against each key, so k = 5 brings it to 372 FLOP/B -- still under the ridge at datasheet peak, but at the 664 TFLOPS this kernel was measured sustaining (a lower bound on what it can) the scan could become compute-bound at as little as 0.46 of this rate. TO REPLACE IT: the same sweep with a distinct block table per query row, so the keys are read from HBM. Scoped to this model; consumed by no reader yet (see the floor).
