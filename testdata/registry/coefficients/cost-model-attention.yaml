  - attention_decode_rate_sparse_mla:
      value: 1123200.0
      units: bytes_per_us
      method: measured
      fitted: true
      scope: {hardware: [h200], model: [deepseek-v4.1-flash]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/sparse_attention/vllm/0.25.0/dsv4_hca_attn_module_perf.parquet (NVIDIA H200), FLASHMLA_SPARSE_DSV4, sgl-project/DeepSeek-V4-Flash-FP8 (64 query heads, the h64 kernel), 207 decode points", role: primary}
        - {kind: model, cite: "vLLM v0.31.0 models/deepseek_v41/nvidia/flashmla.py DeepseekV4FlashMLAAttention._forward_decode", role: supporting}
      rationale: >
        1.12 TB/s, 0.234 of this part's 4.8 TB/s datasheet bandwidth, for vLLM v0.31.0's FlashMLA sparse decode on SM90 -- one flash_mla_with_kvcache call per layer over the sliding window plus the indexer's top-k, query heads padded to 64 at every TP width, the 584 B V4 KV record. BYTES ARE COUNTED IN FLASHMLA'S 64-TOKEN BLOCKS: per request, 584 x 64 x (ceil(window tokens / 64) + ceil(selected tokens / 64)), which once the context fills the window and the top-512 is 10 blocks, 373,760 B, at ONE query token per request (the sweep's decode rows are isl 1; a multi-token decode, as under DSpark speculation, is outside what was measured). THE FLOOR is this part's part-wide attention_decode_floor (13.5 us), which blis-latency-kernel inherits for a kind with a rate and no floor. It over-prices the table's shortest reads: batch-1 rows of at most one block measure 9.8-11.8 us, so pinning costs 14%-38% there; a free floor lands at 13.3 us (1.181x against 1.182x) only because a linear form cannot follow the step between one and two blocks. THE ERROR DEPENDS ON BATCH, which the overall 1.182x (signed 1.055, 207 points, 1-130 blocks per request) hides. Signed by batch: 1: 0.99, 2: 1.04, 4: 1.07, 8: 1.09, 16: 1.08, 32: 1.05, 64: 1.25, 128: 1.45, 256: 1.10, 512: 0.80, 1024: 0.65. Neither a per-request term (floor + c x batch + bytes / rate: 1.179x) nor an occupancy form (floor + a x ceil(batch x blocks / P), P fitted at 64: 1.173x) removes it, so it is batch-dependent scheduling inside the call, not a missing term this form can carry. Trained on requests of <= 3 blocks and held out on >= 5 the rate predicts 1.210x (signed 0.827, n=16, all at batch <= 16); at exactly V4.1's 10 blocks 1.089x (signed 0.918, n=4, batch <= 8). AT VOLUME THE READ IS STILL FAR FROM HBM-BOUND: the marginal bandwidth (the least-squares slope of latency on bytes) is 0.85 TB/s, 18% of peak, over the 118 rows of at least 1 MB; 0.85 TB/s, 18% of peak, over the 39 rows of at least 10 MB; the 3 largest calls, 115 MB at batch 1024, read at 19.0%-19.1% of peak net of the floor. SO V4.1'S OPERATING POINT IS INSIDE THE MEASURED RANGE ON THE BLOCK AXIS ONLY: it reads 10 blocks per query at any context past about 1k tokens, at batches the sweep's batch x context <= 1M grid never pairs with 10 blocks; across the measured batches the signed error spans the range above. Nor on call volume: at the sweep's largest batch, 1024, V4.1's 10 blocks per request read 383 MB per call, 3.3x the largest measured call. WHY THIS SHIPS WHEN DEEPSEEK-V4-PRO'S WAS WITHDRAWN (methodology section 10.3): that rate was fitted on Pro's 128-head rows (the h128 instance, which Pro runs only below TP 2) and was to be charged against the kernel's selection rule for Pro's csa4 layers -- up to 262,912 tokens at a 1M context, far outside any measured row on the block axis. Every V4.1 sparse layer reads at most 640 tokens per query (128 window + top-512) on the h64 instance at every TP width. SCOPED TO THIS MODEL so no other sparse_mla deployment changes. WHAT THE TIMED OP DOES NOT CONTAIN: the 0.25.0 ratio-128 rows take their indices from metadata, while v0.31.0's V4.1 decode also launches compute_global_topk_indices_and_lens (a Triton kernel translating the indexer's top-k to cache slots) on every compressed (compress_ratio 1 or 2) layer -- a known gap, one small launch per layer not priced here. The FlashMLA SM90 sparse decode device code is unchanged between the pins vLLM 0.25.0 and 0.31.0 build (a6ec2ba, 0eee43b: renames only, the 584 B assert identical); its split-KV combine kernel's grid moves from (b, s_q, h) to (b*s_q, 1, h), inert at one query token, and gains 192/224/256-split cases that only requests needing more than 160 splits reach; the host API was rewritten, including skipping the split workspace for unsplit requests. NO END-TO-END CHECK EXISTS FOR vLLM: AISimulate FPM (revision 03e006de) carries DeepSeek-V4.1-Flash on h200 under SGLang only -- another engine, MoE kernel and checkpoint revision -- so it cannot arbitrate vLLM v0.31.0 pricing; blis-registry#42 has no arbiter until a vLLM V4.1 forward-pass measurement exists, see methodology section 10.5. Reproduce with scripts/fit_deepseek_v41_h200.py.
