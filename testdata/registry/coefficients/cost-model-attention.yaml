      scope: {hardware: [h200]}
      sources:
        - {kind: model, cite: "NVIDIA AISimulate systems/data/h200_sxm/mla/vllm/0.25.0/mla_generation_module_perf.parquet (NVIDIA H200), model deepseek-ai/DeepSeek-V3, latent width 576 elements (kv_lora_rank 512 + qk_rope_head_dim 64, from blis-catalog models/deepseek-v3/graph.yaml), lane FLASHMLA, 2208 points", role: primary}
      rationale: >
        2.93 TB/s, which is 0.61 of this part's 4.80 TB/s datasheet bandwidth. An MLA kernel reads ONE latent vector per token, of width kv_lora_rank + qk_rope_head_dim = 576 elements, so its byte count is a property of the checkpoint rather than of a KV-head count the sweep varies -- which is why the module table has no head columns and why this family was recorded as unfittable before. What makes the fit possible is that the vLLM module tables carry `model` and `architecture`, so the geometry is resolved from the catalog rather than assumed. Fitted jointly with the other member of this pair over 300 points in the linear regime; geometric error 1.244x there and 1.547x over the whole sweep, the difference being the floor-dominated rows at small context.
