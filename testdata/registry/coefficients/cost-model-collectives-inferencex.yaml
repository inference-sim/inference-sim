      sources:
        - {kind: model, cite: "InferenceX CollectiveX run 1793303708 (https://inferencex.semianalysis.com/api/v1/collectivex/runs/1793303708?version=1; body sha256 78d991b356a157fbe50b59f62724331fd69a68b7e5c38610a2dbb305f36454af; the same points are published byte-identically in runs 1793237711, 1793244384, 1793264366, 1793264384, 1793264397, 1793270219, 1793270233, 1793295596, 1793295612, 1793300196), backend deepep-v2 mode normal, bf16, EP8, hidden 7168 top-6 of 384 uniform, roundtrip p50", role: primary}
      rationale: >
        DeepEP v2 ElasticBuffer dispatch plus combine with vLLM deepep_v2's CUDA-graphs-on flags (no CPU sync, no expand, receive bounded at the next power of two of the batch, overlap off, single reduction; vLLM v0.31.0 prepare_finalize/deepep_v2.py:180-207), which is the kernel's deepep_v2_graph. CollectiveX replays the decode ladder as a graph and runs the prefill ladder eager on the same path (ep_deepep_v2.py:166-185, InferenceX ea6f44d), as vLLM runs a large prefill batch uncaptured; the fit spans both. Not DeepEP's legacy high-throughput kernels, which CollectiveX does not run. EP8 over 2 GB200 trays (4 GPUs each) inside one NVL72 MNNVL domain, no scale-out. floor + tokens x hidden x 2 x top_k / rate, per-rank tokens, fitted by mean |log ratio| (0.020) on tokens 1/4/16/64/256/1024/4096 (7 points). Held out (tokens 2/8/32/128/512/2048/8192, declared before the fit): median |rel err| 2.0%; T2 -2.0%, T8 -1.1%, T32 +2.0%, T128 +5.4%, T512 +4.1%, T2048 -1.4%, T8192 -4.4%. DeepEP d4f41e4e93 (vLLM v0.31.0's pin)...01dc3aa: 6 commits ahead, 0 behind, four of them (#674, #688, #715, #178) on the elastic path these rows run, so this measures a DeepEP six commits newer than v0.31.0's; that residual is unmeasured. Reproduce with scripts/fit_deepep_collectivex.py.
