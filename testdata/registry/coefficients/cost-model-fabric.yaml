# Inter-node fabric bandwidth: the effective / nominal correction per fabric class.
#
# GENERATED by scripts/emit_fabric.py. Re-run it and commit the diff rather than editing
# values here; `emit_fabric.py --check` is the drift gate.
#
# One entry per blis-catalog networks/ fabric, scoped by the fabric's catalog identity
# (the `fabric` scope key, blis-schemas#112). blis-latency-kernel multiplies a fabric's
# nominal InterNodeBwGBps by it wherever bytes leave a node. An NVLink domain spanning a
# rack (gb200-nvl72) is the chip's, not a fabric's, and is not corrected here.
#
# None of these is a measurement this project made: ib-400g is `literature` (published
# nccl-tests results), roce-200g and ethernet-100gbe are `assumed`, each with its range.
kind: CoefficientSet
name: cost-model-fabric
coefficients:
  - fabric_bandwidth_efficiency:
      value: 0.5
      units: dimensionless
      method: assumed
      fitted: false
      scope: {fabric: [ethernet-100gbe]}
      sources:
        - {kind: discussion, cite: "https://route179.dev/2026/07/21/dgx-spark-nccl-roce-benchmarking (2026-07-21; page sha256 07379fe826ab5049065f087054d6dab0778ca0526101c47b86c47ded04761baf): NCCL's silent TCP fallback, about 3 GB/s against about 20 GB/s over RDMA on the same link", role: supporting}
      rationale: >
        ASSUMED, with no measurement: plain 100 GbE with TCP (no RDMA), so the CPU stays in the data path and NCCL runs its socket transport. No public, pinned measurement of NCCL or a KV transfer over 100 GbE TCP between GPU hosts was found. 0.5 is the midpoint of a wide RANGE 0.2-0.9, chosen to say that the rate is well below line rate without claiming a figure. The one public datum, the RoCE page above, saw NCCL silently fall back to TCP at about 3 GB/s on a 25 GB/s link (0.12). That was a misconfigured fallback on a different link, so it shows how low TCP can go and does not set the value. Replace with a measurement when one exists. Reproduce with scripts/emit_fabric.py.
  - fabric_bandwidth_efficiency:
      value: 0.811
      units: dimensionless
      method: literature
      fitted: false
      scope: {fabric: [ib-400g]}
      sources:
        - {kind: publication, cite: "https://github.com/NVIDIA/nccl-tests/issues/309: issue body sha256 bc8137556e2ce25c651cd982f9958203b3ca96797543b4aeb34a997118b835ac (ib_send_bw 396 Gb/s, 2-host 469.21 GB/s); comments 2904845294 sha256 e43aa547046cc3858c77f474f4c216aa671a85c6e803f44790aebdbfdb96ce89, 2982333665 sha256 d40a242c3f613ca4199a60faec0ad1a8d719e3b297ff6d3609c356543bbc2cfb, 2983888014 sha256 99ed9844c145eda7047b6e712d29ffafb0cc8d3762f92c54bc3b52c6615aab9d, 2984447704 sha256 b3eb1ffbccb53470190bbb2927a5a7b2cdf0d8a5edaca4501deb6bd3fca9e8e0, 2984669604 sha256 41ab4e0975ba219142ac3d98d61d24cf280e3de2a03ea7a8e474059e53e1cdde (GitHub API body text)", role: primary}
      rationale: >
        Published payload throughput over nominal for 400 Gb/s InfiniBand NDR, one ConnectX-7 per GPU (catalog InterNodeBwGBps 50). From NVIDIA/nccl-tests#309 (2025-05-20; Dell XE9680, 8x H100 and 8x ConnectX-7 400G IB per host, NCCL 2.26.2): the median of all_reduce busbw over the 400 GB/s ceiling an NVIDIA maintainer states for 8 such NICs, across the issue's rows from at least 4 hosts at default NCCL settings (4 hosts 365.84 GB/s (0.915); 4 hosts 324.52 GB/s (0.811); 8 hosts 320.70 GB/s (0.802)) = 0.811. The 2-host rows (469.21, 466.73 GB/s) exceed the ceiling and are excluded, as the maintainer calls 2-node results an aberration. The estimator was declared before the figures were read off (scripts/emit_fabric.py). RANGE 0.80-0.99: the upper end is one NIC's GPUDirect ib_send_bw (396 Gb/s), the regime of a single large RDMA write such as a KV handoff; tuned NCCL (NCCL_MIN_CTAS=24, NCCL_IB_QPS_PER_CONNECTION=2) reached 0.978 on 8 nodes. The value is collective-level, so it understates a large point-to-point transfer by up to 22%. Not from InferenceX CollectiveX: its h200-dgxc InfiniBand pool is KVM-virtualised (strict-ordered GPU-NIC writes cap near 10 GB/s per GPU there) and its rows report logical, not wire, payload, so they do not isolate the fabric. literature, not measured: published results this project has not reproduced, on H100 hosts only. Reproduce with scripts/emit_fabric.py.
  - fabric_bandwidth_efficiency:
      value: 0.811
      units: dimensionless
      method: assumed
      fitted: false
      scope: {fabric: [roce-200g]}
      sources:
        - {kind: discussion, cite: "https://route179.dev/2026/07/21/dgx-spark-nccl-roce-benchmarking (2026-07-21; page sha256 07379fe826ab5049065f087054d6dab0778ca0526101c47b86c47ded04761baf): 2x DGX Spark RoCEv2, ib_write_bw 98.04 + 98.04 Gb/s, all_gather_perf busbw 24.20 GB/s at 16 GiB", role: supporting}
      rationale: >
        ASSUMED: no public multi-node measurement of a RoCE-200G rail on an HGX host was found, and InferenceX CollectiveX runs no RoCE pool. Taken equal to the ib-400g collective-level fraction, 0.811, on the reasoning that RoCEv2 over a switched Ethernet fabric does not outperform InfiniBand at scale (DeepEP's README: fully tested with InfiniBand, theoretically compatible with RoCE). RANGE 0.70-0.97. The upper end is the one public RoCEv2 measurement found: two DGX Spark (GB10) nodes, cabled directly with no switch, two 100G links merged (NCCL 2.28.9): all_gather busbw 24.2 GB/s at 16 GiB over 25 GB/s nominal = 0.968, and ib_write_bw 2 x 98.04 Gb/s over 200 = 0.980. That is a best case with no switch, two ranks and no congestion, not this fabric, so it bounds the value and does not set it. The lower end allows for congestion and PFC/ECN tuning on a shared lossless Ethernet fabric, which no public figure pins. Replace with a measurement when one exists. Reproduce with scripts/emit_fabric.py.
