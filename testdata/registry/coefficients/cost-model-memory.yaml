  - activation_scratch_floor_bytes:
      value: 73400320
      units: bytes_per_rank
      method: vendor_spec
      fitted: false
      scope: {hardware: [a100-80, a100-sxm, b200, b300, gb200-nvl72, gb300, h100, h200, l40s]}
      sources:
        - kind: model
          cite: "NVIDIA AISimulate aisimulate_core/sdk/backends/base_backend.py BaseBackend.MIN_ACTIVATION_BYTES, not overridden by VLLMBackend"
          role: primary
      rationale: >
        The lower clamp on activation scratch, 70 MiB per rank: activation bytes are
        max(activation_buffer_count_<family>_<N>rank * max_num_batched_tokens * h * 2,
        this). It binds only at a small token budget -- for h = 4096 at the dense 8-rank
        multiple of 5 the product falls below it under 1,792 tokens -- and is recorded
        so that a consumer reproducing NVIDIA's form does not have to rediscover it.
        vendor_spec: NVIDIA's figure, which its vLLM backend inherits unchanged (SGLang
        raises it to 90 MiB).
  - cudagraph_capture_bytes_piecewise:
      value: 858783744
      units: bytes_per_rank
      method: assumed
      fitted: false
      scope: {hardware: [a100-80, a100-sxm, b200, b300, gb200-nvl72, gb300, h100, h200, l40s]}
      sources:
        - kind: discussion
          cite: "vLLM start-up logs in vllm-project/vllm issues, collected by scripts/mine_vllm_cudagraph_memory.py into docs/vllm-cudagraph-capture-samples.csv"
          role: supporting
        - kind: discussion
          cite: "vllm/v1/worker/gpu_model_runner.py profile_cudagraph_memory and vllm/v1/worker/gpu_worker.py, the accounting the dimension is taken from"
          role: supporting
      rationale: >
        Device memory a PIECEWISE CUDA-graph capture holds per rank, outside the KV
        budget.

        DIMENSION, from vLLM's own accounting. vLLM measures a capture as a free-memory
        delta and, since v0.21, subtracts it from the KV budget by default
        (VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS; vllm/v1/worker/gpu_worker.py). Its
        profiler (gpu_model_runner.py, profile_cudagraph_memory) prices each runtime
        mode as one FIRST capture -- the largest shape, captured first, which sizes the
        shared graph pool -- plus a per-graph increment of at least 1 MiB for every
        further shape, and overlays PIECEWISE and FULL in one pool by taking the larger
        first capture. So the cost is dominated by the largest captured shape, not
        proportional to the number of shapes: the constant this replaces was justified
        as "one buffer set per captured shape", which is not how vLLM allocates.

        MAGNITUDE (orientation only -- THIS IS THE CAVEAT). 0.80 GiB is the median of 18
        vLLM start-up logs on catalog parts (A100, B200, H100, H200, L40S) whose mode is
        PIECEWISE, stated in the log or vLLM's default for the stated version; the
        interquartile range is 0.62 to 1.42 GiB. The constant it replaces was 0.50 GiB,
        below the median. These are vLLM's own measurements, but of uncontrolled
        deployments, which is why this is assumed and not measured.

        KNOWN LIMITATION. A flat per-rank figure. The real one grows with
        max_cudagraph_capture_size and with the model's width, and shrinks somewhat with
        tensor parallelism; no scope dimension can carry those, so a deployment far from
        the median model size is far from this figure in either direction. Each sample
        is a different model and capture list, so the spread is variation ACROSS
        deployments, not noise around one value.

        TO REPLACE THIS WITH A MEASUREMENT. Start the target deployment once and read
        vLLM's own log: "CUDA graph pool memory: X GiB (actual)" on v0.21 and later, or
        "Graph capturing finished in S secs, took X GiB" before it. One start-up, no
        benchmark, and the number is per rank.
  - cudagraph_capture_bytes_full_and_piecewise:
      value: 1159725056
      units: bytes_per_rank
      method: assumed
      fitted: false
      scope: {hardware: [a100-80, a100-sxm, b200, b300, gb200-nvl72, gb300, h100, h200, l40s]}
      sources:
        - kind: discussion
          cite: "vLLM start-up logs in vllm-project/vllm issues, collected by scripts/mine_vllm_cudagraph_memory.py into docs/vllm-cudagraph-capture-samples.csv"
          role: supporting
        - kind: discussion
          cite: "vllm/v1/worker/gpu_model_runner.py profile_cudagraph_memory and vllm/v1/worker/gpu_worker.py, the accounting the dimension is taken from"
          role: supporting
      rationale: >
        Device memory a FULL_AND_PIECEWISE CUDA-graph capture holds per rank, outside
        the KV budget. It cannot be below the PIECEWISE figure for the same deployment:
        it captures the PIECEWISE set and the FULL decode set into one overlaid pool, so
        it pays the larger first capture plus both sets' per-graph increments.

        DIMENSION, from vLLM's own accounting. vLLM measures a capture as a free-memory
        delta and, since v0.21, subtracts it from the KV budget by default
        (VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS; vllm/v1/worker/gpu_worker.py). Its
        profiler (gpu_model_runner.py, profile_cudagraph_memory) prices each runtime
        mode as one FIRST capture -- the largest shape, captured first, which sizes the
        shared graph pool -- plus a per-graph increment of at least 1 MiB for every
        further shape, and overlays PIECEWISE and FULL in one pool by taking the larger
        first capture. So the cost is dominated by the largest captured shape, not
        proportional to the number of shapes: the constant this replaces was justified
        as "one buffer set per captured shape", which is not how vLLM allocates.

        MAGNITUDE (orientation only -- THIS IS THE CAVEAT). 1.08 GiB is the median of 22
