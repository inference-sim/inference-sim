# Kimi-K3 with the DSpark drafter its catalog entry names (inference-sim#2316): the drafter's five MLA
# layers are latents like the target's 24, so the memory model's page and the mapped layers agree.
# The deployment is a test input for the recurrent-state mapping, not a published arm.
kind: Scenario
name: recurrent-kimi-k3-b200-dspark
engine: {kind: vllm}

model: kimi-k3
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: b200
  fabric: ib-400g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: recurrent-kimi-k3-b200-dspark

pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 8, pp: 1, dp: 2, enable_expert_parallel: true}
    engine:
      max_model_len: 32768
      speculative_config: {method: "dspark", num_speculative_tokens: 3, model: "kimi-k3-dspark"}
