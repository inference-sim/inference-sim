name: mutation-vllm

# The mutation sweeps: each supported row's one-line mutants must be caught by the tests oracle-vllm.yml
# runs (oracle/README.md). They take longer than the core checks, so they run on demand, never on
# a push or a pull request.
#
# NOT YET RUN IN THE SINGLE MODULE: oracle/mutate*.py copy their first argument (the engine directory) to a
# scratch directory and run `go test` there, and engines/vllm has no go.mod of its own, so each mutant is
# BROKEN until the harness copies into a scratch module (M3.2 follow-up). The definition is kept so the
# sweeps are not lost (X13); it is only syntax-checked.
#
# Each sweep reads the fuzz corpora the oracle-vllm.yml fuzz jobs read, from the same cache
# (.github/actions/oracle-fuzz-vllm), or regenerates them on a miss.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    working-directory: engines/vllm

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: env
        uses: ./.github/actions/oracle-env-vllm
      - name: the fuzz corpora and vLLM's traces for them
        uses: ./.github/actions/oracle-fuzz-vllm
        with:
          python-version: ${{ steps.env.outputs.python-version }}
      - uses: ./.github/actions/go-toolchain
      - name: mutation sweeps
        run: |
          set -o pipefail
          python3 -I oracle/mutate.py . oracle/out/fuzz "$RUNNER_TEMP/mutants" | tee oracle/out/mutation-results.txt
          python3 -I oracle/mutate_t3.py . oracle/out/fuzz-t3 "$RUNNER_TEMP/mutants-t3" | tee oracle/out/mutation-results-t3.txt
          python3 -I oracle/mutate_t4.py . oracle/out/fuzz-connector "$RUNNER_TEMP/mutants-t4" | tee oracle/out/mutation-results-t4.txt
          python3 -I oracle/mutate_e24.py . "$RUNNER_TEMP/mutants-e24" | tee oracle/out/mutation-results-e24.txt
          python3 -I oracle/mutate_sched_alloc.py . "$RUNNER_TEMP/mutants-sched-alloc" | tee oracle/out/mutation-results-sched-alloc.txt
          python3 -I oracle/mutate_engineargs.py . "$RUNNER_TEMP/mutants-engineargs" | tee oracle/out/mutation-results-engineargs.txt
          python3 -I oracle/mutate_metrics.py . oracle/out/fuzz "$RUNNER_TEMP/mutants-metrics" | tee oracle/out/mutation-results-metrics.txt
          python3 -I oracle/mutate_rules.py . "$RUNNER_TEMP/mutants-rules" vllm-source | tee oracle/out/mutation-results-rules.txt
          python3 -I oracle/mutate_hash_manifest.py . "$RUNNER_TEMP/mutants-hash" hash | tee oracle/out/mutation-results-hash.txt
          # The manifest generator's -check catches a missed definition form or a dropped
          # enablement (K1-K2).
          python3 -I oracle/mutate_hash_manifest.py . "$RUNNER_TEMP/mutants-manifest" manifest vllm-source | tee oracle/out/mutation-results-manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation
          path: |
            engines/vllm/oracle/out/mutation-results*.txt
            engines/vllm/oracle/out/fuzz-cache.json
            oracle-env.lock
