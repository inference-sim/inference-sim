name: gofmt

# Every Go file in the tree must be gofmt-clean, so a file a pull request does not touch cannot
# carry formatting debt into the next one. Making the job a required check is a ruleset setting
# that a person with write access applies; until then it can fail without blocking a merge. It runs
# on pull requests to main, feature/** and llm-d-r, so a pull request stacked on another branch is
# checked once it targets main.
on:
  pull_request:
    branches: [main, 'feature/**', llm-d-r]

jobs:
  gofmt-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt every tracked Go file
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(git ls-files '*.go')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tracked Go file found"
            exit 1
          fi
          bad=$(gofmt -l "${files[@]}")
          if [ -n "$bad" ]; then
            echo "::error::these Go files are not gofmt-clean (run gofmt -w):"
            echo "$bad"
            gofmt -d $bad
            exit 1
          fi
          echo "${#files[@]} Go files are gofmt-clean"
