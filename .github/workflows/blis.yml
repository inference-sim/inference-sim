name: blis

# The shared BLIS checks (design §13.2, §13.4), called from blis-substrate by commit (X21):
# the pull-request checks (description, review questions, commit policy, workflow lint,
# version literals, documentation references, cited issues, quarantine, the generated
# AGENTS.md section and pull-request template, the selected-version lint), the merge check on
# the merge-queue tree, and the nightly checks (cited issues stay open, X28).
#
# The commit is the blis-substrate release v0.12.0 (d98137b); it moves to
# a substrate release tag's commit when that release is cut.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@d98137b23553da787f71a4ff08f4122f3f6f30bf
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      repo: inference-sim
      substrate-ref: d98137b23553da787f71a4ff08f4122f3f6f30bf

  merge:
    if: github.event_name == 'merge_group'
    uses: inference-sim/blis-substrate/.github/workflows/shared-merge-check.yml@d98137b23553da787f71a4ff08f4122f3f6f30bf
    permissions:
      contents: read
      pull-requests: read
      checks: read
    with:
      substrate-ref: d98137b23553da787f71a4ff08f4122f3f6f30bf
      required: "build,lint,blis checks / blis checks"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@d98137b23553da787f71a4ff08f4122f3f6f30bf
    permissions:
      contents: read
      issues: read
    with:
      substrate-ref: d98137b23553da787f71a4ff08f4122f3f6f30bf
    secrets:
      INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}
