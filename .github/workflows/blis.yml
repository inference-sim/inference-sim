name: blis

# The BLIS pull-request checks (design §13.2), run from this repository's own tree (X21): the
# commit policy, workflow lint, version literals, documentation references, licence and notice
# files, the generated AGENTS.md section and pull-request template, and the selected-version
# lint. They are a local reusable workflow, so they run at the commit of this workflow. No check
# reads the text of a pull request or an issue, and none runs on a schedule (design §4.2).

on:
  pull_request:
    # No edited: an edit of the title or body starts nothing here (ci-retarget.yml runs ci.yml
    # for a retarget).
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A pull request has one run at a time: a push supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: ./.github/workflows/shared-pr-checks.yml
    permissions:
      contents: read
    with:
      repo: inference-sim
