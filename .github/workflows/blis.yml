name: blis

# The shared BLIS checks (design §13.2, §13.4), called from blis-substrate by commit (X21):
# the pull-request checks (description, review questions, commit policy, workflow lint,
# version literals, documentation references, cited issues, quarantine, the generated
# AGENTS.md section and pull-request template, the selected-version lint), and the nightly
# checks (cited issues stay open, X28).
#
# The commit is the head of blis-substrate's layer 1 of M2 (m2/1-process-and-release-checks),
# where the review questions are guidance for the review agent and the shared check no longer
# fails on one; it moves to a substrate release tag's commit when that release is cut.

on:
  pull_request:
    # edited: retargeting the next pull request of a squash stack to main starts the checks.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A pull request has one run at a time: a body edit or a push supersedes the run in progress.
# The nightly and dispatched runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@f36f6b2e4900f2556c7f64940a657a89e89c756b
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      repo: inference-sim
      substrate-ref: f36f6b2e4900f2556c7f64940a657a89e89c756b

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@f36f6b2e4900f2556c7f64940a657a89e89c756b
    permissions:
      contents: read
      issues: read
    with:
      substrate-ref: f36f6b2e4900f2556c7f64940a657a89e89c756b
    secrets:
      INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}
