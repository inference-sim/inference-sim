name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**', llm-d-r]
  # On-demand, so the L1 delivery loop (#1654) can run the REAL required checks against a
  # delivery branch. A bot-opened PR has its pull_request runs held for human approval, so the
  # loop cannot rely on them; a workflow_dispatch run always starts and produces check runs with
  # the same names on the same commit, which is what the branch ruleset requires. Inert
  # otherwise — it only adds a manual "Run workflow" button.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

  test:
    # Spelled out as GitHub derives a matrix job's name, because the names are main's required
    # checks: an entry whose packages moved keeps its old name (name_packages), byte for byte.
    name: test (${{ matrix.name }}, ${{ matrix.name_packages || matrix.packages }}, ${{ matrix.timeout }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "cluster (heavy)"
            packages: "./sim/cluster"
            timeout: "15m"
          - name: "core packages"
            packages: "./sim ./sim/trace"
            timeout: "10m"
          # The latency kernel's scoring harness and the offline scoring tools. Hermetic: scenarios
          # come from the kernel module go.mod pins, the catalog and registry are vendored under
          # testdata/. The measurement-corpus tests are behind -tags scoring and do not run here.
          # The harness and the tools moved from sim/kernelmodel and cmd/ to tools/ (phase 2c of
          # #2021), so that sim/ and cmd/ link blis-vllm only through cmd/engine_build.go. Only
          # the package list moved: the entry's name is a required check, so it still names the
          # harness's old path.
          - name: "kernel backend"
            packages: "./tools/..."
            name_packages: "./sim/kernelmodel/..."
            timeout: "10m"
          - name: "workload & cmd"
            packages: "./sim/workload ./cmd"
            timeout: "10m"
          - name: "root & internals"
            packages: ". ./sim/internal/..."
            timeout: "5m"
          # The CI shell scripts are driven by a test-only package. The matrix lists
          # packages explicitly rather than ./..., so this entry is what makes them run.
          - name: "scripts"
            packages: "./scripts"
            timeout: "5m"
          # The embedded llm-d router: determinism across processes, run/replay inputs, flow
          # control, P/D and the single-instance identity contract.
          - name: "llm-d router"
            packages: "./sim/llmd"
            timeout: "10m"
          # Every other package with tests: the vendored catalog and registry's lock test, the
          # saturation detectors and the invariant scan (the offline scoring tools moved to
          # tools/, which "kernel backend" runs). A new entry, not a renamed one, since the
          # entries' names are required checks; this one is not.
          # scripts' TestEveryPackageWithTestsRunsInCI fails if a package with tests is in none.
          - name: "other packages"
            packages: "./sim/vendored ./sim/saturation ./internal/invariantscan"
            timeout: "5m"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The scripts package parses every inline github-script body with Node (#1811). The Node is
      # pinned here, not taken from the runner, which can be too old for optional chaining; a
      # missing Node fails that test (REQUIRE_NODE) instead of skipping it (X16).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test ${{ matrix.name }}
        env:
          REQUIRE_NODE: "1"
        run: go test -v -timeout ${{ matrix.timeout }} ${{ matrix.packages }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The module targets Go 1.27 (the llm-d router requires it). golangci-lint refuses a module
      # newer than the Go that built it and the published binaries are built with an older Go,
      # so the linter is built from source with the module's Go.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          install-mode: goinstall

  # A NEW job, not a step added to an existing shard: renaming a required check blocks PRs, so the
  # size guard gets its own name. Path-independent backstop for the CLAUDE.md charter — it catches
  # regrowth from ANY route (a fork PR, a human commit, a future workflow), including the paths the
  # delivery-verify `claude_md_edit` guard never sees. The ceiling leaves generous headroom over
  # the lean file so a legitimate operating-rule addition does not trip it; it fires only on
  # changelog-scale bloat, which is what #1818 removed.
  # actionlint parses every workflow and its expressions and the inline github-script bodies'
  # syntax is checked by the scripts package (#1811). actionlint is pinned to a release; its
  # shellcheck and pyflakes integrations are off because the existing run blocks have not been
  # through them, and a gate that fails on first contact would be switched off, not fixed.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

  claude-md-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce the CLAUDE.md size ceiling
        run: scripts/claude-md-size.sh CLAUDE.md 40000
