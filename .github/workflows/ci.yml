name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**', llm-d-r]
    # No edited: an edit starts no run here (see the concurrency comment below; a retarget runs
    # through ci-retarget.yml). ready_for_review
    # starts CI for a draft made ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # On-demand, so the L1 delivery loop (#1654) can run the REAL required checks against a
  # delivery branch. A bot-opened PR has its pull_request runs held for human approval, so the
  # loop cannot rely on them; a workflow_dispatch run always starts and produces check runs with
  # the same names on the same commit, which is what the branch ruleset requires. A dispatch runs
  # EVERY job (the loop reads a green run as "the whole suite passed"), unless changed_paths is
  # given, which previews what a pull request touching those paths would run.
  workflow_dispatch:
    inputs:
      changed_paths:
        description: "Optional: repository paths (one per line) to run the path filter for, as if a pull request changed them. Empty runs everything."
        required: false
        default: ""
      save_cache:
        description: "Also run the cache-warm job, which saves the Go build cache for this ref (a push to main always does)."
        type: boolean
        required: false
        default: false

# A new push to a pull request supersedes the run on the old head: nothing about the old head can
# be required any more. Pushes to main and dispatches have unique groups and are never cancelled.
# An edit of a pull request's title or body starts no CI run: it changes no code, and the ruleset reads
# the newest CI run on the head commit, so a run that skips every job blocks the merge (#2261).
# A retarget (a change of the base) is also an edit: ci-retarget.yml dispatches this workflow on the
# head branch for it. A fork's pull request needs a push, or a close and reopen, after its retarget.
# No other workflow runs on an edit (scripts/ci_edit_test.go).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token for every job, whatever the repository default: jobs on the scale sets get no
# write credential (actions/checkout persists the token). Nothing here needs more: upload-artifact
# and the cache use the runtime token, and the oracle workflows declare the same.
permissions:
  contents: read

env:
  # One module-cache directory for every job and for cache-warm. Go keys a compiled package by
  # the directory its source is read from, so a build cache saved with the modules in one
  # directory is not hit by a job that keeps them in another. Nothing restores this directory:
  # every job starts with it empty, so a test that needs a module it does not download itself
  # fails here rather than passing on a cache a previous job filled (X25).
  GOMODCACHE: /tmp/gomodcache
  GOFLAGS: -modcacherw

jobs:
  # Which jobs the change needs (scripts/ci-changes.sh, with the rules and their evidence). The
  # required status checks below always report: a required job whose group is off skips its
  # steps and still succeeds, because a skipped job named by a matrix template never reports the
  # name the ruleset waits for. The jobs that are not required are skipped whole.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.groups.outputs.build }}
      lint: ${{ steps.groups.outputs.lint }}
      core: ${{ steps.groups.outputs.core }}
      cluster: ${{ steps.groups.outputs.cluster }}
      kernel: ${{ steps.groups.outputs.kernel }}
      workload: ${{ steps.groups.outputs.workload }}
      cmd: ${{ steps.groups.outputs.cmd }}
      root: ${{ steps.groups.outputs.root }}
      scripts: ${{ steps.groups.outputs.scripts }}
      llmd: ${{ steps.groups.outputs.llmd }}
      bytegate: ${{ steps.groups.outputs.bytegate }}
      other: ${{ steps.groups.outputs.other }}
      stack: ${{ steps.groups.outputs.stack }}
      selected: ${{ steps.groups.outputs.selected }}
      actionlint: ${{ steps.groups.outputs.actionlint }}
      claudemd: ${{ steps.groups.outputs.claudemd }}
      structure: ${{ steps.groups.outputs.structure }}
      substrate: ${{ steps.groups.outputs.substrate }}
      vllm: ${{ steps.groups.outputs.vllm }}
      sglang: ${{ steps.groups.outputs.sglang }}
      runner-large: ${{ steps.runners.outputs.large }}
      runner-oracle: ${{ steps.runners.outputs.oracle }}
      large-workers: ${{ steps.runners.outputs.large-workers }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A pull request's checkout is a merge commit; its first parent is the base.
          fetch-depth: 2

      - name: Groups the change needs
        id: groups
        env:
          EVENT: ${{ github.event_name }}
          PATHS_INPUT: ${{ inputs.changed_paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            # --no-renames lists both the old and the new path of a move.
            git diff --name-only --no-renames 'HEAD^1' HEAD > changed.txt
            scripts/ci-changes.sh < changed.txt > groups.txt
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$PATHS_INPUT" ]; then
            printf '%s\n' "$PATHS_INPUT" > changed.txt
            scripts/ci-changes.sh < changed.txt > groups.txt
          else
            : > changed.txt
            scripts/ci-changes.sh --all < /dev/null > groups.txt
          fi
          echo "changed paths: $(wc -l < changed.txt | tr -d ' ')"
          cat groups.txt
          cat groups.txt >> "$GITHUB_OUTPUT"

      # Where the heavy jobs run, decided once for every job that reads it. A job marked large (or an
      # oracle job) runs on the self-hosted scale set CI_RUNS_ON_LARGE (CI_RUNS_ON_ORACLE) names
      # (k8s/ci) whenever that variable is set, for a fork's pull request too: a maintainer approves
      # every outside contributor's workflow run before it starts, and the pods' isolation (k8s/ci)
      # protects the cluster. The worker counts only the large pods can afford come from the same
      # decision, so a hosted job never gets them.
      - name: Runners the heavy jobs use
        id: runners
        env:
          LARGE: ${{ vars.CI_RUNS_ON_LARGE }}
          ORACLE: ${{ vars.CI_RUNS_ON_ORACLE }}
        run: |
          set -euo pipefail
          for v in "$LARGE" "$ORACLE"; do
            [[ "$v" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "a CI_RUNS_ON_* variable is not a runner label: $v"; exit 1; }
          done
          { echo "large=$LARGE"; echo "oracle=$ORACLE"; echo "large-workers=${LARGE:+6}"; } >> "$GITHUB_OUTPUT"
          echo "large jobs: ${LARGE:-ubuntu-latest}; oracle jobs: ${ORACLE:-ubuntu-latest}"

  build:
    name: "build"
    needs: changes
    # Required check: it always reports. Its steps run when a non-test Go file or a module file changed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: The change filter ran
        run: test "${{ needs.changes.result }}" = success

      - name: Checkout code
        if: needs.changes.outputs.build == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        if: needs.changes.outputs.build == 'true'
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        if: needs.changes.outputs.build == 'true'
        run: go build -v ./...

  test:
    needs: changes
    # Spelled out as GitHub derives a matrix job's name, because the names are main's required
    # checks: an entry whose packages moved keeps its old name (name_packages), byte for byte.
    name: test (${{ matrix.name }}, ${{ matrix.name_packages || matrix.packages }}, ${{ matrix.timeout }})
    # Every entry always runs and skips its steps when its group is off: a job skipped whole
    # under a matrix template would not report the name a ruleset waits for, and a job-level
    # "if" cannot read the matrix. A skipped entry costs seconds on a runner.
    if: ${{ !cancelled() }}
    # An entry marked large runs where the changes job decided (runner-large): the self-hosted CI
    # scale set CI_RUNS_ON_LARGE names (k8s/ci) when it is set, else hosted. The
    # worker counts below read the same decision (large-workers), so a hosted runner never gets the
    # larger setting.
    runs-on: ${{ matrix.runner || (matrix.large && needs.changes.outputs.runner-large) || 'ubuntu-latest' }}
    # The longest entry (substrate) has a 30m go test timeout.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # flag: the ci-changes.sh group that turns the entry on. exclude: packages the entry's
        # patterns match that another entry runs instead (a slow one, on a runner of its own).
        include:
          - name: "cluster (heavy)"
            packages: "./sim/cluster"
            timeout: "15m"
            flag: cluster
          - name: "core packages"
            packages: "./sim ./sim/trace"
            timeout: "10m"
            flag: core
          # The latency kernel's scoring harness and the offline scoring tools. Hermetic: scenarios
          # come from the kernel fixtures (testdata/kernel), the catalog and registry from substrate/
          # (internal/substratedata). The measurement-corpus tests are behind -tags scoring and do not run here.
          # The harness and the tools moved from sim/kernelmodel and cmd/ to tools/ (phase 2c of
          # #2021), so that sim/ and cmd/ link the engines only through cmd/engine_build.go. Only
          # the package list moved: the entry's name is a required check, so it still names the
          # harness's old path.
          - name: "kernel backend"
            packages: "./tools/..."
            name_packages: "./sim/kernelmodel/..."
            timeout: "10m"
            flag: kernel
          - name: "root & internals"
            packages: ". ./sim/internal/..."
            timeout: "5m"
            flag: root
          # The CI shell scripts are driven by a test-only package. The matrix lists
          # packages explicitly rather than ./..., so this entry is what makes them run.
          - name: "scripts"
            packages: "./scripts ./scripts/kernel/equalityprobe"
            name_packages: "./scripts"
            timeout: "5m"
            flag: scripts
          # The byte gate (design SIM-4, X13): a fixed set of runs whose standard output must not
          # change in a refactor, compared byte for byte (outside the Result's runtime member)
          # with testdata/bytegate/golden, at GOMAXPROCS 1 and 4. A pull request that moves a
          # golden file is not a refactor and says so, with the diff and its price-change report.
          # It builds the blis binary, so it runs when anything the binary links, or the gate's
          # own inputs, change; a change to a _test.go file or to docs does not.
          - name: "byte gate"
            packages: "./internal/bytegate"
            timeout: "10m"
            flag: bytegate
          # The same gate on arm64: the outputs must be identical across platforms (design X6),
          # and arm64 is where Go fuses a multiply and an add that amd64 does not.
          - name: "byte gate arm64"
            packages: "./internal/bytegate"
            timeout: "10m"
            runner: "ubuntu-24.04-arm"
            flag: bytegate
          # Every other package with tests: the substrate data roots, the stack record, the
          # saturation detectors, the input validators (sim/check) and the invariant scan (the
          # offline scoring tools moved to tools/, which "kernel backend" runs). A new entry, not a
          # renamed one, since the entries' names are required checks; this one is not.
          # scripts' TestEveryPackageWithTestsRunsInCI fails if a package with tests is in none.
          - name: "other packages"
            packages: "./internal/substratedata ./internal/kernelfixtures ./internal/stack/... ./sim/saturation ./sim/check ./internal/invariantscan ./internal/val8"
            timeout: "5m"
            flag: other
          # The checks that read the whole tree (design v4.2.0 section 3.4): the import graph
          # against Table 1, the X7 path references, no nested go.mod, and the module zip size
          # (SUB-13). Any change runs it. A new entry, so no existing required name moves.
          - name: "repository structure"
            packages: "./internal/repocheck"
            timeout: "10m"
            flag: structure
          # The merged trees (M3.2 row 2.R): each is one module's former test suite, run as its own
          # entry so a change under one directory runs its tests and the jobs that link it (the
          # path classes in scripts/ci-changes.sh). New entries, so no existing required name moves.
          - name: "substrate"
            packages: "./substrate/..."
            exclude: "./substrate/kernel"
            timeout: "30m"
            flag: substrate
          # The cost model's tests are most of substrate's time, and its perturbation tests are
          # memory bound: on the large runner they use more workers (BLIS_PERTURBATION_WORKERS).
          - name: "substrate kernel"
            packages: "./substrate/kernel"
            timeout: "30m"
            flag: substrate
            large: true
          # The kernel model's tests run as three shards of their own (test-shards, kernelmodel).
          - name: "engine vllm"
            packages: "./engines/vllm/..."
            exclude: "./engines/vllm/core/kernelmodel"
            timeout: "25m"
            flag: vllm
          - name: "engine sglang"
            packages: "./engines/sglang/..."
            timeout: "15m"
            flag: sglang

    steps:
      - name: The change filter ran, and whether this entry's group is on
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          ON: ${{ needs.changes.outputs[matrix.flag] }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          echo "run=$ON" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The upstream sources the merged trees' tests read. An absent source is a failure, not a
      # skip (X16): the tests run with *_SOURCE_REQUIRED=1 below. The commits are pinned.
      - name: Check out vLLM v0.31.0 (the files substrate's tests read)
        if: steps.gate.outputs.run == 'true' && matrix.flag == 'substrate'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: vllm-project/vllm
          ref: db9527a46873454610df6dbedf79a36d6bf1a7f6 # v0.31.0
          path: upstream/vllm
          sparse-checkout: |
            vllm/v1/worker
            vllm/config

      - name: Check out aiperf v0.12.0 (the files the workload tests read)
        if: steps.gate.outputs.run == 'true' && matrix.flag == 'substrate'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ai-dynamo/aiperf
          ref: be53bf2953d30e46c500e6a80fc1f8b6f84bc718 # v0.12.0
          path: upstream/aiperf
          sparse-checkout: |
            src/aiperf

      - name: Check out vLLM at the commit the vLLM engine models (internal/upstream Commit)
        if: steps.gate.outputs.run == 'true' && matrix.flag == 'vllm'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: vllm-project/vllm
          ref: 0fda86a35419c9c70dbfada224c838c10fbb62ad
          path: upstream/vllm
          fetch-depth: 1

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      # The scripts package parses every inline github-script body with Node (#1811). The Node is
      # pinned here, not taken from the runner, which can be too old for optional chaining; a
      # missing Node fails that test (REQUIRE_NODE) instead of skipping it (X16).
      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Tests read only their declared inputs (X25): the module cache starts empty, so a test
      # that needs a module it does not download itself fails here rather than passing on a
      # cache a previous job filled. Only the build cache is restored (see GOMODCACHE above).
      - name: Test ${{ matrix.name }} from an empty module cache
        if: steps.gate.outputs.run == 'true'
        env:
          REQUIRE_NODE: "1"
          # Read only by the tests of the entries that check the sources out above; elsewhere unset.
          VLLM_SOURCE: ${{ (matrix.flag == 'substrate' || matrix.flag == 'vllm') && format('{0}/upstream/vllm', github.workspace) || '' }}
          VLLM_SOURCE_REQUIRED: ${{ (matrix.flag == 'substrate' || matrix.flag == 'vllm') && '1' || '' }}
          AIPERF_SOURCE: ${{ matrix.flag == 'substrate' && format('{0}/upstream/aiperf/src/aiperf', github.workspace) || '' }}
          AIPERF_SOURCE_REQUIRED: ${{ matrix.flag == 'substrate' && '1' || '' }}
          # Read only by substrate/kernel's perturbation tests; unset, they use two workers.
          BLIS_PERTURBATION_WORKERS: ${{ (matrix.large && needs.changes.outputs.large-workers) || '' }}
          PACKAGES: ${{ matrix.packages }}
          EXCLUDE: ${{ matrix.exclude }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          if [ -z "$EXCLUDE" ]; then pkgs="$(go list $PACKAGES)"; else pkgs="$(go list $PACKAGES | grep -vxF -f <(go list $EXCLUDE))"; fi
          test -n "$pkgs"
          # shellcheck disable=SC2086
          go test -v -timeout ${{ matrix.timeout }} $pkgs

  # The packages that dominate the wall clock are split by test name into parallel shards
  # (scripts/ci-shard.sh): a test belongs to the shard cksum(name) mod N picks, so the shards
  # partition the package's tests exactly. Each shard writes the list, its share and what it
  # ran; the job named below, after the shards, fails unless together they ran every test once
  # (scripts/ci-shard-verify.sh).
  # The salt in an entry (scripts/ci-shard.sh, CI_SHARD_SALT) only spreads the few slow tests of a
  # package over its shards; the partition is exact for any salt.
  # CI_SHARD_SOLO (an entry's solo) gives a test a shard of its own, the last; the other tests are
  # hashed over the rest, so cmd's salt still spreads them over shards 1 to 4. A large entry runs
  # on the self-hosted scale set, as in the test job.
  test-shards:
    needs: changes
    name: test (${{ matrix.name }}, ${{ matrix.packages }}, ${{ matrix.timeout }})
    if: ${{ !cancelled() }}
    runs-on: ${{ (matrix.large && needs.changes.outputs.runner-large) || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "workload shard 1/2", group: workload, packages: "./sim/workload", timeout: "10m", salt: "s5:", flag: workload, shard: 1, shards: 2 }
          - { name: "workload shard 2/2", group: workload, packages: "./sim/workload", timeout: "10m", salt: "s5:", flag: workload, shard: 2, shards: 2 }
          - { name: "cmd shard 1/4", group: cmd, packages: "./cmd", timeout: "15m", salt: "s8:", flag: cmd, shard: 1, shards: 5, solo: TestClusterMatrix_EveryCellSimulatesOrIsRefusedWithItsReason }
          - { name: "cmd shard 2/4", group: cmd, packages: "./cmd", timeout: "15m", salt: "s8:", flag: cmd, shard: 2, shards: 5, solo: TestClusterMatrix_EveryCellSimulatesOrIsRefusedWithItsReason }
          - { name: "cmd shard 3/4", group: cmd, packages: "./cmd", timeout: "15m", salt: "s8:", flag: cmd, shard: 3, shards: 5, solo: TestClusterMatrix_EveryCellSimulatesOrIsRefusedWithItsReason }
          - { name: "cmd shard 4/4", group: cmd, packages: "./cmd", timeout: "15m", salt: "s8:", flag: cmd, shard: 4, shards: 5, solo: TestClusterMatrix_EveryCellSimulatesOrIsRefusedWithItsReason }
          # The support-matrix test simulates every cell on BLIS_CLUSTER_MATRIX_WORKERS workers.
          - { name: "cmd cluster matrix", group: cmd, packages: "./cmd", timeout: "15m", salt: "s8:", flag: cmd, shard: 5, shards: 5, solo: TestClusterMatrix_EveryCellSimulatesOrIsRefusedWithItsReason, large: true }
          # The kernel model's tests, by name (the salt spreads its slowest few over the three).
          - { name: "kernelmodel shard 1/3", group: kernelmodel, packages: "./engines/vllm/core/kernelmodel", timeout: "15m", salt: "s47:", flag: vllm, shard: 1, shards: 3 }
          - { name: "kernelmodel shard 2/3", group: kernelmodel, packages: "./engines/vllm/core/kernelmodel", timeout: "15m", salt: "s47:", flag: vllm, shard: 2, shards: 3 }
          - { name: "kernelmodel shard 3/3", group: kernelmodel, packages: "./engines/vllm/core/kernelmodel", timeout: "15m", salt: "s47:", flag: vllm, shard: 3, shards: 3 }
    steps:
      - name: The change filter ran, and whether this entry's group is on
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          ON: ${{ needs.changes.outputs[matrix.flag] }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          echo "run=$ON" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # cmd's recipe-preset test (cmd/recipe_presets_test.go) reads the vLLM recipes at the commit
      # the engine models. An absent source is a failure, not a skip (X16): VLLM_SOURCE_REQUIRED is
      # set below for the cmd shards. The commit is the vLLM commit stack.json names.
      - name: Check out the vLLM recipes at the modelled commit (the cmd recipe-preset test reads them)
        if: steps.gate.outputs.run == 'true' && matrix.group == 'cmd'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: vllm-project/vllm
          ref: 0fda86a35419c9c70dbfada224c838c10fbb62ad
          path: upstream/vllm
          sparse-checkout: recipes/models

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test ${{ matrix.name }} from an empty module cache
        if: steps.gate.outputs.run == 'true'
        env:
          CI_SHARD_SALT: ${{ matrix.salt }}
          CI_SHARD_SOLO: ${{ matrix.solo }}
          # Read only by cmd's support-matrix test; unset, it uses three workers.
          BLIS_CLUSTER_MATRIX_WORKERS: ${{ (matrix.large && needs.changes.outputs.large-workers) || '' }}
          # The heavy legs build and run a 120 MB test binary that re-executes itself; two
          # concurrent compile and test jobs instead of one per CPU keep the runner responsive.
          GOFLAGS: -modcacherw -p=2
          REQUIRE_NODE: "1"
          # Read only by cmd's recipe-preset test; elsewhere unset.
          VLLM_SOURCE: ${{ matrix.group == 'cmd' && format('{0}/upstream/vllm', github.workspace) || '' }}
          VLLM_SOURCE_REQUIRED: ${{ matrix.group == 'cmd' && '1' || '' }}
        run: |
          # A diagnostic for the runner kills of the heavy leg (exit 143, "The runner has received
          # a shutdown signal", 4 to 6 minutes into compiling and running ./cmd): memory and load
          # every ten seconds, in this step's own log, which survives the kill (a later step does
          # not run after one).
          ( while sleep 10; do echo "sample $(date +%T) $(free -m 2>/dev/null | sed -n 2p) | $(uptime)"; done ) &
          scripts/ci-shard.sh ${{ matrix.shard }} ${{ matrix.shards }} "$RUNNER_TEMP/evidence" ${{ matrix.packages }} -timeout ${{ matrix.timeout }}

      - name: Keep the evidence of what this shard ran
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: ignore

  test-llmd-shards:
    needs: changes
    name: test (${{ matrix.name }}, ${{ matrix.packages }}, ${{ matrix.timeout }})
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The embedded llm-d router: determinism across processes, run/replay inputs, flow
          # control, P/D and the single-instance identity contract.
          - { name: "llm-d router shard 1/2", group: llmd, packages: "./sim/llmd", timeout: "10m", salt: "s180:", flag: llmd, shard: 1, shards: 2 }
          - { name: "llm-d router shard 2/2", group: llmd, packages: "./sim/llmd", timeout: "10m", salt: "s180:", flag: llmd, shard: 2, shards: 2 }
    steps:
      - name: The change filter ran, and whether this entry's group is on
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          ON: ${{ needs.changes.outputs[matrix.flag] }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          echo "run=$ON" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test ${{ matrix.name }} from an empty module cache
        if: steps.gate.outputs.run == 'true'
        env:
          CI_SHARD_SALT: ${{ matrix.salt }}
          REQUIRE_NODE: "1"
        run: scripts/ci-shard.sh ${{ matrix.shard }} ${{ matrix.shards }} "$RUNNER_TEMP/evidence" ${{ matrix.packages }} -timeout ${{ matrix.timeout }}

      - name: Keep the evidence of what this shard ran
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.group }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: ignore

  # The two required checks whose packages are sharded keep their names here: this job is
  # "test (workload & cmd, ./sim/workload ./cmd, 10m)" and fails when any of its shards failed,
  # was cancelled, or ran a test set that is not the whole package, and when the change filter
  # itself failed. A skipped shard (group off) is a success.
  test-workload-cmd:
    needs: [changes, test-shards]
    name: "test (workload & cmd, ./sim/workload ./cmd, 10m)"
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Shards passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          case "$SHARDS" in success|skipped) ;; *) echo "test shards: $SHARDS"; exit 1 ;; esac

      - name: Checkout code
        if: needs.changes.outputs.workload == 'true' || needs.changes.outputs.cmd == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the workload evidence
        if: needs.changes.outputs.workload == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-workload-*
          path: gathered/workload

      - name: Fetch the cmd evidence
        if: needs.changes.outputs.cmd == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-cmd-*
          path: gathered/cmd

      - name: Every workload test ran in exactly one shard
        if: needs.changes.outputs.workload == 'true'
        run: scripts/ci-shard-verify.sh 2 gathered/workload

      - name: Every cmd test ran in exactly one shard
        if: needs.changes.outputs.cmd == 'true'
        run: scripts/ci-shard-verify.sh 5 gathered/cmd

  # The kernel model's shards, proved to have run every test of the package once.
  test-kernelmodel:
    needs: [changes, test-shards]
    name: "test (engine vllm kernelmodel, ./engines/vllm/core/kernelmodel, 15m)"
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Shards passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-shards.result }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          case "$SHARDS" in success|skipped) ;; *) echo "test shards: $SHARDS"; exit 1 ;; esac

      - name: Checkout code
        if: needs.changes.outputs.vllm == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the evidence
        if: needs.changes.outputs.vllm == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-kernelmodel-*
          path: gathered/kernelmodel

      - name: Every test of the package ran in exactly one shard
        if: needs.changes.outputs.vllm == 'true'
        run: scripts/ci-shard-verify.sh 3 gathered/kernelmodel

  # The llm-d router's name is kept for the same reason (it is not a required check today, but
  # the delivery loop and people read the name).
  test-llmd:
    needs: [changes, test-llmd-shards]
    name: "test (llm-d router, ./sim/llmd, 10m)"
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Shards passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.test-llmd-shards.result }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          case "$SHARDS" in success|skipped) ;; *) echo "test shards: $SHARDS"; exit 1 ;; esac

      - name: Checkout code
        if: needs.changes.outputs.llmd == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the evidence
        if: needs.changes.outputs.llmd == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-llmd-*
          path: gathered/llmd

      - name: Every test of the package ran in exactly one shard
        if: needs.changes.outputs.llmd == 'true'
        run: scripts/ci-shard-verify.sh 2 gathered/llmd

  lint:
    name: "lint"
    needs: changes
    # Required check: it always reports; the linter runs when a Go file or a module file changed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: The change filter ran
        run: test "${{ needs.changes.result }}" = success

      - name: Checkout code
        if: needs.changes.outputs.lint == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The module targets the Go release that go.mod names (the llm-d router requires it). golangci-lint refuses a module
      # newer than the Go that built it and the published binaries are built with an older Go,
      # so the linter is built from source with the module's Go. The binary is cached per Go
      # version, so only the first run after a Go bump compiles it.
      - name: Setup Go
        if: needs.changes.outputs.lint == 'true'
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        if: needs.changes.outputs.lint == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: The linter binary for this Go
        id: linter
        if: needs.changes.outputs.lint == 'true'
        run: echo "key=golangci-lint-v2.14.0-${{ runner.os }}-${{ runner.arch }}-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore the linter binary
        id: linter-cache
        if: needs.changes.outputs.lint == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ steps.linter.outputs.key }}

      - name: Build the linter
        if: needs.changes.outputs.lint == 'true' && steps.linter-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Keep the linter binary
        if: needs.changes.outputs.lint == 'true' && steps.linter-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ steps.linter.outputs.key }}

      # substrate/ came in with a lint baseline (34 findings at the merge: 23 errcheck, 7 staticcheck,
      # 4 unused; see substrate/.golangci.yml), which its repository held by linting changed code
      # only. Everything else is linted whole; substrate/ is linted for findings a change adds.
      - name: Lint
        if: needs.changes.outputs.lint == 'true'
        run: ~/go/bin/golangci-lint run $(go list ./... | grep -v '/substrate/\|/substrate$' | sed 's#^github.com/inference-sim/inference-sim#.#')

      - name: Lint substrate (new findings only)
        if: needs.changes.outputs.lint == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            ~/go/bin/golangci-lint run --new-from-rev="$BASE_SHA" ./substrate/...
          else
            echo "no base revision to compare with; linting the changed files of the last commit"
            ~/go/bin/golangci-lint run --new-from-rev=HEAD~1 ./substrate/...
          fi

  # The stack record and the version rules (design SIM-3, LIF-2, X11, X23): stack.json equals
  # what the build selects; go.mod has one replace and only engine excludes; the toolchain is
  # substrate/contracts/toolchain, installed exactly (GOTOOLCHAIN=local, so no
  # build downloads one); and the documents that state versions are the ones rendered from
  # stack.json. internal/stack's tests hold the first three; versions-doc --check the last.
  stack:
    needs: changes
    if: ${{ needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: The toolchain is substrate/contracts/toolchain
        run: |
          want="$(tr -d '[:space:]' < substrate/contracts/toolchain)"
          got="$(go env GOVERSION)"
          if [ "$got" != "$want" ]; then
            echo "go is $got; substrate/contracts/toolchain is $want" >&2
            exit 1
          fi

      - name: stack.json, go.mod and the toolchain
        run: go test -count=1 ./internal/stack/... && go run ./internal/stack/cmd/stackgen -check

      - name: Rendered version strings
        run: go run ./internal/stack/cmd/versions-doc -check

  # The checks of the substrate/ directory that no Go test of the simulator runs (the substrate's own
  # Go tests run in the jobs above, which a substrate/ change always turns on). Ported from the
  # former blis-substrate repository's ci.yml (jobs contracts-checks, catalog, registry, ledger, mutants); each runs from
  # substrate/ as its repository root, so a path in a command is the one it had there. The jobs that
  # hold a token or the ledger seed (ledger.yml, nightly-fetch-configs.yml, acceptance-refresh.yml)
  # and the sharded and gate workflows are not ported yet.
  substrate-checks:
    needs: changes
    if: ${{ needs.changes.outputs.substrate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      # Python code that restates a Go rule (X15).
      - name: Python rule lint (X15)
        working-directory: substrate
        run: |
          set -euo pipefail
          go run ./tools/prcheck vocab > "$RUNNER_TEMP/vocab.json"
          python3 -I tools/pyrules/pyrules.py "$RUNNER_TEMP/vocab.json"

      # The AGENTS.md block, the pull-request template and the rendered index match the invariant
      # registry (design section 13.1).
      - name: Invariant copies match the registry
        working-directory: substrate
        run: go run ./tools/invariants render -check

      - name: The ledger files load and pass their checks (D3, D4)
        working-directory: substrate
        run: |
          set -euo pipefail
          go run ./ledger/cmd/ledger check catalog/ledger
          go run ./ledger/cmd/ledger scan-roles .

      # The scoring suite needs measurement corpora the repository does not distribute, so it is
      # compiled and vetted here but not run (the corpus-backed tests are behind -tags scoring).
      - name: Vet the cost model with the scoring tag
        run: go vet -tags scoring ./substrate/kernel/...

      # A kernel is safe to call from many goroutines: the one place the cost model starts any.
      - name: Race test of the cost model's concurrency property
        run: go test -race -count=1 -run TestStepTimeIsPureAndSafeUnderConcurrency ./substrate/kernel/

      - name: Python script tests that need no corpus
        run: |
          set -euo pipefail
          python3 substrate/kernel/scripts/test_extract_inferencex_engine_settings.py
          python3 substrate/kernel/scripts/test_gen_aisimulate_scenarios.py
          python3 -I substrate/kernel/scripts/test_extract_aisimulate_e2e.py

  substrate-mutants:
    needs: changes
    if: ${{ needs.changes.outputs.substrate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      # Breaks each guarded property of the cost model in turn and requires its test to fail (X13).
      - name: Mutation check of the cost model
        run: go test -count=1 -v -run '^TestGuardedPropertiesKillTheirMutants$' ./substrate/kernel/

  substrate-catalog:
    needs: changes
    if: ${{ needs.changes.outputs.substrate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Every catalog entry validates
        working-directory: substrate
        run: go run ./validate/cmd/validate-catalog catalog

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: substrate/catalog/scripts/requirements-dev.txt

      - run: pip install --require-hashes -r substrate/catalog/scripts/requirements-dev.txt

      - name: Every graph re-derives from its vendor configuration
        working-directory: substrate/catalog
        run: python3 scripts/derive_graph.py --check

      # Public repositories are fetched with no token and hash-checked; a gated one is left for
      # the nightly token job.
      - name: Hash-pinned graphs re-derive from their public configs
        working-directory: substrate/catalog
        run: |
          set -euo pipefail
          python3 scripts/fetch_pinned_configs.py "$RUNNER_TEMP/fetched"
          python3 scripts/derive_graph.py --check --fetched "$RUNNER_TEMP/fetched" --allow-unfetched

      - name: The deriver's tests
        working-directory: substrate/catalog
        run: python3 -m pytest tests -q

  substrate-registry:
    needs: changes
    if: ${{ needs.changes.outputs.substrate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Every coefficient set validates
        working-directory: substrate
        run: go run ./validate/cmd/validate-registry registry

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            substrate/registry/scripts/requirements.txt
            substrate/registry/scripts/requirements-fit.txt

      - run: pip install --require-hashes -r substrate/registry/scripts/requirements.txt
      - run: pip install --require-hashes -r substrate/registry/scripts/requirements-fit.txt

      # The acceptance emitter's inputs are not committed (X12): fetched at the pinned commit, each by hash.
      - name: Fetch the pinned InferenceX golden curves
        working-directory: substrate
        run: python -I registry/scripts/fetch_inferencex_curves.py

      # The tests that re-derive a value from third-party sweeps skip when the data is absent;
      # every other skip fails this job (X16).
      - name: The derivation and value-preservation tests
        working-directory: substrate/registry
        run: |
          set -euo pipefail
          python -m pytest validator/ -q -rs | tee "$RUNNER_TEMP/pytest.log"
          unexpected=$(awk '/^SKIPPED/ && !/AISimulate data not present|CollectiveX run bodies not present|OperatorX MoE response not present|could not import .pyarrow./' "$RUNNER_TEMP/pytest.log")
          if [ -n "$unexpected" ]; then
            echo "skips that rederive.yml does not cover (X16):" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      # The tool that hashes an engine's code paths into CodeIDs (design 3.2, Table DC) and the one
      # that hands them to the registry's writers. Each engine's own Go test holds its table and
      # the exported file fresh.
      - name: The code-path hash and CodeID export tests
        working-directory: substrate
        run: python -m pytest tools/codepaths -q

      # The tool that copies each engine's kernel_impls.json into registry/inputs (VAL-8). Each
      # engine's own Go test holds its copy to the table it embeds.
      - name: The kernel-implementation table export tests
        working-directory: substrate
        run: python -m pytest tools/kernelimpls -q

  # Before a release: every llm-d router package the binary links, tested at the versions
  # inference-sim selects (design §3.2, LIF-2). Also on pull requests that change go.mod. The
  # engines and the substrate are directories of this module, so `go test ./...` covers them. The
  # packages are split by import path into parallel shards; the job named selected-deps, after the
  # shards, fails unless they ran every package once.
  selected-deps-shards:
    needs: changes
    name: selected-deps (${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.shards }})
    if: ${{ needs.changes.outputs.selected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: rest, shard: 1, shards: 2 }
          - { kind: rest, shard: 2, shards: 2 }
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Restore the Go build cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Test router packages at the selected versions
        env:
          SELECTED_DEPS_SHARD: ${{ matrix.kind }}:${{ matrix.shard }}/${{ matrix.shards }}
          CI_SHARD_OUT: ${{ runner.temp }}/evidence
        run: scripts/test-selected-deps.sh -count=1 -timeout 20m

      - name: Keep the evidence of what this shard ran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-selected-${{ matrix.kind }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: ignore

  selected-deps:
    needs: [changes, selected-deps-shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Shards passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.selected-deps-shards.result }}
        run: |
          test "$CHANGES" = success || { echo "the change filter: $CHANGES"; exit 1; }
          case "$SHARDS" in success|skipped) ;; *) echo "selected-deps shards: $SHARDS"; exit 1 ;; esac

      - name: Checkout code
        if: needs.changes.outputs.selected == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the other packages' evidence
        if: needs.changes.outputs.selected == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-selected-rest-*
          path: gathered/rest

      - name: Every other package ran in exactly one shard
        if: needs.changes.outputs.selected == 'true'
        run: scripts/ci-shard-verify.sh 2 gathered/rest

  # A NEW job, not a step added to an existing shard: renaming a required check blocks PRs, so the
  # size guard gets its own name. Path-independent backstop for the CLAUDE.md charter — it catches
  # regrowth from ANY route (a fork PR, a human commit, a future workflow), including the paths the
  # delivery-verify `claude_md_edit` guard never sees. The ceiling leaves generous headroom over
  # the lean file so a legitimate operating-rule addition does not trip it; it fires only on
  # changelog-scale bloat, which is what #1818 removed.
  # actionlint parses every workflow and its expressions and the inline github-script bodies'
  # syntax is checked by the scripts package (#1811). actionlint is pinned to a release; its
  # shellcheck and pyflakes integrations are off because the existing run blocks have not been
  # through them, and a gate that fails on first contact would be switched off, not fixed.
  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.actionlint == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Lint the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

  claude-md-size:
    needs: changes
    if: ${{ needs.changes.outputs.claudemd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enforce the CLAUDE.md size ceiling
        run: scripts/claude-md-size.sh CLAUDE.md 40000

  # Saves the Go build cache the other jobs restore. It runs on a push to main (every merge) and,
  # on request, on a dispatch (save_cache), so a branch can warm its own cache. Pull requests
  # never save: they would fill the repository's 10 GB cache quota with one entry per push.
  cache-warm:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.save_cache) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, scope: all }
          - { runner: ubuntu-24.04-arm, scope: bytegate }
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Restore the previous cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-${{ runner.arch }}-

      # Compile what the jobs compile: every package, every test binary, and the blis binary the
      # byte gate builds (-trimpath, -buildvcs=false). -run '^$' starts no test.
      - name: Compile everything the jobs compile
        run: |
          set -euo pipefail
          go build -buildvcs=false -trimpath -o /dev/null .
          if [ "${{ matrix.scope }}" = all ]; then
            go build ./...
            go test -count=1 -run '^$' ./... > /dev/null
          else
            go test -count=1 -run '^$' ./internal/bytegate > /dev/null
          fi

      - name: Save the cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  # The vLLM engine's checks that are not its package tests (engines/vllm, the former blis-vllm
  # repository; the old job names are in the pull request that ported them). One job, run when the
  # vllm group is on. Step paths are the ones the engine had as a repository root.
  vllm-checks:
    needs: changes
    if: ${{ needs.changes.outputs.vllm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The commit is the one the engine models (engines/vllm/internal/upstream.Commit, not the
      # v0.33.0 the oracle recordings were taken at): the rule pack and the manifests are
      # derived from it. It is pinned, so a moved ref fails the check below instead of changing
      # what they are compared against.
      - name: Check out vLLM at the engine's pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: vllm-project/vllm
          ref: 0fda86a35419c9c70dbfada224c838c10fbb62ad
          path: engines/vllm/vllm-source
          fetch-depth: 1

      - name: The checked-out vLLM is the pinned commit
        run: test "$(git -C engines/vllm/vllm-source rev-parse HEAD)" = 0fda86a35419c9c70dbfada224c838c10fbb62ad

      # Tier 1: the hand-transcribed rule pack re-derived from the release's own source, in
      # both directions. The connector registry's entries are connectors the release registers.
      - name: Rule pack constants and connector registry match the vLLM source
        env:
          VLLM_SOURCE: ${{ github.workspace }}/engines/vllm/vllm-source
          VLLM_SOURCE_REQUIRED: "1"
        run: |
          set -euo pipefail
          go test -count=1 -v -run MatchSource ./engines/vllm/core/rulepack/v0_33/
          go test -count=1 -v -run TestEveryEntryNamesAConnectorVLLMRegisters ./engines/vllm/registry/

      # Tier 5: every vllm:* family, every config field, kernel table and surface item the
      # release defines, regenerated from its source and compared with the committed files.
      - name: fields.json and the value classes are current for the pinned release
        working-directory: engines/vllm
        run: |
          set -euo pipefail
          python3 -I fields/gen_fields.py vllm-source fields/status.json --value-classes fields/value_classes.json --check fields.json
          python3 -I fields/test_gen_fields.py
          VLLM_SOURCE=vllm-source python3 -I fields/test_stand_in.py
          python3 -I fields/gen_classes.py vllm-source fields.json --check fields/value_classes.json
          VLLM_SOURCE="$GITHUB_WORKSPACE/engines/vllm/vllm-source" python3 -I fields/test_classes.py

      # kernel_impls.json: regen.py fetches vLLM at provenance.go's tag and each library at the pin
      # vLLM's own build files state, so no ref here can disagree with vLLM's pin. Needs the network.
      - name: kernel_impls.json is current for the modelled release
        working-directory: engines/vllm
        run: |
          set -euo pipefail
          python3 -I kernels/regen.py --check
          python3 -I kernels/test_gen_kernel_impls.py

      - name: The metrics manifest is current for the pinned release
        working-directory: engines/vllm
        run: go run ./cmd/metricsmanifest -vllm vllm-source -check

      # X9: surface.json lists every item the release registers, each with a status; it reads the
      # manifest checked just above.
      - name: surface.json is current for the pinned release, and every item has a status
        working-directory: engines/vllm
        run: |
          set -euo pipefail
          python3 -I tools/surface/gen_surface.py vllm-source tools/surface/status.json --check surface.json
          python3 -I tools/surface/test_gen_surface.py

      # Each guard must fail on the violation it exists to catch.
      - name: The oracle guards, the engine-block migration and the block-size fetch
        working-directory: engines/vllm
        run: |
          set -euo pipefail
          python3 -I oracle/test_checks.py
          python3 -I tools/migrateengineblock/test_migrate.py
          python3 -I oracle/blocksize/test_modelconfig.py

  # The race detector over the packages of the vLLM engine that start goroutines. The guard fails
  # when a package with a concurrency primitive is in neither the raced list nor EXCLUDED, so a
  # package added later cannot escape the race run. The legs run side by side.
  vllm-race:
    name: vllm-race (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.vllm == 'true' }}
    runs-on: ${{ (matrix.large && needs.changes.outputs.runner-large) || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            pkgs: "./engines/vllm/internal/substratedata ./engines/vllm/core/vllm ./engines/vllm/core/sched ./engines/vllm/core/engine ./engines/vllm/core/kvtransfer ./engines/vllm/core/connector/..."
          # The package's tests, split by name (scripts/ci-shard.sh): the tests with a recorded
          # -race duration (.github/ci-durations/vllmengine-race.tsv) are dealt longest first onto
          # the least-loaded shard, any other test is hashed, and vllm-race-vllmengine proves the
          # five together ran every test once. TestEngineKVStartupFigureAgainstTheLoggedOne (223
          # parallel subtests, about 15 min on a hosted runner) has shard 5 to itself
          # (CI_SHARD_SOLO), on the large runner when there is one: its subtests use every CPU.
          - {name: vllmengine-1, pkgs: "./engines/vllm/vllmengine", shard: 1, shards: 5}
          - {name: vllmengine-2, pkgs: "./engines/vllm/vllmengine", shard: 2, shards: 5}
          - {name: vllmengine-3, pkgs: "./engines/vllm/vllmengine", shard: 3, shards: 5}
          - {name: vllmengine-4, pkgs: "./engines/vllm/vllmengine", shard: 4, shards: 5}
          - {name: vllmengine-5, pkgs: "./engines/vllm/vllmengine", shard: 5, shards: 5, large: true}
          # The block-size census is the slowest race test; it ran as four slices before the merge.
          # It prices the census on every CPU, so it runs on the large runner.
          - name: kernelmodel-census
            pkgs: "./engines/vllm/core/kernelmodel"
            only: "^TestBlockSizeResolutionOverTheCensusFixtures$"
            large: true
    env:
      GOTOOLCHAIN: local
      # The union of the legs' packages. Keep the two in step: the guard step fails when a package
      # with a primitive is in neither this list nor EXCLUDED.
      RACE_PKGS: >-
        ./engines/vllm/internal/substratedata ./engines/vllm/core/vllm ./engines/vllm/core/sched
        ./engines/vllm/core/engine ./engines/vllm/vllmengine ./engines/vllm/core/kvtransfer
        ./engines/vllm/core/connector/... ./engines/vllm/core/kernelmodel
      # Import paths of packages with concurrency primitives that run without -race, space
      # separated, each with its reason stated here. None today.
      EXCLUDED: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/go-toolchain

      - name: Every package with concurrency primitives is under -race
        if: matrix.name == 'core'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # shellcheck disable=SC2086
          go list $RACE_PKGS | sort -u > "$tmp/raced"
          { printf '%s\n' $EXCLUDED; } | sort -u > "$tmp/excluded"
          git ls-files 'engines/vllm/*.go' ':!:*_test.go' ':!:*/testdata/*' ':!:*/_inpackage/*' \
            | xargs grep -lE 'go func|sync\.|atomic\.|chan ' | xargs -n1 dirname | sort -u \
            | while read -r d; do go list "./$d"; done | sort -u > "$tmp/concurrent"
          echo "packages with concurrency primitives:"; cat "$tmp/concurrent"
          missing="$(comm -23 "$tmp/concurrent" <(sort -u "$tmp/raced" "$tmp/excluded"))"
          if [ -n "$missing" ]; then echo "not under -race and not excluded:"; echo "$missing"; exit 1; fi

      - name: go test -race
        if: ${{ !matrix.shard }}
        env:
          PKGS: ${{ matrix.pkgs }}
          ONLY: ${{ matrix.only }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$ONLY" ]; then args+=(-run "$ONLY"); fi
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 50m "${args[@]}" $PKGS

      - name: go test -race, one shard
        if: ${{ matrix.shard }}
        env:
          CI_SHARD_DURATIONS: .github/ci-durations/vllmengine-race.tsv
          CI_SHARD_SOLO: TestEngineKVStartupFigureAgainstTheLoggedOne
          CI_SHARD_LIST_FLAGS: -race
        run: scripts/ci-shard.sh ${{ matrix.shard }} ${{ matrix.shards }} "$RUNNER_TEMP/evidence" ${{ matrix.pkgs }} -race -count=1 -timeout 50m

      - name: Keep the evidence of what this shard ran
        if: ${{ !cancelled() && matrix.shard }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-vllmengine-race-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
          if-no-files-found: ignore

  # The vllmengine race shards, proved to have run every test of the package once.
  vllm-race-vllmengine:
    needs: [changes, vllm-race]
    if: ${{ !cancelled() && needs.changes.outputs.vllm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The race shards passed
        env:
          SHARDS: ${{ needs.vllm-race.result }}
        run: |
          test "$SHARDS" = success || { echo "vllm-race: $SHARDS"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch the evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: evidence-vllmengine-race-*
          path: gathered/vllmengine-race

      - name: Every test of the package ran in exactly one shard
        run: scripts/ci-shard-verify.sh 5 gathered/vllmengine-race

  # The oracle tiers run the engine's real source on CPU in a hash-locked Python environment and
  # compare. They need network access to the engine's repository and Hugging Face (config files
  # only), so they are reusable workflows run when the engine's group is on.
  oracle-vllm:
    needs: changes
    if: ${{ needs.changes.outputs.vllm == 'true' }}
    uses: ./.github/workflows/oracle-vllm.yml
    with:
      runner: ${{ needs.changes.outputs.runner-oracle }}

  oracle-sglang:
    needs: changes
    if: ${{ needs.changes.outputs.sglang == 'true' }}
    # Hosted until its setup on the scale set is fast: there oracle-env-sglang takes about 5.5 min,
    # bound by the cluster's egress, so the four cluster jobs took 12 to 16 min against about 7 hosted.
    uses: ./.github/workflows/oracle-sglang.yml

  # The one status to require. Every job above reports success, failure or skipped; this one
  # succeeds when none failed or was cancelled and the change filter itself ran, so a skipped job
  # (its group off) is a success and a job skipped because the filter broke is not.
  required:
    needs: [changes, build, test, test-shards, test-workload-cmd, test-kernelmodel, test-llmd-shards, test-llmd, lint, stack, substrate-checks, substrate-mutants, substrate-catalog, substrate-registry, selected-deps-shards, selected-deps, actionlint, claude-md-size, vllm-checks, vllm-race, vllm-race-vllmengine, oracle-vllm, oracle-sglang]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nothing failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          bad="$(printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')"
          if [ -n "$bad" ]; then echo "not successful: $bad"; exit 1; fi
          printf '%s\n' "$RESULTS" | jq -e '.changes.result == "success"' > /dev/null
