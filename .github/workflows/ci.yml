name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
  # On-demand, so the L1 delivery loop (#1654) can run the REAL required checks against a
  # delivery branch. A bot-opened PR has its pull_request runs held for human approval, so the
  # loop cannot rely on them; a workflow_dispatch run always starts and produces check runs with
  # the same names on the same commit, which is what the branch ruleset requires. Inert
  # otherwise — it only adds a manual "Run workflow" button.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "cluster (heavy)"
            packages: "./sim/cluster"
            timeout: "15m"
          - name: "core packages"
            packages: "./sim ./sim/kv ./sim/trace"
            timeout: "10m"
          - name: "kv transfer"
            packages: "./sim/kvtransfer"
            timeout: "10m"
          - name: "latency models"
            packages: "./sim/latency"
            timeout: "10m"
          - name: "workload & cmd"
            packages: "./sim/workload ./cmd"
            timeout: "10m"
          - name: "root & internals"
            packages: ". ./sim/internal/..."
            timeout: "5m"
          # The CI shell scripts are driven by a test-only package. The matrix lists
          # packages explicitly rather than ./..., so this entry is what makes them run.
          - name: "scripts"
            packages: "./scripts"
            timeout: "5m"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Test ${{ matrix.name }}
        run: go test -v -timeout ${{ matrix.timeout }} ${{ matrix.packages }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  # A NEW job, not a step added to an existing shard: renaming a required check blocks PRs, so the
  # size guard gets its own name. Path-independent backstop for the CLAUDE.md charter — it catches
  # regrowth from ANY route (a fork PR, a human commit, a future workflow), including the paths the
  # delivery-verify `claude_md_edit` guard never sees. The ceiling leaves generous headroom over
  # the lean file so a legitimate operating-rule addition does not trip it; it fires only on
  # changelog-scale bloat, which is what #1818 removed.
  claude-md-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce the CLAUDE.md size ceiling
        run: |
          set -uo pipefail
          ceiling=40000
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md is $size bytes (ceiling $ceiling)"
          if [ "$size" -gt "$ceiling" ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md is $size bytes, over the $ceiling-byte ceiling."
            echo "CLAUDE.md is agent operating context, not a changelog (see the charter at the top"
            echo "of the file). Per-PR rationale, migration notes and byte-identity evidence belong"
            echo "in the commit body and the relevant docs/ guide — not here. Move the new content"
            echo "there and leave a pointer, or raise the ceiling in ci.yml only with a reason."
            exit 1
          fi
