name: mutation-sglang

# The SGLang engine's mutation sweep (T7, engines/sglang/oracle/mutate.py): one deliberate one-line break
# at a time, and the suite that covers it must fail. Ported from blis-sglang's mutation.yml; the full sweep
# runs on demand (workflow_dispatch). blis-sglang also ran it nightly, on release tags, and on every pull
# request for the files that request changed (oracle/mutate.py --changed BASE); those triggers are not
# carried over (see below), and the sweep is shared out over 6 shards side by side (--shard I/N).
#
# NOT YET RUN IN THE SINGLE MODULE: oracle/mutate.py copies engines/sglang to a scratch directory and runs
# `go test` there, and engines/sglang has no go.mod of its own, so each mutant is BROKEN until the harness
# copies into a scratch module (and --changed reads repository-relative paths). That redesign is an M3.2
# follow-up; the definition is kept so the sweep is not lost (X13) and is only syntax-checked. The nightly and
# per-pull-request triggers come back with it.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

defaults:
  run:
    working-directory: engines/sglang

jobs:
  mutation-run:
    name: mutation-run (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARDS: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        name: the SGLang commit provenance.go pins
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^\tCommit: *"\([0-9a-f]\{40\}\)",$/\1/p' provenance.go)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # Cached under the commit it is at, as in .github/actions/oracle-env-sglang; checked against the pin.
      - id: srccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engines/sglang/sglang-source
          key: sglang-source-${{ steps.pin.outputs.commit }}
      - name: check out SGLang at that commit
        if: steps.srccache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.pin.outputs.commit }}
          path: engines/sglang/sglang-source
          fetch-depth: 1
          persist-credentials: false
      - name: the checkout is that commit
        run: |
          set -euo pipefail
          test "$(git -C sglang-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
          test -z "$(git -C sglang-source status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/go-toolchain
      - name: the mutation sweep, this shard's share
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -I oracle/mutate.py --shard "$SHARD/$SHARDS" sglang-source "$RUNNER_TEMP/mutants" | tee mutation-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.shard }}
          path: engines/sglang/mutation-results.txt
