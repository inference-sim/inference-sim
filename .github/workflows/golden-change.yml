name: golden-change

# A change that moves a byte-gate golden must say what moved and why in a commit message of the
# change, on a "Golden change:" line (scripts/golden-change-check.sh; testdata/bytegate/README.md).
# The pull request body is not read (design §4.2).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  statement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: A moved golden is explained
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git log --format=%B "$BASE..$HEAD" | bash scripts/golden-change-check.sh "$BASE" "$HEAD"
