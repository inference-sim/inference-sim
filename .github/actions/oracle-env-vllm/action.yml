name: oracle environment
description: >-
  The pinned oracle environment, as the oracle jobs of ci.yml use it: Python, vLLM checked out at the
  commit internal/upstream names as OracleCommit (the release the oracle recordings, corpora, field dispositions and lock were taken at) into vllm-source (the step fails unless the checkout is that commit), every package of oracle/requirements.lock installed from
  oracle/requirements-hashed.txt (every archive's sha256, no resolving; the step fails unless what got
  installed is exactly the lock), and the helper model's configuration at its pinned revision in
  oracle-model. The caller has checked out the repository.
inputs:
  engine-source:
    description: >-
      "true" also checks vLLM out at internal/upstream's Commit (the one the engine models) into
      vllm-engine-source, for the checks of a table derived from the pinned source rather than recorded
      at OracleCommit (the block-size table). The checkout is checked against Commit.
    required: false
    default: "false"
outputs:
  python-version:
    description: The exact Python setup-python installed.
    value: ${{ steps.python.outputs.python-version }}
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: engines/vllm/oracle/requirements-hashed.txt
    # vLLM is read from its source (for its test helpers) at internal/upstream's OracleCommit, the
    # release the oracle's recordings, fuzz corpora, field dispositions and requirements.lock are
    # for (not Commit, the one the engine models); the checkout is then checked against it, so
    # re-recording at another release changes only that constant.
    - id: pin
      name: the vLLM commit internal/upstream names as OracleCommit
      shell: bash
      working-directory: engines/vllm
      run: |
        set -euo pipefail
        commit="$(sed -n 's/^\tOracleCommit *= *"\([0-9a-f]\{40\}\)"$/\1/p' internal/upstream/upstream.go)"
        test -n "$commit"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        engine="$(sed -n 's/^\tCommit *= *"\([0-9a-f]\{40\}\)"$/\1/p' internal/upstream/upstream.go)"
        test -n "$engine"
        echo "engine-commit=$engine" >> "$GITHUB_OUTPUT"
    - name: check out vLLM at that commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: vllm-project/vllm
        ref: ${{ steps.pin.outputs.commit }}
        path: engines/vllm/vllm-source
        fetch-depth: 1
    - name: the checked-out vLLM is the pinned commit
      shell: bash
      working-directory: engines/vllm
      run: test "$(git -C vllm-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
    - name: check out vLLM at the commit the engine models
      if: inputs.engine-source == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: vllm-project/vllm
        ref: ${{ steps.pin.outputs.engine-commit }}
        path: engines/vllm/vllm-engine-source
        fetch-depth: 1
    - name: the engine-commit checkout is that commit
      if: inputs.engine-source == 'true'
      shell: bash
      working-directory: engines/vllm
      run: test "$(git -C vllm-engine-source rev-parse HEAD)" = "${{ steps.pin.outputs.engine-commit }}"
    # The whole environment is pinned (oracle/requirements.lock, every package == or a sha256
    # URL) and installed without resolving, from oracle/requirements-hashed.txt with every
    # archive's sha256 (oracle/lock.sh, X21), so neither a transitive release nor a replaced
    # archive can change a run; the step fails if what got installed is not exactly the lock.
    - name: install the oracle environment
      shell: bash
      working-directory: engines/vllm
      run: |
        set -euo pipefail
        python -I oracle/check_lock.py --hashed oracle/requirements.lock oracle/requirements-hashed.txt
        python -m pip install --require-hashes -r oracle/requirements-pip.txt
        pip install --require-hashes --no-deps --extra-index-url https://download.pytorch.org/whl/cpu -r oracle/requirements-hashed.txt
        pip check
        pip freeze > oracle-env.lock
        python -I oracle/check_lock.py oracle/requirements.lock oracle-env.lock
    # The scheduler helper's default model, as configuration only (no weights), at a pinned
    # revision, so a change on the Hub cannot change a run.
    - name: fetch the helper model's configuration at its pinned revision
      shell: bash
      working-directory: engines/vllm
      run: |
        python - <<'PY'
        from huggingface_hub import snapshot_download
        snapshot_download("facebook/opt-125m", revision="27dcfa74d334bc871f3234de431e71c6eeba5dd6",
                          local_dir="oracle-model", allow_patterns=["*.json", "*.txt"])
        PY
