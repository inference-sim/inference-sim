# actionlint's configuration (the workflow-lint job of ci.yml). The ARC scale sets named literally in
# runs-on (k8s/agents); actionlint cannot know them. The CI scale sets (k8s/ci) are named in runs-on
# expressions, which actionlint does not check.
self-hosted-runner:
  labels:
    - blis-ci-agents
    - blis-ci-pr-review
