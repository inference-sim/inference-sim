# actionlint's configuration (the workflow-lint job of ci.yml). pr-review-untrusted is the label of
# the old self-hosted runner k8s/pr-review-runner.yaml defines; actionlint cannot know it. The ARC
# scale sets (k8s/ci, k8s/agents) are named in runs-on expressions, which actionlint does not check.
self-hosted-runner:
  labels:
    - pr-review-untrusted
