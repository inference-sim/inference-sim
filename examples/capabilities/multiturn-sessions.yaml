# Multi-turn chat sessions: 60 sessions of 4 rounds each, every round carrying the context of the
# rounds before it (context_growth: accumulate). Rounds are closed-loop: a round is sent
# think_time_us after the previous round's response. Used by session-affinity.yaml and
# session-load-only.yaml.
version: "2"
seed: 42
category: reasoning
aggregate_rate: 100.0
num_requests: 240

clients:
  - id: "chat"
    tenant_id: "chat-users"
    slo_class: "standard"
    rate_fraction: 1.0
    streaming: true
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params: {mean: 256, std_dev: 30, min: 64, max: 512}
    output_distribution:
      type: gaussian
      params: {mean: 64, std_dev: 20, min: 16, max: 256}
    reasoning:
      reason_ratio_distribution:
        type: gaussian
        params: {mean: 0, std_dev: 0, min: 0, max: 0}
      multi_turn:
        max_rounds: 4
        think_time_us: 500000
        context_growth: accumulate
