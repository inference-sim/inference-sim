# Autoscaling: the model autoscaler adds and removes replicas, the cluster autoscaler adds and
# removes nodes, and an added replica pays a loading delay. Llama-3.1-70B on up to four 8-GPU H200
# nodes (two TP4 replicas per node), starting from one replica on one node. The scaling policy is
# the bundle autoscale-bundle.yaml; the workload is two bursts with a long silence between them
# (bursts-workload.yaml). cost-model-offload-tiers prices the NVMe tier the weights load from.
#
#   blis run --scenarios examples/capabilities --scenario autoscale.yaml --num-instances 1 \
#     --policy-config examples/capabilities/autoscale-bundle.yaml \
#     --workload-spec examples/capabilities/bursts-workload.yaml --horizon 120000000
kind: Scenario
name: autoscale
engine: {kind: vllm}

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-offload-tiers]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 4
  gpus_per_node: 8
---
kind: Deployment
name: autoscale

pools:
  - role: colocated
    nodes: 4
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
