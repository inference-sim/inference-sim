# Prefill/decode disaggregation with pools of unequal width: four TP4 prefill engines (two H200
# nodes) hand their KV to one TP8 decode engine (one node) over NIXL and InfiniBand. Each pool is
# sized and priced by its own layout, so the decode engine holds KV across eight ranks and the
# prefill engines across four. The router sends every request prefill-then-decode
# (router/pd-always.yaml).
#
#   blis run --scenarios examples/capabilities --scenario pd-unequal-tp.yaml \
#     --num-instances 5 --prefill-instances 4 --decode-instances 1 --rate 5 --num-requests 20
kind: Scenario
name: pd-unequal-tp
engine: {kind: vllm}

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 3
  gpus_per_node: 8
---
kind: Deployment
name: pd-unequal-tp

pools:
  - role: prefill
    nodes: 2
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
  - role: decode
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}

pd_transfer:
  connector: NixlConnector

router:
  endpoint_picker_config: router/pd-always.yaml
