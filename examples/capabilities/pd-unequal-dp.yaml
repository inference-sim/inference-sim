# Prefill/decode disaggregation with data-parallel pods of different width. MiniMax-M2.5 is a routed
# MoE, so dp is placement: the four prefill pods are one TP4 rank each (one GB200 tray), and the two
# decode pods are TP4 x DP2 with expert parallelism over two trays each. The engine builds one
# instance per data-parallel group, and each pool is sized and priced by its own layout.
#
#   blis run --scenarios examples/capabilities --scenario pd-unequal-dp.yaml \
#     --num-instances 6 --prefill-instances 4 --decode-instances 2 --rate 5 --num-requests 20
kind: Scenario
name: pd-unequal-dp
engine: {kind: vllm, version: "0.33.0"}

model: minimax-m2.5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: gb200-nvl72
  fabric: ib-400g
  nodes: 8
---
kind: Deployment
name: pd-unequal-dp

pools:
  - role: prefill
    nodes: 4
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      quantization: nvfp4
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
  - role: decode
    nodes: 4
    parallel: {tp: 4, pp: 1, dp: 2, enable_expert_parallel: true}
    engine:
      quantization: nvfp4
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}

pd_transfer:
  connector: NixlConnector

router:
  endpoint_picker_config: router/pd-always.yaml
