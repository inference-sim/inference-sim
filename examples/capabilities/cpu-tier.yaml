# KV tiers: a CPU tier below HBM. Llama-3.1-70B, one TP4 engine per node on two H200 nodes,
# with HBM budgeted so tight (gpu_memory_utilization 0.2, 258,560 KV tokens) that a workload
# of 160 distinct 2,000-token system prompts does not fit. Blocks evicted from HBM spill to the
# 512 GiB CPU tier, and a later request for the same prompt finds them there.
#
# The offload block is the deployment's only offload configuration (there is no flag).
# cost-model-offload-tiers lists the registry set that prices a tier's transfers.
#
#   blis run --scenarios examples/capabilities --scenario cpu-tier.yaml --num-instances 1 \
#     --workload-spec examples/capabilities/spill-workload.yaml --horizon 25000000
kind: Scenario
name: cpu-tier
engine: {kind: vllm}

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-offload-tiers]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: cpu-tier

pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.2
      compilation_config: {cudagraph_mode: PIECEWISE}

offload:
  connector: OffloadingConnector
  spec: TieringOffloadingSpec
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 549755813888}
