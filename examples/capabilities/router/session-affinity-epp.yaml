# A router configuration that pins a session to the endpoint that served it: the session-affinity
# scorer, strategy session_id, weighted far above the load tie-breaker. The hosted router reads the
# session identifier from the x-session-id header, which the simulated client sends on every round
# of a session. The scorer is alpha in llm-d's router, so the scenario passes
# --allow-experimental-plugins in router.epp_flags.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: session-affinity-scorer
  parameters:
    strategy: session_id
- type: queue-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: session-affinity-scorer
    weight: 100
  - pluginRef: queue-scorer
  - pluginRef: max-score-picker
