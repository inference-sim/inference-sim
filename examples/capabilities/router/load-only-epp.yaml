# The control for session-affinity-epp.yaml: the same scorers without session affinity, so a
# session's rounds go to whichever endpoint has the shortest queue.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: queue-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: queue-scorer
  - pluginRef: max-score-picker
