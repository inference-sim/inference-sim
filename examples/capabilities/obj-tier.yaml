# KV tiers: an object-store (obj) tier below the CPU tier. The device is the catalog's s3 class
# (priced by the registry's offload_tier_s3_* entries) and bytes is the bucket's size. Engines of one
# model share the bucket, so a block one engine stores another finds. Blocks the 8 GiB CPU tier
# evicts spill to the bucket and are read back on the prompt's next request.
#
#   blis run --scenarios examples/capabilities --scenario obj-tier.yaml --num-instances 1 \
#     --workload-spec examples/capabilities/spill-workload.yaml --horizon 25000000
kind: Scenario
name: obj-tier
engine: {kind: vllm}

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-offload-tiers]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 2
  gpus_per_node: 8
---
kind: Deployment
name: obj-tier

pools:
  - role: colocated
    nodes: 2
    parallel: {tp: 4, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.2
      compilation_config: {cudagraph_mode: PIECEWISE}

offload:
  connector: OffloadingConnector
  spec: TieringOffloadingSpec
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 8589934592}
    - {tier: s3, bytes: 1099511627776}
