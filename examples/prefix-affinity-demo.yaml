# BLIS Prefix-Affinity Demo Workload
#
# This workload demonstrates prefix-cache-aware routing by the llm-d router.
# 80% of requests share a long system prompt (256 tokens = 16 blocks at
# block_size=16), simulating multi-turn chat with a shared context window.
#
# With prefix_length: 256, the prefix match ratio is ~80% (16 blocks out of
# ~20 total), giving the router's prefix-cache-scorer a strong signal.
#
# ============================================================================
# TRY IT: Compare prefix-affinity vs load-only routing
# ============================================================================
#
#   # Prefix-cache scorer dominant (requests cluster onto cached instances)
#   ./blis run \
#    --scenario llama-3.1-70b-instruct-h200-tp4-4node-prefix-affinity.yaml \
#    --scenarios examples/llm-d/scenarios --registry $PWD/blis-registry \
#     --num-instances 4 \
#     --workload-spec examples/prefix-affinity-demo.yaml \
#     --trace-level decisions --summarize-trace
#
#   # Load-only (no prefix awareness; requests spread across instances)
#   ./blis run \
#    --scenario llama-3.1-70b-instruct-h200-tp4-4node-load-only.yaml \
#    --scenarios examples/llm-d/scenarios --registry $PWD/blis-registry \
#     --num-instances 4 \
#     --workload-spec examples/prefix-affinity-demo.yaml \
#     --trace-level decisions --summarize-trace
#
#   # The router's built-in default configuration (the scenario states no router)
#   ./blis run \
#     --scenario llama-3.1-70b-instruct-h200-tp4-4node.yaml \
#     --scenarios testdata/scenarios --registry $PWD/blis-registry \
#     --num-instances 4 \
#     --workload-spec examples/prefix-affinity-demo.yaml \
#     --trace-level decisions --summarize-trace
#
# Expected: prefix-affinity.yaml concentrates shared-prefix requests onto
# fewer instances (visible in Target Distribution); load-only.yaml spreads
# them across instances. Both configurations are llm-d EndpointPickerConfigs;
# see docs/guide/routing.md.
#
# Reading the result: with a single hot prefix, affinity sends almost every
# shared-prefix request to one instance. Its prefix cache then serves them all
# (per block, the cluster's hits rise slightly), but that instance carries most
# of the load, so TTFT is higher than with load-only. The summary's Cache Hit
# Rate is the plain mean of the instances' rates, so the near-idle instances
# pull it down; weight the per-instance rates by blocks to compare the two.

version: "2"
seed: 42
category: language
aggregate_rate: 500.0  # 500 requests/second
num_requests: 200

clients:
  # 80% of traffic: shared long system prompt (multi-turn chat pattern)
  - id: "chat-with-system-prompt"
    tenant_id: "tenant-A"
    slo_class: "standard"
    rate_fraction: 0.8
    streaming: true
    prefix_group: "long-system-prompt"
    prefix_length: 256           # 256 shared prefix tokens = 16 blocks
    arrival:
      process: poisson
    input_distribution:
      type: gaussian
      params:
        mean: 64                 # short user messages on top of prefix
        std_dev: 20
        min: 16
        max: 256
    output_distribution:
      type: exponential
      params:
        mean: 128

  # 20% of traffic: unique requests (no prefix sharing)
  - id: "unique-requests"
    tenant_id: "tenant-B"
    slo_class: "batch"
    rate_fraction: 0.2
    streaming: false
    arrival:
      process: poisson
    input_distribution:
      type: exponential
      params:
        mean: 512
    output_distribution:
      type: exponential
      params:
        mean: 256
