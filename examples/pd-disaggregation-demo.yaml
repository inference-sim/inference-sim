# BLIS PD Disaggregation Demo — Prefill/Decode Pool Separation
#
# This example demonstrates prefill-decode (PD) disaggregation: separating
# prefill (prompt processing) and decode (token generation) onto dedicated
# instance pools, connected by a simulated KV cache transfer network.
#
# When to use PD disaggregation:
#   - Long-context workloads where prefill computation dominates
#   - When co-location interference between prefill and decode is significant
#
# ============================================================================
# TRY IT: a disaggregated run
# ============================================================================
#
#   P/D needs a disaggregated scenario (prefill and decode pools). This repo ships
#   one: testdata/scenarios/glm-5-h200-3p1d-ib.yaml (3 one-node TP8 prefill engines,
#   1 one-node TP8 decode engine, 400G InfiniBand). The prefill/decode counts must
#   not exceed each pool's rank capacity (pool nodes x gpus_per_node / (pp x tp x pcp)).
#
#   ./blis run \
#     --scenario glm-5-h200-3p1d-ib.yaml --scenarios testdata/scenarios \
#     --registry $PWD/blis-registry \
#     --num-instances 4 \
#     --prefill-instances 3 --decode-instances 1 \
#     --epp-config examples/llm-d/pd.yaml \
#     --rate 10 --num-requests 200
#
#   Disaggregation is the llm-d router's decision. examples/llm-d/pd.yaml is an
#   EndpointPickerConfig whose disagg-profile-handler runs a "prefill" and a
#   "decode" scheduling profile; prefill and decode pods carry the llm-d.ai/role
#   label automatically, so prefill-filter and decode-filter select them.
#   Without a disagg-profile-handler no request is disaggregated.
#
# ============================================================================
# KV transfer pricing
# ============================================================================
#
#   There are no transfer flags. blis-latency-kernel prices each KV handoff
#   (PDTransferTime) over the scenario's fabric between the two instances'
#   placements; the scenario's pd_transfer block names the connector.
#
# ============================================================================
# P/D deciders (llm-d plugins)
# ============================================================================
#
#   always-disagg-pd-decider  Every request goes through the prefill pool, then
#                             KV transfer, then decode (examples/llm-d/pd.yaml)
#   prefix-based-pd-decider   Disaggregates a request when its non-cached prompt
#                             tokens reach nonCachedTokens (llm-d-router
#                             deploy/config/pd-epp-config.yaml)
#
#   See docs/guide/routing.md for the supported plugins.

priority:
  policy: constant

scheduler: fcfs
