# Load balancing on the router's own in-flight bookkeeping (inflight-load-producer +
# active-request-scorer), which is current at every decision, alongside the scraped queue,
# KV-cache and prefix-cache signals. Under load it avoids the herding of configurations that
# rank only on metrics scraped every --refresh-metrics-interval (50 ms at the least).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
plugins:
- type: inflight-load-producer
- type: active-request-scorer
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: prefix-cache-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: active-request-scorer
    weight: 2
  - pluginRef: queue-scorer
    weight: 1
  - pluginRef: kv-cache-utilization-scorer
    weight: 1
  - pluginRef: prefix-cache-scorer
    weight: 1
  - pluginRef: max-score-picker
