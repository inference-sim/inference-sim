# testdata/scenarios/llama-3.1-70b-instruct-h200-tp4-4node.yaml with the router serving the InferencePool of
# examples/llm-d/inferencepool.yaml, whose objectives give each SLO class its priority.
kind: Scenario
name: llama-3.1-70b-instruct-h200-tp4-4node
engine_version: "0.29.0"

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 4
  gpus_per_node: 8
---
kind: Deployment
name: llama-3.1-70b-instruct-h200-tp4-4node

pools:
  - role: colocated
    nodes: 4
    parallel:
      tp: 4
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.9

router:
  epp_flags: [--pool-name=blis-pool, --pool-namespace=default]
  manifests: [../inferencepool.yaml]
