# testdata/scenarios/glm-5-h200-3p1d-ib.yaml (3P1D) routed by examples/llm-d/pd.yaml: every request is
# disaggregated.
kind: Scenario
name: glm-5-h200-3p1d-ib
engine_version: "0.32.0"

model: glm-5
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 4
  gpus_per_node: 8
---
kind: Deployment
name: glm-5-h200-3p1d-ib

pools:
  - role: prefill
    nodes: 3
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 64
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
  - role: decode
    nodes: 1
    parallel:
      tp: 8
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 64
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}

pd_transfer:
  connector: NixlConnector

router:
  endpoint_picker_config: ../pd.yaml
