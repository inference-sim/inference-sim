# BLIS Policy Configuration (defaults)
#
# Use with: ./blis run --scenario <file> --scenarios <dir> \
#   --policy-config examples/policy-config.yaml
#
# All fields are optional. Omit any field to use CLI flags or built-in defaults.
# CLI flags always override YAML values when both are specified.
#
# To verify which policies are active, run with --log info.
#
# The bundle configures the engine side only. Admission, routing and flow control are the
# embedded llm-d router's, configured by the scenario's router: block and pool labels
# (see the design (https://inference-sim.github.io/blis-design/) and the EndpointPickerConfig samples in examples/llm-d/).
#
# Available policies:
#   priority:  constant (default), slo-based, inverted-slo
#
# The scheduler and preemption policy are not bundle keys: each pool's
# engine.scheduling_policy in the scenario states them (fcfs or priority, vLLM's).

priority:
  policy: constant
  # SLO class -> engine priority, used by slo-based priority (priority scheduling and
  # preemption). Omit to use the defaults shown here.
  # slo_priorities:
  #   critical: 4
  #   standard: 3
  #   batch: -1
  #   sheddable: -2
  #   background: -3

