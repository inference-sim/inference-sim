# Flow control ordered by edf-ordering-policy: earliest enqueue + request TTL first. A request's
# TTL is its client lifetime, sent as x-llm-d-inference-ttl (shorter than the 60 s default only
# for clients with a timeout under a minute).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: single-profile-handler
- type: max-score-picker
- type: queue-scorer
- type: global-strict-fairness-policy
- type: edf-ordering-policy
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: max-score-picker
  - pluginRef: queue-scorer
flowControl:
  priorityBands:
  - priority: 0
    fairnessPolicyRef: global-strict-fairness-policy
    orderingPolicyRef: edf-ordering-policy
