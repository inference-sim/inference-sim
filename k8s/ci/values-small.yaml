# gha-runner-scale-set values for blis-ci-small: 4 CPU, 16 GiB pods, the size of a GitHub-hosted
# runner, for every ci.yml job that is not large, an oracle, a gate (changes, required) or
# cache-warm's arm64 entry. They take CI's jobs out of the account's limit of 20 hosted jobs at
# once. A job comes here when the repository variable CI_RUNS_ON_SMALL is blis-ci-small, or for one
# run when a dispatch's runner_small input names it.
# The pods run pull request code, forks' included, once a maintainer approves the run (README.md).
githubConfigUrl: https://github.com/inference-sim/inference-sim
githubConfigSecret: blis-ci-github
runnerScaleSetName: blis-ci-small
minRunners: 0
# As many as the hosted limit: a full run's jobs go no slower than on hosted runners, and those
# 20 hosted slots stay free for the gate jobs and the other workflows.
maxRunners: 20
# No container mode: no Docker daemon, no Kubernetes mode, no privileged sidecar.
template:
  spec:
    # A runner needs no access to the Kubernetes API.
    automountServiceAccountToken: false
    enableServiceLinks: false
    restartPolicy: Never
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile: {type: RuntimeDefault}
    # No image of our own: GitHub's runner image only supplies the runner, which this copies into
    # the home volume, and the job runs in buildpack-deps, which has the C toolchain go test -race
    # and the engines' builds need. Both are public images pinned by digest.
    initContainers:
      - name: runner-files
        image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
        # tar, not cp -a: the volume's root belongs to root (fsGroup), so uid 1001 cannot set its
        # times; --no-overwrite-dir leaves that directory alone.
        command: ["bash", "-c", "set -o pipefail; tar -C /home/runner -cf - . | tar -C /runner-home -xf - --no-overwrite-dir"]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: home, mountPath: /runner-home}
      # The tools a hosted runner has that buildpack-deps lacks and a job here needs: jq, for the
      # scripts package's tests (REQUIRE_JQ fails them without it) and scripts/test-selected-deps.sh.
      # zstd is not among them: without it actions/cache uses gzip, and an entry's version holds the
      # compression method, so cache-warm saves the Go build cache here, where its readers run.
      # jq 1.7.1's static linux-amd64 build, checked against its release's sha256sum.txt:
      # https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
      - name: tools
        image: docker.io/library/buildpack-deps:noble@sha256:924bf5a2e44d8ad64669df739cc3a7d331dfb0a5b41815f0ca71a4819a503e8a
        command:
          - bash
          - -c
          - >-
            set -euo pipefail;
            mkdir -p /runner-home/tools;
            curl -sSfL -o /runner-home/tools/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64;
            echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /runner-home/tools/jq" | sha256sum -c -;
            chmod 0755 /runner-home/tools/jq
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: home, mountPath: /runner-home}
    containers:
      - name: runner
        image: docker.io/library/buildpack-deps:noble@sha256:924bf5a2e44d8ad64669df739cc3a7d331dfb0a5b41815f0ca71a4819a503e8a
        command: ["/home/runner/run.sh"]
        workingDir: /home/runner
        env:
          - {name: HOME, value: /home/runner}
          # The tools init container's jq first; the rest is the image's own PATH.
          - {name: PATH, value: "/home/runner/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
        resources:
          # The CPU limit equals the request: Go reads it (GOMAXPROCS follows the cgroup limit), so a
          # test that sizes its workers by the CPUs sees 4, not the node's, as on a hosted runner.
          # ephemeral-storage counts the two volumes and the logs.
          # A hosted runner's 4 CPUs and 16 GB. The request is half the memory: most jobs here use a
          # few GiB, and the quota counts requests.
          requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 20Gi}
          limits: {cpu: "4", memory: 16Gi, ephemeral-storage: 60Gi}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: home, mountPath: /home/runner}
          - {name: work, mountPath: /home/runner/_work}
    volumes:
      # The runner, its tools and the home directory (the Go build cache, the tool cache).
      - name: home
        emptyDir: {sizeLimit: 20Gi}
      # The checkout. Both volumes go with the pod.
      - name: work
        emptyDir: {sizeLimit: 40Gi}
