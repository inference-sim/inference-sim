# The quota for the CI scale sets' runner pods in the blis namespace (README.md), which already
# exists, with the ARC controller and listeners. The credentials ARC needs are a secret here: a runner pod
# mounts no secret but its own one-job registration, has no service account token, and cannot reach
# the API server (network.yaml), so it cannot read them. The quota covers every pod in blis.
#
# Requests for every runner the three scale sets can start at once: blis-ci-large 3 x 16 CPU /
# 32 GiB, blis-ci-oracle 18 x 4 CPU / 16 GiB and blis-ci-small 20 x 4 CPU / 8 GiB, so 200 CPU and
# 544 GiB, plus the ARC controller and the three listeners it starts here (README.md setup step 3),
# which take the LimitRange's defaults below. Limits: the same CPU, and 3 x 48 + 18 x 16 + 20 x 16 =
# 752 GiB of memory. Pods: 41 runners, the controller and 3 listeners, 45.
#
# Secrets: the four Helm releases (arc-blis and the three scale sets) keep up to 10 revision
# secrets each (Helm's default history), 40; the GitHub credential, 1; the three listeners'
# configs, 3; one registration secret per runner, 41. That is 85; the quota leaves 7 spare.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: blis-ci
  namespace: blis
spec:
  hard:
    requests.cpu: "201"
    requests.memory: 552Gi
    limits.cpu: "202"
    limits.memory: 800Gi
    pods: "48"
    secrets: "92"
    services: "0"
    persistentvolumeclaims: "0"
---
# Requests and limits for a container that sets none: the ARC controller and its listeners (the
# charts give them none). The runner pods set their own (values-*.yaml).
apiVersion: v1
kind: LimitRange
metadata:
  name: blis-ci-defaults
  namespace: blis
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 500m, memory: 512Mi}
