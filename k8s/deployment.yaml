# GitHub Actions self-hosted runner.
#
# This manifest is reconciled against the deployment actually running in the
# `blis` namespace. Three facts about it are load-bearing and easy to get wrong
# (all three were mis-diagnosed once; see k8s/README.md "Disk Usage"):
#
# 1. THE RUNNERS ARE EPHEMERAL. The image entrypoint tests
#    `[ -n "${EPHEMERAL}" ]` — *non-empty*, not `== "true"` — so ANY value
#    enables `--ephemeral`, including the string "false". Each container serves
#    exactly one job, then deregisters and exits; the kubelet starts a fresh
#    container with a FRESH WRITABLE LAYER. That is why Go build/module caches
#    do NOT accumulate across jobs ($HOME is /root, measured at ~1 MB) and why
#    no post-job cleanup hook is needed here.
#
# 2. DISK PRESSURE IS A SINGLE-JOB PEAK, NOT ACCUMULATION. The `blislimits`
#    LimitRange injects a DEFAULT ephemeral-storage limit of 4Gi into any
#    container that declares none. Baseline occupancy is already ~3 GB (~2.3 GB
#    writable layer, of which ~600 MB is the image's own `externals`, plus the
#    /tmp emptyDir), so one `go test ./...` on top of that exceeded 4Gi and the
#    kubelet evicted the pod with "Pod ephemeral local storage usage exceeds the
#    total limit of containers 4Gi". The fix is to declare a real limit below.
#
# 3. RUNNER NAMES MUST BE PER-POD. RUNNER_NAME comes from `metadata.name` via
#    fieldRef. A literal shared name plus config.sh `--replace` would make each
#    pod replace the previous registration and invalidate the older listener's
#    credentials, so replicas > 1 would fight. Do not hardcode it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: blis
  labels:
    app: github-runner
spec:
  replicas: 6
  selector:
    matchLabels:
      app: github-runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Never take a runner down before its replacement is Ready. A terminating
      # pod loses whatever job it was mid-way through, so prefer surging.
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: anyuid-sa
      imagePullSecrets:
      - name: dockerhub-secret
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ibm-cloud.kubernetes.io/worker-pool-name
                operator: NotIn
                values:
                - trusted-image-repo
      containers:
      - name: runner
        image: myoung34/github-runner:ubuntu-jammy
        imagePullPolicy: IfNotPresent
        env:
        - name: REPO_URL
          value: "https://github.com/inference-sim/inference-sim"
        # Per-pod unique name — see note 3 in the header comment.
        - name: RUNNER_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: LABELS
          value: "self-hosted"
        - name: RUNNER_SCOPE
          value: "repo"
        # Enables `--ephemeral` (see note 1). The entrypoint's `-n` test means
        # the VALUE is irrelevant — "true" and "false" both enable it. Spelled
        # "true" so the manifest reads the way it behaves; to genuinely disable
        # ephemeral mode this variable must be REMOVED, not set to "false".
        - name: EPHEMERAL
          value: "true"
        # Pin the runner version to the image's. Without this the runner
        # self-updates on registration, exits to apply the update, and — because
        # ephemeral mode wipes .runner on exit — re-downloads the same ~200 MB
        # update on the next container, repeatedly charging it to the
        # ephemeral-storage budget in note 2.
        - name: DISABLE_AUTO_UPDATE
          value: "true"
        - name: RUN_AS_ROOT
          value: "true"
        - name: RUNNER_WORKDIR
          value: "/tmp/runner/_work"
        - name: ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-runner-secret
              key: github_token
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
            # Measured baseline is ~3 GB, but the request is what the scheduler
            # reserves on every node, so keep it modest and let the limit carry
            # the peak. A pod stays eviction-safe from node DiskPressure while
            # under its request.
            ephemeral-storage: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
            # MUST be declared. Undeclared, the blislimits LimitRange defaults
            # it to 4Gi, which a Go build exceeds (note 2). ~3 GB baseline plus
            # a Go build/module cache peak of ~2.5 GB, with headroom.
            ephemeral-storage: "12Gi"
      volumes:
      # Sized so an overflow evicts THIS pod naming THIS volume, rather than
      # counting only against the container's total. This is the one path that
      # survives a container restart, so _work checkouts accumulate here across
      # the pod's lifetime (measured ~650 MB, bounded by actions/checkout
      # reusing the clone).
      - name: tmp
        emptyDir:
          sizeLimit: 6Gi
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
