name: mutation

# The mutation sweep (T7, oracle/mutate.py). It applies one deliberate one-line break at a time and
# fails when the suite that covers it still passes. On a pull request it sweeps only what the pull
# request changed: the listed mutants of each changed file and of each changed test file, and the
# generated mutants of each ported Go function it changed. The full sweep runs nightly, on
# release tags and on demand.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.go"
      - "oracle/**"
      - ".github/workflows/mutation.yml"
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        name: the SGLang commit provenance.go pins
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^\tCommit: *"\([0-9a-f]\{40\}\)",$/\1/p' provenance.go)"
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: check out SGLang at that commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sgl-project/sglang
          ref: ${{ steps.pin.outputs.commit }}
          path: sglang-source
          fetch-depth: 1
          persist-credentials: false
      - name: the checkout is that commit
        run: test "$(git -C sglang-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: go
        uses: ./.github/actions/go-setup
        with:
          build-cache: mutation
      - name: the mutation sweep
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mode=()
          if [ -n "${BASE:-}" ]; then mode=(--changed "$BASE"); fi
          python3 -I oracle/mutate.py "${mode[@]}" sglang-source "$RUNNER_TEMP/mutants" | tee mutation-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mutation
          path: mutation-results.txt
