name: blis

# The shared BLIS checks (design §13.2, §13.4), called from blis-substrate by commit (X21):
# the pull-request checks (description, review questions, commit policy, workflow lint,
# version literals, documentation references, cited issues, quarantine, the generated
# AGENTS.md section and pull-request template, the selected-version lint), and the
# nightly checks (cited issues stay open, X28).
#
# The commit is blis-substrate's main at its v0.14.0 tags-lock merge. go.mod selects another substrate commit (the
# TEMPORARY contracts/harness pin); the two move together to one release tag's commit when the substrate is tagged
# with contracts/harness.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the run of the head before it moot; the group is the pull request, a run on the schedule
# or by hand is never cancelled.
concurrency:
  group: blis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: inference-sim/blis-substrate/.github/workflows/shared-pr-checks.yml@00817b10798cbc00f560e51921c30c7084fa5e0c
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      repo: blis-sglang
      substrate-ref: 00817b10798cbc00f560e51921c30c7084fa5e0c

  # No BLIS repository uses a merge queue (design X22), so there is no merge job here.
  # shared-merge-check.yml stays available in blis-substrate if a queue is ever enabled.

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: inference-sim/blis-substrate/.github/workflows/shared-nightly.yml@00817b10798cbc00f560e51921c30c7084fa5e0c
    permissions:
      contents: read
      issues: read
    with:
      substrate-ref: 00817b10798cbc00f560e51921c30c7084fa5e0c
    secrets:
      INTERNAL_NAME_PATTERNS: ${{ secrets.INTERNAL_NAME_PATTERNS }}
