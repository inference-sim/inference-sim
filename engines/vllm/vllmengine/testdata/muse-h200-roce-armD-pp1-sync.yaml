kind: Scenario
name: muse-h200-roce-armD-pp1-sync
engine_version: "0.33.0"
model: muse-spark-open-816b-a42b-nvfp4
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric, cost-model-offload-tiers]
cluster:
  hardware: h200
  fabric: roce-200g
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: muse-h200-roce-armD-pp1-sync
pools:
  - role: colocated
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 8192
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      kv_cache_dtype: fp8
      async_scheduling: false
      moe_backend: marlin
      language_model_only: true
# Arm D on one node at PP1 x TP8, synchronous scheduling and no drafter: the one-batch twin of
# muse-h100-roce-armD.yaml, on one H200 node. At PP1 x TP8 with expert parallelism the engine holds 81.0 GiB of
# weights a GPU (Muse Spark's per-layer RoPE tables are resident, blis-substrate#378), which no 80 GB H100
# holds, so the twin runs on the H200 (141 GB) and the tests keep the geometry they check: eight workers, a
# worker's 65,536-byte block. It serves 8,192 tokens and states language_model_only: true: the catalog prices
# Muse's vision tower, resident by default, and these tests check the offload mapping, which the tower does not
# touch. The OffloadingConnector's CPU tier, LRU: the
# node's 512 GiB of host DRAM (the engine's cpu_bytes_to_use).
offload:
  connector: OffloadingConnector
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 549755813888}
