kind: Scenario
name: muse-h100-roce-armD-pp1-sync
engine_version: "0.33.0"
model: muse-spark-open-816b-a42b-nvfp4
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric, cost-model-offload-tiers]
cluster:
  hardware: h100
  fabric: roce-200g
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: muse-h100-roce-armD-pp1-sync
pools:
  - role: colocated
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: true}
    engine:
      block_size: 16
      max_num_seqs: 64
      max_num_batched_tokens: 8192
      max_model_len: 8192
      enable_prefix_caching: true
      gpu_memory_utilization: 0.9
      kv_cache_dtype: fp8
      async_scheduling: false
      moe_backend: marlin
      language_model_only: true
# Arm D on one node at PP1 x TP8, synchronous scheduling and no drafter: the one-batch twin of
# muse-h100-roce-armD.yaml. One H100 node's KV memory beside the weights
# (0.16 GiB a GPU, text decoder alone) holds at most an 11,664-token sequence, and vLLM refuses a longer max_model_len
# at start-up, so the twin serves 8,192 tokens. It states language_model_only: true: the catalog now prices
# Muse's vision tower, resident by default, and its 0.3 GiB a GPU does not fit in those 0.16 GiB, so the
# default would leave no KV on one H100 node. These tests check the offload mapping, which the tower does not touch. The OffloadingConnector's CPU tier, LRU: the
# node's 512 GiB of host DRAM (the engine's cpu_bytes_to_use).
offload:
  connector: OffloadingConnector
  eviction_policy: lru
  tiers:
    - {tier: cpu_dram, bytes: 549755813888}
