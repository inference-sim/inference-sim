# glm-5.3-flash on one B200 node at tp 8 with its MTP drafter: an unstated cache dtype runs as fp8 on SM10x, and the drafter
# registers the same three caches as a target sparse-MLA layer (blis-vllm#308).
kind: Scenario
name: recurrent-glm-5-3-flash-b200-tp8-mtp
engine: {kind: vllm}

model: glm-5.3-flash
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: b200
  fabric: ib-400g
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: recurrent-glm-5-3-flash-b200-tp8-mtp

pools:
  - role: colocated
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 4096
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
      speculative_config: {method: mtp, num_speculative_tokens: 1}
