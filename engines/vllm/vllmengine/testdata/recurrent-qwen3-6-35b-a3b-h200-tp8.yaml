# qwen3.6-35b-a3b on one H200 node at tp 8, at vLLM's default recurrent settings: prefix caching on, so the
# recurrent cache runs in align mode and the hybrid block-size alignment replaces the stated
# block_size. Its 256-wide attention head beside the recurrent layers was refused (inference-sim/inference-sim#2490).
kind: Scenario
name: recurrent-qwen3-6-35b-a3b-h200-tp8
engine: {kind: vllm}

model: qwen3.6-35b-a3b
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: h200
  fabric: ib-400g
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: recurrent-qwen3-6-35b-a3b-h200-tp8

pools:
  - role: colocated
    nodes: 1
    parallel: {tp: 8, pp: 1, dp: 1, enable_expert_parallel: false}
    engine:
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 4096
      gpu_memory_utilization: 0.9
      compilation_config: {cudagraph_mode: PIECEWISE}
